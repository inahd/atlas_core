<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pada — The Foot as Cosmological Mandala</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Space+Mono:wght@400;700&display=swap');
body { margin:0; background:#060c0a; display:flex; justify-content:center; align-items:center; min-height:100vh; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" style="background:#060c0a">
<defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&amp;family=Space+Mono:wght@400;700&amp;display=swap');
    .title { font-family:'Cormorant Garamond',serif; fill:#c8a96e; }
    .label { font-family:'Space Mono',monospace; fill:#4a8a5a; font-size:8px; }
    .label-bright { font-family:'Space Mono',monospace; fill:#6aaa7a; font-size:8.5px; }
    .label-dim { font-family:'Space Mono',monospace; fill:#3a6a4a; font-size:7px; }
    .attest { font-family:'Space Mono',monospace; fill:#3a5a4a; font-size:7.5px; }
    @keyframes ses-pulse { 0%{opacity:0.4} 50%{opacity:0.9} 100%{opacity:0.4} }
    @keyframes nav-glow { 0%{stroke-opacity:0.7} 50%{stroke-opacity:1.0} 100%{stroke-opacity:0.7} }
    @keyframes talus-pulse { 0%{stroke-opacity:0.6} 50%{stroke-opacity:0.95} 100%{stroke-opacity:0.6} }
    .ses-pulse { animation: ses-pulse 2s ease-in-out infinite; }
    .nav-glow { animation: nav-glow 3s ease-in-out infinite; }
    .talus-pulse { animation: talus-pulse 4s ease-in-out infinite; }
  </style>
  <filter id="glow">
    <feGaussianBlur stdDeviation="2" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow-sm">
    <feGaussianBlur stdDeviation="1" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<!-- ═══════════════════════════════════════════════════ -->
<!-- TITLE                                              -->
<!-- ═══════════════════════════════════════════════════ -->
<text x="400" y="32" text-anchor="middle" class="title" font-size="20" font-weight="600">Pada · The Foot as Cosmological Mandala</text>
<text x="400" y="50" text-anchor="middle" class="title" font-size="11" font-style="italic" opacity="0.6">26 bones · 3 arches · 7 graha · the earth interface</text>

<!-- Dividing line -->
<line x1="395" y1="65" x2="395" y2="570" stroke="#1a2a1e" stroke-width="0.5" stroke-dasharray="2,6"/>

<!-- ═══════════════════════════════════════════════════ -->
<!-- TOP VIEW (dorsal) — left half                      -->
<!-- ═══════════════════════════════════════════════════ -->
<text x="200" y="72" text-anchor="middle" class="label-bright" font-size="9">DORSAL VIEW (top down)</text>

<text x="420" y="554" class="label-dim">Phalanges = Navagraha terminals / 14 Manvantara</text>
<text x="420" y="564" class="label-dim">Sesamoids = Rāhu·Ketu / Hidden Lunar Nodes</text>
