<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atlas</title>
<style>
:root{--bg:#02030a;--panel:#070d14;--surface:#0c1520;--border:#1a2840;--gold:#f0c040;--teal:#28c8aa;--purple:#8070dd;--green:#3a8a4a;--text:#d8e8f0;--muted:#8aabbb;--dim:#567080;--red:#c84040;--amber:#c87820}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'Courier New',monospace;font-size:11px;display:grid;grid-template-rows:28px 1fr 140px 160px}
.fs{height:28px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 14px;gap:10px}
.fs-l{display:flex;align-items:center;gap:5px;flex-shrink:0}
.fs-atlas{font-size:11px;color:var(--gold);letter-spacing:.3em}
.fs-sub{font-size:9px;color:var(--dim)}
.fs-c{flex:1;text-align:center;font-size:11px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fs-c .nak{font-family:Georgia,serif;font-size:13px;color:var(--gold)}
.fs-r{display:flex;align-items:center;gap:6px;flex-shrink:0}
.fs-clk{font-size:10px;color:var(--dim)}
.fs-dot{width:6px;height:6px;border-radius:50%;background:var(--teal)}
.fs-dot.off{background:var(--dim)}
.main{display:grid;grid-template-columns:220px 1fr 220px;min-height:0;overflow:hidden}
.side{background:var(--bg);padding:8px;overflow-y:auto;overflow-x:hidden}
.side-l{border-right:1px solid var(--border)}
.side-r{border-left:1px solid var(--border)}
.center{background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.wheels{background:var(--bg);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(5,1fr);overflow:hidden}
.wheel{padding:6px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.wheel+.wheel{border-left:1px solid var(--border)}
.practice{background:var(--panel);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(4,1fr);overflow:hidden}
.prac{padding:8px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.prac+.prac{border-left:1px solid var(--border)}
.hdr{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.15em;margin-bottom:4px;flex-shrink:0}
.sep{height:1px;background:var(--border);margin:5px 0;flex-shrink:0}
.g{font-family:Georgia,serif}
.bar{width:100%;height:3px;background:var(--border);border-radius:1px;margin:3px 0}
.bar-f{height:100%;border-radius:1px}
.transit-row{display:flex;align-items:center;gap:4px;font-size:11px;border-left:2px solid var(--border);padding-left:4px;margin-bottom:1px}
.transit-row.fav{border-color:var(--green)}
.transit-row.tense{border-color:var(--red)}
.shruti-row{display:flex;gap:2px;flex-wrap:wrap;margin:3px 0}
.shruti-d{width:5px;height:5px;border-radius:50%;background:#1a2840}
.shruti-d.on{background:var(--gold)}
#ring-tooltip{position:fixed;background:rgba(7,13,20,0.97);border:1px solid #1a2840;border-radius:3px;padding:6px 10px;font-family:'Courier New',monospace;font-size:10px;color:#d8e8f0;pointer-events:none;z-index:9000;display:none;max-width:180px;line-height:1.5}
.ent-link{cursor:pointer;border-bottom:1px solid transparent;transition:border-color .15s}
.ent-link:hover{border-bottom-color:var(--gold)}
.back-btn{cursor:pointer;color:var(--dim);font-size:10px;margin-bottom:6px;display:inline-block}
.back-btn:hover{color:var(--gold)}
.attr{font-size:10px;color:var(--muted);margin-bottom:2px}
.attr b{color:var(--dim);font-weight:normal;min-width:55px;display:inline-block}
.passage{font-family:Georgia,serif;font-size:10px;color:var(--muted);font-style:italic;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin:4px 0}
.passage-src{font-size:9px;color:var(--dim);margin-bottom:4px}
</style>
</head>
<body>
<div class="fs">
  <div class="fs-l"><span class="fs-atlas">✦ ATLAS</span><span class="fs-sub">· kanjira</span></div>
  <div class="fs-c" id="fs-c">◌</div>
  <div class="fs-r"><span class="fs-clk" id="clk"></span><span class="fs-dot" id="dot"></span></div>
</div>
<div class="main">
  <div class="side side-l" id="left">◌</div>
  <div class="center" id="center-col"></div>
  <div class="side side-r" id="right">◌</div>
</div>
<div class="wheels">
  <div class="wheel" id="w-dosha"><div class="hdr">DOSHA</div></div>
  <div class="wheel" id="w-guna"><div class="hdr">GUNA</div></div>
  <div class="wheel" id="w-hora"><div class="hdr">HORA</div></div>
  <div class="wheel" id="w-tithi"><div class="hdr">TITHI QUALITY</div></div>
  <div class="wheel" id="w-muhurta"><div class="hdr">MUHURTA</div></div>
</div>
<div class="practice">
  <div class="prac" id="p-prana"><div class="hdr">PRANAYAMA</div></div>
  <div class="prac" id="p-asana"><div class="hdr">ASANA</div></div>
  <div class="prac" id="p-plant"><div class="hdr">PLANT · MEDICINE</div></div>
  <div class="prac" id="p-intent"><div class="hdr">INTENTION</div></div>
</div>
<div id="ring-tooltip"></div>

<script>
// ── Helpers ──
function p(d,path,fb){if(!d)return fb;let v=d;for(const k of path.split('.')){if(v==null)return fb;v=v[k]}if(v==null)return fb;return(typeof v==='object'&&v!==null&&'name'in v)?v.name:v}
function tick(){document.getElementById('clk').textContent=new Date().toLocaleTimeString('en-GB',{hour12:false})}
tick();setInterval(tick,1000);

// FIX DUPLICATION: clear element, keep .hdr child
function clearEl(id){
  const el=document.getElementById(id);
  const hdr=el.querySelector('.hdr');
  el.innerHTML='';
  if(hdr)el.appendChild(hdr);
  return el;
}

// SVG helpers
function svgEl(tag,attrs){const e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);return e}
function addCirc(svg,cx,cy,r,fill,op){svg.appendChild(svgEl('circle',{cx,cy,r,fill,'fill-opacity':op??1}))}
function addLine(svg,x1,y1,x2,y2,stroke,w){svg.appendChild(svgEl('line',{x1,y1,x2,y2,stroke,'stroke-width':w??0.5}))}
function addText(svg,txt,x,y,opts={}){const t=svgEl('text',{x,y,'text-anchor':opts.anchor||'middle','font-family':opts.font||"'Courier New',monospace",'font-size':opts.size||10,fill:opts.color||'#8aabbb'});t.textContent=txt;svg.appendChild(t)}
function makeSVG(w,h){const s=svgEl('svg',{width:w,height:h,viewBox:`0 0 ${w} ${h}`});return s}
function rad(deg){return(deg-90)*Math.PI/180}

// ── Tooltip ──
const tipEl=document.getElementById('ring-tooltip');
function showTip(e,html){tipEl.innerHTML=html;tipEl.style.display='block';const x=Math.min(e.clientX+10,window.innerWidth-190);const y=Math.min(e.clientY-30,window.innerHeight-60);tipEl.style.left=x+'px';tipEl.style.top=y+'px'}
function hideTip(){tipEl.style.display='none'}

// ── Ring renderer ──
function drawRing(svg,ring,cx,cy,r,opts={}){
  const{nodeSize=3,showLabels=false,showCursor=true,ringType=''}=opts;
  if(!ring)return;const st=ring.style||{};
  svg.appendChild(svgEl('circle',{cx,cy,r,fill:'none',stroke:st.ring_color||'rgba(255,255,255,0.08)','stroke-width':0.5}));
  for(const n of ring.nodes||[]){
    const a=rad(n.angle_deg||0);const x=cx+r*Math.cos(a),y=cy+r*Math.sin(a);
    const sz=n.active?(nodeSize*(n.size||1)+2):(nodeSize*(n.size||1));
    const col=n.active?(st.active_color||'#f0c040'):(n.color||'#567080');
    const op=n.active?1:0.35;
    const c=svgEl('circle',{cx:x.toFixed(1),cy:y.toFixed(1),r:sz,fill:col,'fill-opacity':op,style:'cursor:pointer'});
    const data=n.data||{};
    let tip=`<b style="color:${n.color||'#f0c040'}">${n.label_full||n.label||''}</b>`;
    if(ringType==='nakshatra')tip+=`<br>${data.deity||''} · ${data.element||''}`;
    else if(ringType==='devi')tip+=`<br>tithi ${(n.index||0)+1} · ${n.symbol||''}`;
    else if(ringType==='graha')tip+=`<br>${data.element||''} · ${n.quality||''}`;
    else if(ringType==='agricultural')tip+=`<br>${data.nakshatra||''} · ${data.season||''}`;
    c.addEventListener('mouseover',e=>showTip(e,tip));
    c.addEventListener('mousemove',e=>showTip(e,tip));
    c.addEventListener('mouseout',hideTip);
    svg.appendChild(c);
    if(showLabels&&n.active){
      const lx=cx+(r+12)*Math.cos(a),ly=cy+(r+12)*Math.sin(a);
      addText(svg,n.label||'',lx.toFixed(1),(ly+3).toFixed(1),{size:9,color:st.active_color||'#f0c040',anchor:lx>cx?'start':'end',font:'Georgia,serif'});
    }
  }
  if(showCursor&&ring.cursor){
    const a=rad(ring.cursor.angle_deg||0);const x2=cx+r*Math.cos(a),y2=cy+r*Math.sin(a);
    addLine(svg,cx,cy,x2.toFixed(1),y2.toFixed(1),st.cursor_color||'#f0c04080',0.7);
  }
}

// ── Data tables ──
const NAK_BODY={Ashwini:'feet',Bharani:'head',Krittika:'head · neck',Rohini:'forehead','Rohiṇī':'forehead',Mrigashira:'eyes · brows','Mṛgaśīrṣā':'eyes · brows',Ardra:'hair · skull','Ārdrā':'hair · skull',Punarvasu:'fingers · nose',Pushya:'face · mouth','Puṣya':'face · mouth',Ashlesha:'ears · nails','Āśleṣā':'ears · nails',Magha:'nose · lips','Maghā':'nose · lips','Purva Phalguni':'right hand','Pūrvā Phālgunī':'right hand','Uttara Phalguni':'left hand','Uttarā Phālgunī':'left hand',Hasta:'fingers','Hastā':'fingers',Chitra:'forehead · neck','Citrā':'forehead · neck',Swati:'chest · lungs','Svātī':'chest · lungs',Vishakha:'arms · breasts','Viśākhā':'arms · breasts',Anuradha:'stomach · womb','Anurādhā':'stomach · womb',Jyeshtha:'tongue · right side','Jyeṣṭhā':'tongue · right side',Mula:'feet · left side','Mūla':'feet · left side','Purva Ashadha':'thighs · back','Pūrvāṣāḍhā':'thighs · back','Uttara Ashadha':'thighs · knees','Uttarāṣāḍhā':'thighs · knees',Shravana:'ears','Śravaṇa':'ears',Dhanishtha:'back · anus','Dhaniṣṭhā':'back · anus',Shatabhisha:'right thigh','Śatabhiṣā':'right thigh','Purva Bhadrapada':'left thigh','Pūrva Bhādrapadā':'left thigh','Uttara Bhadrapada':'shins','Uttara Bhādrapadā':'shins',Revati:'feet · ankles','Revatī':'feet · ankles'};
const NAK_TYPE={Rohini:'fixed','Rohiṇī':'fixed','Uttara Phalguni':'fixed','Uttarā Phālgunī':'fixed','Uttara Ashadha':'fixed','Uttarāṣāḍhā':'fixed','Uttara Bhadrapada':'fixed','Uttara Bhādrapadā':'fixed',Swati:'movable','Svātī':'movable',Punarvasu:'movable',Pushya:'movable','Puṣya':'movable',Hasta:'movable','Hastā':'movable',Ashwini:'movable',Ardra:'sharp','Ārdrā':'sharp',Ashlesha:'sharp','Āśleṣā':'sharp',Jyeshtha:'sharp','Jyeṣṭhā':'sharp',Mula:'sharp','Mūla':'sharp',Mrigashira:'soft','Mṛgaśīrṣā':'soft',Chitra:'soft','Citrā':'soft',Anuradha:'soft','Anurādhā':'soft',Revati:'soft','Revatī':'soft'};
const NAK_ACTIVITIES={fixed:'foundation · planting · long-term',movable:'travel · trade · movement',sharp:'cutting · surgery · confrontation',soft:'art · music · fine work'};
const GRAHA_IMPACT={Jupiter:'expansion · wisdom · growth',Saturn:'discipline · restriction · karma',Mercury:'communication · mental clarity',Venus:'relationships · beauty · values',Mars:'energy · conflict · drive',Sun:'authority · vitality · purpose',Moon:'emotion · intuition · nourishment',Rahu:'obsession · amplification · desire',Ketu:'liberation · detachment · insight'};
const AUSPICIOUS_TITHIS=new Set([2,3,5,7,10,11,12,13,15,16,20,23,24,25,26,28]);
const INAUSP_TITHIS=new Set([1,8,9,22,29,30]);

// ── State ──
let F={},G={},K={},TR={},TJ={},INT={},COH={},SND={},RDG={},AUD={},RINGS={};
let online=false;
const OBS={};// observe cache
let leftMode='field',leftEntity=null;

function slugify(name){return(name||'').toLowerCase().replace(/\s+/g,'_').replace(/[āáà]/g,'a').replace(/[īíì]/g,'i').replace(/[ūúù]/g,'u').replace(/ś/g,'sh').replace(/ṣ/g,'sh').replace(/ṭ/g,'t').replace(/ḍ/g,'d').replace(/ñ/g,'n').replace(/ṇ/g,'n').replace(/ḥ/g,'h').replace(/ṃ/g,'m').replace(/[^a-z0-9_]/g,'')}
async function observe(eid){
  if(OBS[eid])return OBS[eid];
  try{const r=await fetch('/observe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({entity:eid})});const d=await r.json();OBS[eid]=d;return d}catch(e){return null}
}
function openEntity(eid,etype){leftMode='depth';leftEntity={id:eid,type:etype};observe(eid).then(()=>renderLeft())}
function closeEntity(){leftMode='field';leftEntity=null;renderLeft()}
async function fetchAll(){
  await Promise.all([
    fetch('/field').then(r=>r.json()).then(d=>{F=d;online=true}).catch(()=>{}),
    fetch('/rings').then(r=>r.json()).then(d=>RINGS=d).catch(()=>{}),
    fetch('/guild/state').then(r=>r.json()).then(d=>G=d).catch(()=>{}),
    fetch('/goloka').then(r=>r.json()).then(d=>K=d).catch(()=>{}),
    fetch('/transits').then(r=>r.json()).then(d=>TR=d).catch(()=>{}),
    fetch('/trajectory').then(r=>r.json()).then(d=>TJ=d).catch(()=>{}),
    fetch('/intention/now').then(r=>r.json()).then(d=>INT=d).catch(()=>{}),
    fetch('/coherence-score').then(r=>r.json()).then(d=>COH=d).catch(()=>{}),
    fetch('/sound/spec').then(r=>r.json()).then(d=>SND=d).catch(()=>{}),
    fetch('/reading/bandhu').then(r=>r.json()).then(d=>RDG=d).catch(()=>{}),
    fetch('/system/audio').then(r=>r.json()).then(d=>AUD=d).catch(()=>{})
  ]);render();
}
function render(){
  document.getElementById('dot').className='fs-dot'+(online?'':' off');
  renderStrip();renderLeft();renderCenter();renderRight();
  renderDosha();renderGuna();renderHora();renderTithi();renderMuhurta();
  renderPrana();renderAsana();renderPlant();renderIntent();
}

// ════ FIELD STRIP ════
function renderStrip(){
  const pa=F.panchanga||{};const ss=F.sound_state||{};
  const nak=pa.nakshatra||'—';const tithi=pa.tithi||'—';const paksha=pa.paksha||'';const vara=pa.vara||'—';
  const devi=p(F,'panchanga.devi','');const raga=ss.raga||'';const bpm=ss.bpm||'';
  let parts=['<span class="nak">'+nak+'</span>'];
  if(paksha)parts.push(paksha);parts.push(tithi,vara);
  if(devi)parts.push(devi);if(raga)parts.push(raga);if(bpm)parts.push(bpm+'bpm');
  document.getElementById('fs-c').innerHTML=parts.join(' · ');
}

// ════ LEFT PANEL ════
function renderLeft(){
  if(leftMode==='depth'&&leftEntity)return renderEntityDepth();
  const el=document.getElementById('left');const pa=F.panchanga||{};
  const nak=pa.nakshatra||'—';const nakDeity=pa.nak_data?.deity||'';
  const element=pa.element||'';const guna=pa.guna||'';
  const tidx=pa.tidx||'';const tithi=pa.tithi||'—';const paksha=pa.paksha||'';
  const yoga=typeof pa.yoga==='object'?(pa.yoga?.name||''):(pa.yoga||'');
  const karana=typeof pa.karana==='object'?(pa.karana?.name||''):(pa.karana||'');
  const vara=pa.vara||'—';const hora=F.hora||{};const horaLord=hora.hora_lord||'';
  const rk=F.rahu_kala||{};const rkActive=rk.rahu_kala_active||false;
  const rkRange=(rk.rahu_kala_start||'')+(rk.rahu_kala_start?' – ':'')+(rk.rahu_kala_end||'');
  const da=F.dasha||TJ.dasha||{};
  const daLord=da.lord||da.mahadasha||p(TJ,'dasha_lord','Mercury');
  const daEnd=da.closes||da.end_date||TJ.dasha_end||'Oct 2027';
  const daSub=da.antardasha||TJ.sub_dasha||TJ.antardasha||'';
  const dsS=new Date('2010-09-01').getTime(),dsE=new Date('2027-10-01').getTime();
  const daPct=Math.min(100,Math.max(0,((Date.now()-dsS)/(dsE-dsS))*100));
  const ap=K.ashtakala_period||{};
  const golP=ap.name||'';const golSakhi=ap.presiding_sakhi||(K.active_sakhis||[])[0]||'';
  const golSeva=ap.mood||ap.primary_seva||'';const golForest=K.active_forest?.name||'';
  const deviName=p(F,'panchanga.devi','');
  const bodyRegion=NAK_BODY[nak]||'';
  const nakType=NAK_TYPE[nak]||'mixed';
  const activities=NAK_ACTIVITIES[nakType]||'study · routine · maintenance';
  // Entity IDs for clickable links
  const nakId='nakshatra_'+slugify(nak);
  const deviId=F.panchanga?.devi?.entity_id||('devi_'+slugify(deviName));
  const horaId='graha_'+slugify(horaLord);
  const daId='graha_'+slugify(daLord);
  const anchId=G.anchor_entity_id||('plant_'+slugify(G.anchor||''));

  let h='<div class="hdr">PANCHANGA</div>';
  h+=`<span class="g ent-link" style="font-size:16px;color:var(--gold)" onclick="openEntity('${nakId}','nakshatra')">${nak}</span>`;
  if(nakDeity)h+=`<div style="color:var(--muted)">${nakDeity}</div>`;
  if(bodyRegion)h+=`<div style="color:var(--muted);font-size:10px">body: ${bodyRegion}</div>`;
  if(element||guna)h+=`<div style="color:var(--muted)">${element}${element&&guna?' · ':''}${guna}</div>`;
  h+='<div class="sep"></div>';
  h+=`<div style="font-size:13px">${tidx?tidx+' · ':''}${tithi}</div>`;
  if(paksha)h+=`<div style="color:var(--muted)">${paksha}</div>`;
  if(yoga)h+=`<div style="color:var(--muted)">yoga: ${yoga}</div>`;
  if(karana)h+=`<div style="color:var(--muted)">karana: ${karana}</div>`;
  h+=`<div style="font-size:11px">${vara}</div>`;
  if(horaLord)h+=`<div style="color:var(--muted)">hora: <span class="ent-link" onclick="openEntity('${horaId}','graha')">${horaLord}</span></div>`;
  if(rkRange)h+=`<div style="color:${rkActive?'var(--red)':'var(--dim)'}">rahu kala: ${rkRange}${rkActive?' · ACTIVE':''}</div>`;
  h+=`<div style="color:var(--dim);font-size:10px;margin-top:3px">${activities.split(' · ').map(a=>'· '+a).join('<br>')}</div>`;
  h+='<div class="sep"></div><div class="hdr">DASHA</div>';
  h+=`<span class="g ent-link" style="font-size:13px;color:var(--gold)" onclick="openEntity('${daId}','graha')">${daLord}</span> <span style="font-size:11px">daśā</span>`;
  h+=`<div style="font-size:10px;color:var(--dim)">ends ${daEnd}</div>`;
  h+=`<div class="bar"><div class="bar-f" style="width:${daPct.toFixed(1)}%;background:var(--purple)"></div></div>`;
  if(daSub)h+=`<div style="color:var(--muted);font-size:10px">sub: ${daSub}</div>`;
  if(deviName){
    h+='<div class="sep"></div><div class="hdr">DEVI</div>';
    h+=`<span class="g ent-link" style="font-size:13px;color:var(--gold)" onclick="openEntity('${deviId}','devi')">${deviName}</span>`;
  }
  h+='<div class="sep"></div><div class="hdr">GOLOKA</div>';
  if(golP)h+=`<div class="g" style="font-size:11px;color:var(--teal)">${golP}</div>`;
  if(golSakhi)h+=`<div style="color:var(--text)">${golSakhi}</div>`;
  if(golSeva)h+=`<div style="color:var(--muted);font-size:10px">${golSeva}</div>`;
  if(golForest)h+=`<div style="color:var(--dim);font-size:10px;font-style:italic">${golForest}</div>`;
  el.innerHTML=h;
}

// ════ ENTITY DEPTH (MODE B) ════
function renderEntityDepth(){
  const el=document.getElementById('left');
  const{id,type}=leftEntity;
  const d=OBS[id];
  if(!d){el.innerHTML='<span class="back-btn" onclick="closeEntity()">← back</span><div style="color:var(--dim)">◌ loading</div>';return}
  const dom=d.domains||{};
  const astro=dom.astrology?.content||{};
  const data=astro.data||{};
  const ayur=dom.ayurveda?.content||{};
  const ratna=dom.ratna?.content||{};
  const gandh=dom.gandharva?.content||{};
  const marma=dom.marma?.content||{};
  const synth=dom.synthesis?.content||'';
  const gc={Sun:'#e8c86a',Moon:'#c8d8e8',Mars:'#c84040',Mercury:'#28c8aa',Jupiter:'#c8a050',Venus:'#e8a0c0',Saturn:'#8090a8',Rahu:'#8070dd',Ketu:'#806040'};

  let h='<span class="back-btn" onclick="closeEntity()">← back</span>';
  h+=`<div class="hdr">${type.toUpperCase()}</div>`;
  const name=data.name||astro.nakshatra||astro.name||d.devi_sheet?.name||id;
  h+=`<div class="g" style="font-size:18px;color:var(--gold);margin-bottom:4px">${name}</div>`;
  if(data.emoji)h+=`<span style="font-size:20px">${data.emoji}</span> `;

  if(type==='nakshatra'){
    const nd=F.panchanga?.nak_data||{};
    if(nd.deity)h+=`<div class="attr"><b>deity</b> ${nd.deity}</div>`;
    if(nd.shakti)h+=`<div class="attr"><b>shakti</b> ${nd.shakti}</div>`;

function computeResonance(){
  const nak=(F.panchanga?.nakshatra||'').toLowerCase();const vara=F.panchanga?.vara||'';let s=50;
  if(nak.includes('rohiṇī')||nak.includes('rohini'))s+=25;else if(nak.includes('mṛga')||nak.includes('hasta'))s+=10;
  const vl={Sunday:'Sun',Monday:'Moon',Tuesday:'Mars',Wednesday:'Mercury',Thursday:'Jupiter',Friday:'Venus',Saturday:'Saturn'};
  const v=vl[Object.keys(vl).find(k=>vara.includes(k))]||'';
  if(v==='Venus')s+=15;else if(['Mercury','Saturn'].includes(v))s+=5;
  if((F.hora?.hora_lord||'').includes('Mercury'))s+=10;
  return Math.max(0,Math.min(100,s));
}

// ════ WHEELS ════
function triSVG(el,labels,colors,balance,dom){
  const w=el.clientWidth-12||120,h=90;const svg=makeSVG(w,h);
  const pts=[[w/2,6],[w-6,h-6],[6,h-6]];
  svg.appendChild(svgEl('polygon',{points:pts.map(p=>p.join(',')).join(' '),fill:'none',stroke:'#3a5a7a','stroke-width':0.8}));
  const dIdx=balance.indexOf(Math.max(...balance));
  svg.appendChild(svgEl('polygon',{points:pts.map(p=>p.join(',')).join(' '),fill:colors[dIdx],'fill-opacity':0.12}));
  const bx=pts[0][0]*balance[0]+pts[1][0]*balance[1]+pts[2][0]*balance[2];
  const by=pts[0][1]*balance[0]+pts[1][1]*balance[1]+pts[2][1]*balance[2];
  addCirc(svg,bx.toFixed(1),by.toFixed(1),6,'#ffffff',1);
  addCirc(svg,bx.toFixed(1),by.toFixed(1),8,colors[dIdx],0.3);
  labels.forEach((l,i)=>{const lx=pts[i][0]+(i===0?0:i===1?6:-6);const ly=pts[i][1]+(i===0?-2:12);addText(svg,l,lx,ly,{size:10,color:colors[i],anchor:i===0?'middle':i===1?'start':'end'})});
  el.appendChild(svg);
  const d=document.createElement('div');d.style.cssText=`font-size:11px;color:${colors[dIdx]};margin-top:2px`;d.textContent=dom;el.appendChild(d);
}

function renderDosha(){
  const el=clearEl('w-dosha');const element=(F.panchanga?.element||'').toLowerCase();
  let v=.33,pi=.33,k=.34;
  if(element.includes('air')||element.includes('ether'))v=.5;else if(element.includes('fire'))pi=.5;else if(element.includes('water')||element.includes('earth'))k=.5;
  const t=v+pi+k;v/=t;pi/=t;k/=t;
  const dom=v>=pi&&v>=k?'Vata':pi>=v&&pi>=k?'Pitta':'Kapha';
  triSVG(el,['Vata','Pitta','Kapha'],['#a090ff','#ff5050','#5080ff'],[v,pi,k],dom);
}

function renderGuna(){

function renderHora(){
  const el=clearEl('w-hora');const horaLord=F.hora?.hora_lord||'';const ch=new Date().getHours();
  const gc={Sun:'#e8c86a',Moon:'#c8d8e8',Mars:'#c84040',Mercury:'#28c8aa',Jupiter:'#c8a050',Venus:'#e8a0c0',Saturn:'#8090a8'};

    const d=`M${x1i.toFixed(1)},${y1i.toFixed(1)} L${x1o.toFixed(1)},${y1o.toFixed(1)} A${r},${r} 0 0,1 ${x2o.toFixed(1)},${y2o.toFixed(1)} L${x2i.toFixed(1)},${y2i.toFixed(1)} A${ir},${ir} 0 0,0 ${x1i.toFixed(1)},${y1i.toFixed(1)}`;
    svg.appendChild(svgEl('path',{d,fill:col,'fill-opacity':active?1:0.35,stroke:'#02030a','stroke-width':active?0.3:1}));
    if(active)svg.appendChild(svgEl('path',{d,fill:'none',stroke:'#ffffff','stroke-width':2}));
    if(i%3===0){const mr=(r+ir)/2;const mx=cx+mr*Math.cos(am),my=cy+mr*Math.sin(am);addText(svg,sym[lord]||'',mx.toFixed(1),(my+3).toFixed(1),{size:10,color:active?'#fff':'#567080'})}

function renderTithi(){
  const el=clearEl('w-tithi');const tidx=F.panchanga?.tidx||15;const tithiNum=((tidx-1)%30)+1;
  const tithiName=F.panchanga?.tithi||'—';
  const w=el.clientWidth-12||160,h=70;const svg=makeSVG(w,h);
  const bw=Math.max(3,(w-30)/30);const gap=2;
  for(let d=1;d<=30;d++){
    const x=((d-1)/29)*(w-bw);
    const isAusp=AUSPICIOUS_TITHIS.has(d);const isInausp=INAUSP_TITHIS.has(d);
    const quality=isAusp?0.85:isInausp?0.25:0.55;
    const barH=quality*(h-14);const col=isAusp?'#50c870':isInausp?'#e04040':'#c8a030';
    const isCur=d===tithiNum;
    svg.appendChild(svgEl('rect',{x:x.toFixed(1),y:(h-6-barH).toFixed(1),width:Math.max(1,bw-gap),height:barH.toFixed(1),fill:col,'fill-opacity':isCur?1:0.5,stroke:isCur?'#ffffff':'none','stroke-width':isCur?2:0,rx:1}));
    if(d===11||d===26)addCirc(svg,(x+bw/2).toFixed(1),(h-8-barH).toFixed(1),2.5,'#28c8aa',1);
    if(d===15)addCirc(svg,(x+bw/2).toFixed(1),(h-8-barH).toFixed(1),3,'#f0c040',1);
    if(d===30)addCirc(svg,(x+bw/2).toFixed(1),(h-8-barH).toFixed(1),2,'#567080',0.8);
  }
  el.appendChild(svg);
  const qLabel=AUSPICIOUS_TITHIS.has(tithiNum)?'auspicious':INAUSP_TITHIS.has(tithiNum)?'inauspicious':'mixed';
  const qColor=AUSPICIOUS_TITHIS.has(tithiNum)?'#50c870':INAUSP_TITHIS.has(tithiNum)?'#e04040':'#c8a030';
  el.insertAdjacentHTML('beforeend',`<div style="font-size:11px;color:var(--gold)">${tithiName}</div><div style="font-size:10px;color:${qColor}">${qLabel}</div>`);
}

function renderMuhurta(){
  const el=clearEl('w-muhurta');const muh=F.muhurta||{};
  const muhName=typeof muh==='object'?(muh.name||muh.muhurta||''):(muh||'');
  const muhQuality=muh.quality||muh.nature||'';
  const muhRemaining=muh.remaining||muh.time_remaining||'';
  const ql=(muhQuality+'').toLowerCase();
  const qColor=ql.includes('auspicious')||ql.includes('good')?'#50c870':ql.includes('inauspicious')?'#e04040':'#c8a030';
  let h='';
  if(muhName)h+=`<div class="g" style="font-size:12px;color:var(--gold);margin-top:3px">${muhName}</div>`;
  if(muhQuality)h+=`<div style="font-size:10px;color:${qColor}">${muhQuality}</div>`;
  if(muhRemaining)h+=`<div style="color:var(--dim);font-size:10px">${muhRemaining} remaining</div>`;
  h+=`<div style="width:100%;height:18px;background:#0c1520;border-radius:2px;margin-top:3px;position:relative;border-top:2px solid ${qColor}">`;
  h+=`<div style="position:absolute;left:0;top:0;height:100%;width:40%;background:${qColor};opacity:0.4;border-radius:2px"></div></div>`;
  const phaseNames=['New Moon','Waxing Crescent','First Quarter','Waxing Gibbous','Full Moon','Waning Gibbous','Third Quarter','Waning Crescent'];
  const tidx=F.panchanga?.tidx||15;const tithiNum=((tidx-1)%30)+1;
  const phaseIdx=Math.min(7,Math.floor((tithiNum-1)/3.75));
  const daysToFull=tithiNum<=15?(15-tithiNum):(30-tithiNum+15);
  h+=`<div style="color:var(--gold);font-size:11px;margin-top:3px">${phaseNames[phaseIdx]}</div>`;
  h+=`<div style="color:var(--muted);font-size:10px">${daysToFull} days to pūrṇimā</div>`;
  el.insertAdjacentHTML('beforeend',h);
}

function renderIntent(){
  const el=clearEl('p-intent');

  const pada=RDG.pada||RDG.excerpt||RDG.passage||RDG.text||'';const trad=RDG.tradition||RDG.source_tradition||'';
  let h='';
  if(rec)h+=`<div class="g" style="font-size:12px;color:var(--text);line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden">${rec}</div>`;
  else if(iid)h+=`<div class="g" style="font-size:12px;color:var(--text)">${iid.charAt(0).toUpperCase()+iid.slice(1)}</div>`;
  if(score)h+=`<div class="bar"><div class="bar-f" style="width:${Math.min(100,score*100)}%;background:var(--teal)"></div></div>`;

    if(trad)h+=`<div style="font-size:9px;color:var(--dim)">${trad}</div>`}

}
