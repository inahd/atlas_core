<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atlas</title>
<style>
:root{--bg:#02030a;--panel:#070d14;--surface:#0c1520;--border:#1a2840;--gold:#e0b040;--teal:#20a88a;--purple:#8070dd;--green:#3a8a4a;--text:#c8d8e8;--muted:#6a8a9a;--dim:#3a5060;--red:#c84040;--amber:#c87820}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'Courier New',monospace;font-size:10px;display:grid;grid-template-rows:28px 1fr 160px 180px}

/* ── FIELD STRIP ── */
.fs{height:28px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 14px;gap:10px}
.fs-l{display:flex;align-items:center;gap:5px;flex-shrink:0}
.fs-atlas{font-size:11px;color:var(--gold);letter-spacing:.3em}
.fs-sub{font-size:9px;color:var(--dim)}
.fs-c{flex:1;text-align:center;font-size:11px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fs-c .nak{font-family:Georgia,serif;font-size:13px;color:var(--gold)}
.fs-r{display:flex;align-items:center;gap:6px;flex-shrink:0}
.fs-clk{font-size:10px;color:var(--dim)}
.fs-dot{width:6px;height:6px;border-radius:50%;background:var(--teal)}
.fs-dot.off{background:var(--dim)}

/* ── BAND 2: MAIN ── */
.main{display:grid;grid-template-columns:220px 1fr 220px;min-height:0;overflow:hidden}
.side{background:var(--bg);padding:12px;overflow-y:auto;overflow-x:hidden}
.side-l{border-right:1px solid var(--border)}
.side-r{border-left:1px solid var(--border)}
.center{background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}

/* ── BAND 3: WHEELS ── */
.wheels{background:var(--bg);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(5,1fr);overflow:hidden}
.wheel{padding:8px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.wheel+.wheel{border-left:1px solid var(--border)}

/* ── BAND 4: PRACTICE ── */
.practice{background:var(--panel);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(4,1fr);overflow:hidden}
.prac{padding:10px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.prac+.prac{border-left:1px solid var(--border)}

/* ── SHARED ── */
.hdr{font-size:8px;color:var(--dim);text-transform:uppercase;letter-spacing:.2em;margin-bottom:5px;flex-shrink:0}
.sep{height:1px;background:var(--border);margin:6px 0;flex-shrink:0}
.r{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}
.r .k{font-size:10px;color:var(--muted);min-width:42px}
.r .v{font-size:11px;color:var(--text);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g{font-family:Georgia,serif}
.bar{width:100%;height:3px;background:var(--border);border-radius:1px;margin:3px 0}
.bar-f{height:100%;border-radius:1px}
.transit-row{display:flex;align-items:center;gap:4px;height:18px;font-size:10px;border-left:2px solid var(--border);padding-left:4px;margin-bottom:1px}
.transit-row.fav{border-color:var(--green)}
.transit-row.tense{border-color:var(--red)}
.shruti-row{display:flex;gap:2px;flex-wrap:wrap;margin:3px 0}
.shruti-d{width:5px;height:5px;border-radius:50%;background:#1a2840}
.shruti-d.on{background:var(--gold)}
</style>
</head>
<body>

<!-- ═══ BAND 1: FIELD STRIP ═══ -->
<div class="fs">
  <div class="fs-l"><span class="fs-atlas">✦ ATLAS</span><span class="fs-sub">· kanjira</span></div>
  <div class="fs-c" id="fs-c">◌</div>
  <div class="fs-r"><span class="fs-clk" id="clk"></span><span class="fs-dot" id="dot"></span></div>
</div>

<!-- ═══ BAND 2: MAIN ═══ -->
<div class="main">
  <div class="side side-l" id="left">◌</div>
  <div class="center" id="center-col"></div>
  <div class="side side-r" id="right">◌</div>
</div>

<!-- ═══ BAND 3: WHEELS ═══ -->
<div class="wheels">
  <div class="wheel" id="w-dosha"><div class="hdr">DOSHA</div></div>
  <div class="wheel" id="w-guna"><div class="hdr">GUNA</div></div>
  <div class="wheel" id="w-elem"><div class="hdr">ELEMENT</div></div>
  <div class="wheel" id="w-hora"><div class="hdr">PLANETARY HOURS</div></div>
  <div class="wheel" id="w-moon"><div class="hdr">LUNAR MONTH</div></div>
</div>

<!-- ═══ BAND 4: PRACTICE ═══ -->
<div class="practice">
  <div class="prac" id="p-prana"><div class="hdr">PRANAYAMA</div></div>
  <div class="prac" id="p-asana"><div class="hdr">ASANA</div></div>
  <div class="prac" id="p-plant"><div class="hdr">PLANT · MEDICINE</div></div>
  <div class="prac" id="p-intent"><div class="hdr">INTENTION</div></div>
</div>

<script>
// ── Helpers ──────────────────────────────────────
function p(d,path,fb){if(!d)return fb;let v=d;for(const k of path.split('.')){if(v==null)return fb;v=v[k]}if(v==null)return fb;return(typeof v==='object'&&v!==null&&'name'in v)?v.name:v}
function tick(){document.getElementById('clk').textContent=new Date().toLocaleTimeString('en-GB',{hour12:false})}
tick();setInterval(tick,1000);

// SVG helpers
function svgEl(tag,attrs){const e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);return e}
function addCirc(svg,cx,cy,r,fill,op){svg.appendChild(svgEl('circle',{cx,cy,r,fill,'fill-opacity':op??1}))}
function addLine(svg,x1,y1,x2,y2,stroke,w){svg.appendChild(svgEl('line',{x1,y1,x2,y2,stroke,'stroke-width':w??0.5}))}
function addText(svg,txt,x,y,opts={}){const t=svgEl('text',{x,y,'text-anchor':opts.anchor||'middle','font-family':opts.font||"'Courier New',monospace",'font-size':opts.size||9,fill:opts.color||'#6a8a9a'});t.textContent=txt;svg.appendChild(t)}
function addPoly(svg,pts,stroke,fill,op){svg.appendChild(svgEl('polygon',{points:pts,stroke,fill:fill||'none','fill-opacity':op??0.15,'stroke-width':0.6,'stroke-opacity':0.5}))}
function makeSVG(w,h){const s=svgEl('svg',{width:w,height:h,viewBox:`0 0 ${w} ${h}`});return s}
function rad(deg){return(deg-90)*Math.PI/180}

// ── Ring renderer ────────────────────────────────
function drawRing(svg,ring,cx,cy,r,opts={}){
  const{nodeSize=3,showLabels=false,showCursor=true}=opts;
  if(!ring)return;
  const st=ring.style||{};
  // ring circle
  svg.appendChild(svgEl('circle',{cx,cy,r,fill:'none',stroke:st.ring_color||'rgba(255,255,255,0.08)','stroke-width':0.5}));
  // nodes
  for(const n of ring.nodes||[]){
    const a=rad(n.angle_deg||0);
    const x=cx+r*Math.cos(a),y=cy+r*Math.sin(a);
    const sz=nodeSize*(n.size||1);
    const col=n.active?(st.active_color||'#e0b040'):(n.color||'#3a5060');
    const op=n.active?1:0.35;
    addCirc(svg,x.toFixed(1),y.toFixed(1),sz,col,op);
    if(showLabels&&n.active){
      const lx=cx+(r+12)*Math.cos(a),ly=cy+(r+12)*Math.sin(a);
      addText(svg,n.label||'',lx.toFixed(1),(ly+3).toFixed(1),{size:8,color:st.active_color||'#e0b040',anchor:lx>cx?'start':'end',font:'Georgia,serif'});
    }
  }
  // cursor
  if(showCursor&&ring.cursor){
    const a=rad(ring.cursor.angle_deg||0);
    const x2=cx+r*Math.cos(a),y2=cy+r*Math.sin(a);
    addLine(svg,cx,cy,x2.toFixed(1),y2.toFixed(1),st.cursor_color||'#e0b04060',0.5);
  }
}

// ── State ────────────────────────────────────────
let F={},G={},K={},TR={},TJ={},INT={},COH={},SND={},RDG={},AUD={},RINGS={};
let online=false;

async function fetchAll(){
  await Promise.all([
    fetch('/field').then(r=>r.json()).then(d=>{F=d;online=true}).catch(()=>{}),
    fetch('/rings').then(r=>r.json()).then(d=>RINGS=d).catch(()=>{}),
    fetch('/guild/state').then(r=>r.json()).then(d=>G=d).catch(()=>{}),
    fetch('/goloka').then(r=>r.json()).then(d=>K=d).catch(()=>{}),
    fetch('/transits').then(r=>r.json()).then(d=>TR=d).catch(()=>{}),
    fetch('/trajectory').then(r=>r.json()).then(d=>TJ=d).catch(()=>{}),
    fetch('/intention/now').then(r=>r.json()).then(d=>INT=d).catch(()=>{}),
    fetch('/coherence-score').then(r=>r.json()).then(d=>COH=d).catch(()=>{}),
    fetch('/sound/spec').then(r=>r.json()).then(d=>SND=d).catch(()=>{}),
    fetch('/reading/bandhu').then(r=>r.json()).then(d=>RDG=d).catch(()=>{}),
    fetch('/system/audio').then(r=>r.json()).then(d=>AUD=d).catch(()=>{})
  ]);
  render();
}

// ── Render ───────────────────────────────────────
function render(){
  document.getElementById('dot').className='fs-dot'+(online?'':' off');
  renderStrip();
  renderLeft();
  renderCenter();
  renderRight();
  renderDosha();renderGuna();renderElement();renderHora();renderMoonWave();
  renderPrana();renderAsana();renderPlant();renderIntent();
}

// ════ FIELD STRIP ════════════════════════════════
function renderStrip(){
  const pa=F.panchanga||{};
  const nak=pa.nakshatra||'—';
  const tithi=pa.tithi||'—';
  const paksha=pa.paksha||'';
  const vara=pa.vara||'—';
  const devi=p(F,'panchanga.devi','');
  const ss=F.sound_state||{};
  const raga=ss.raga||p(SND,'raga','')||'';
  const bpm=ss.bpm||p(SND,'bpm','')||'';
  let parts=['<span class="nak">'+nak+'</span>'];
  if(paksha)parts.push(paksha);
  parts.push(tithi,vara);
  if(devi)parts.push(devi);
  if(raga)parts.push(raga);
  if(bpm)parts.push(bpm+'bpm');
  document.getElementById('fs-c').innerHTML=parts.join(' · ');
}

// ════ LEFT PANEL ═════════════════════════════════
function renderLeft(){
  const el=document.getElementById('left');
  const pa=F.panchanga||{};
  const nak=pa.nakshatra||'—';
  const nakDeity=pa.nak_data?.deity||pa.tithi_deity||'';
  const element=pa.element||'';
  const guna=pa.guna||'';
  const tidx=pa.tidx||'';
  const tithi=pa.tithi||'—';
  const paksha=pa.paksha||'';
  const yoga=p(F,'panchanga.yoga','')||F.yoga||'';
  const karana=p(F,'panchanga.karana','')||F.karana||'';
  const vara=pa.vara||'—';
  const hora=F.hora||{};
  const horaLord=hora.hora_lord||'';
  const rk=F.rahu_kala||{};
  const rkActive=rk.rahu_kala_active||false;
  const rkRange=(rk.rahu_kala_start||'')+(rk.rahu_kala_start?' – ':'')+( rk.rahu_kala_end||'');
  const da=F.dasha||TJ.dasha||{};
  const daLord=da.lord||da.mahadasha||p(TJ,'dasha_lord','Mercury');
  const daEnd=da.closes||da.end_date||TJ.dasha_end||'Oct 2027';
  const daSub=da.antardasha||TJ.sub_dasha||TJ.antardasha||'';
  const dsStart=new Date('2010-09-01').getTime(),dsEnd=new Date('2027-10-01').getTime();
  const daPct=Math.min(100,Math.max(0,((Date.now()-dsStart)/(dsEnd-dsStart))*100));
  const ap=K.ashtakala_period||{};
  const golPeriod=ap.name||p(K,'ashtakala','')||'';
  const golSakhi=ap.presiding_sakhi||(K.active_sakhis||[])[0]||'';
  const golSeva=ap.mood||ap.primary_seva||'';
  const golForest=K.active_forest?.name||'';

  let h='<div class="hdr">PANCHANGA</div>';
  h+=`<div class="g" style="font-size:16px;color:var(--gold)">${nak}</div>`;
  if(nakDeity)h+=`<div style="color:var(--muted)">${nakDeity}</div>`;
  if(element||guna)h+=`<div style="color:var(--muted)">${element}${element&&guna?' · ':''}${guna}</div>`;
  h+='<div class="sep"></div>';
  h+=`<div style="font-size:12px">${tidx?tidx+' · ':''}${tithi}</div>`;
  if(paksha)h+=`<div style="color:var(--muted)">${paksha}</div>`;
  if(yoga)h+=`<div style="color:var(--muted)">yoga: ${yoga}</div>`;
  if(karana)h+=`<div style="color:var(--muted)">karana: ${karana}</div>`;
  h+=`<div style="font-size:11px">${vara}</div>`;
  if(horaLord)h+=`<div style="color:var(--muted)">hora: ${horaLord}</div>`;
  if(rkRange)h+=`<div style="color:${rkActive?'var(--red)':'var(--dim)'}">rahu kala: ${rkRange}${rkActive?' · ACTIVE':''}</div>`;
  h+='<div class="sep"></div><div class="hdr">DASHA</div>';
  h+=`<div class="g" style="font-size:13px;color:var(--gold)">${daLord} daśā</div>`;
  h+=`<div style="font-size:9px;color:var(--dim)">ends ${daEnd}</div>`;
  h+=`<div class="bar"><div class="bar-f" style="width:${daPct.toFixed(1)}%;background:var(--purple)"></div></div>`;
  if(daSub)h+=`<div style="color:var(--muted);font-size:9px">sub: ${daSub}</div>`;
  h+='<div class="sep"></div><div class="hdr">GOLOKA</div>';
  if(golPeriod)h+=`<div class="g" style="font-size:11px;color:var(--teal)">${golPeriod}</div>`;
  if(golSakhi)h+=`<div style="color:var(--text)">${golSakhi}</div>`;
  if(golSeva)h+=`<div style="color:var(--muted);font-size:9px">${golSeva}</div>`;
  if(golForest)h+=`<div style="color:var(--dim);font-size:9px;font-style:italic">${golForest}</div>`;
  el.innerHTML=h;
}

// ════ CENTER — MANDALA + RINGS ═══════════════════
function renderCenter(){
  const el=document.getElementById('center-col');
  const W=el.clientWidth,H=el.clientHeight;
  const sz=Math.min(W,H);
  const svg=makeSVG(sz,sz);
  const cx=sz/2,cy=sz/2;
  const mR=sz*0.16; // mandala half-size

  // ── Mandala zones ──
  const m=mR;
  // outer square
  svg.appendChild(svgEl('rect',{x:cx-m,y:cy-m,width:m*2,height:m*2,fill:'none',stroke:'#1a2840','stroke-width':0.8}));
  // diagonals
  addLine(svg,cx-m,cy-m,cx+m,cy+m,'#1a2840',0.3);
  addLine(svg,cx+m,cy-m,cx-m,cy+m,'#1a2840',0.3);
  // cardinals
  addLine(svg,cx,cy-m,cx,cy+m,'#1a2840',0.3);
  addLine(svg,cx-m,cy,cx+m,cy,'#1a2840',0.3);
  // center square
  const cR=m*0.35;
  svg.appendChild(svgEl('rect',{x:cx-cR,y:cy-cR,width:cR*2,height:cR*2,fill:'#e0b040','fill-opacity':0.12,stroke:'#e0b040','stroke-width':0.6,'stroke-opacity':0.4}));

  // Zone data
  const nak=F.panchanga?.nakshatra||'—';
  const anchor=typeof G.anchor==='string'?G.anchor:(G.anchor?.name||'');
  const golP=K.ashtakala_period?.name||'';
  const cohS=Math.round((COH.coherence_top||COH.score||0)*100)||0;
  const daL=F.dasha?.lord||F.dasha?.mahadasha||'Mercury';
  const ragaN=F.sound_state?.raga||p(SND,'raga','')||'';
  const trCount=(TR.hits||TR.transits||TR.aspects||[]).length;
  const resS=computeResonance();
  const zones=[
    {id:'C',x:cx,y:cy,col:'#e0b040',val:nak,deity:'Brahmā',link:'/s1'},
    {id:'N',x:cx,y:cy-m*0.6,col:'#2858b8',val:anchor,deity:'Kubera',link:'/s5'},
    {id:'NE',x:cx+m*0.55,y:cy-m*0.55,col:'#8070dd',val:golP,deity:'Īśāna',link:'/s0'},
    {id:'E',x:cx+m*0.6,y:cy,col:'#e8c870',val:resS+'%',deity:'Indra',link:'/s1'},
    {id:'SE',x:cx+m*0.55,y:cy+m*0.55,col:'#c84040',val:cohS+'%',deity:'Agni',link:'/coherence-score'},
    {id:'S',x:cx,y:cy+m*0.6,col:'#508860',val:daL,deity:'Yama',link:'/s6'},
    {id:'SW',x:cx-m*0.55,y:cy+m*0.55,col:'#4b0082',val:'',deity:'Nirṛti',link:'/research/files'},
    {id:'W',x:cx-m*0.6,y:cy,col:'#285898',val:ragaN,deity:'Varuṇa',link:'/s2'},
    {id:'NW',x:cx-m*0.55,y:cy-m*0.55,col:'#2878a8',val:trCount?trCount+' active':'',deity:'Vāyu',link:'/transits'}
  ];
  zones.forEach(z=>{
    const zr=z.id==='C'?cR:14;
    const op=z.id==='C'?0.18:0.12;
    const g=svgEl('g',{style:'cursor:pointer'});
    g.addEventListener('click',()=>location.href=z.link);
    const c=svgEl('circle',{cx:z.x.toFixed(1),cy:z.y.toFixed(1),r:zr,fill:z.col,'fill-opacity':op,stroke:z.col,'stroke-width':0.6,'stroke-opacity':0.3});
    c.addEventListener('mouseenter',()=>c.setAttribute('fill-opacity',0.3));
    c.addEventListener('mouseleave',()=>c.setAttribute('fill-opacity',op));
    g.appendChild(c);
    if(z.id==='C'){
      addText(g,'✦',cx,cy-6,{size:18,color:'#e0b040',font:'Georgia,serif'});
      addText(g,nak,cx,cy+10,{size:9,color:'#e0b040',font:'Georgia,serif'});
    }else{
      addText(g,z.id,z.x,z.y-5,{size:7,color:'#3a5060'});
      addText(g,z.deity,z.x,z.y+4,{size:8,color:'#6a8a9a',font:'Georgia,serif'});
      if(z.val)addText(g,z.val,z.x,z.y+13,{size:7,color:'#c8d8e8'});
    }
    svg.appendChild(g);
  });

  // ── Rings ──
  const rNak=RINGS.nakshatra,rDevi=RINGS.devi,rGraha=RINGS.graha,rAg=RINGS.agricultural;
  drawRing(svg,rNak,cx,cy,mR*1.5,{nodeSize:2.5,showLabels:true,showCursor:true});
  drawRing(svg,rDevi,cx,cy,mR*1.85,{nodeSize:2,showLabels:true,showCursor:true});
  drawRing(svg,rGraha,cx,cy,mR*2.2,{nodeSize:3,showLabels:true,showCursor:true});
  drawRing(svg,rAg,cx,cy,mR*2.55,{nodeSize:2,showLabels:false,showCursor:false});

  el.innerHTML='';
  el.appendChild(svg);
}

function computeResonance(){
  const nak=(F.panchanga?.nakshatra||'').toLowerCase();
  const vara=F.panchanga?.vara||'';
  let s=50;
  if(nak.includes('rohiṇī')||nak.includes('rohini'))s+=25;
  else if(nak.includes('mṛga')||nak.includes('hasta'))s+=10;
  const vl={Sunday:'Sun',Monday:'Moon',Tuesday:'Mars',Wednesday:'Mercury',Thursday:'Jupiter',Friday:'Venus',Saturday:'Saturn'};
  const v=vl[Object.keys(vl).find(k=>vara.includes(k))]||'';
  if(v==='Venus')s+=15;else if(['Mercury','Saturn'].includes(v))s+=5;
  const hora=F.hora?.hora_lord||'';
  if(hora.includes('Mercury')||hora.includes('Budha'))s+=10;
  return Math.max(0,Math.min(100,s));
}

// ════ RIGHT PANEL ════════════════════════════════
function renderRight(){
  const el=document.getElementById('right');
  const hits=TR.hits||TR.transits||TR.aspects||[];
  const gc={Sun:'#e8c86a',Moon:'#c8d8e8',Mars:'#c84040',Mercury:'#20a88a',Jupiter:'#c8a050',Venus:'#e8a0c0',Saturn:'#8090a8',Rahu:'#8070dd',Ketu:'#806040'};

  let h='<div class="hdr">TRANSITS</div>';
  if(Array.isArray(hits)&&hits.length){
    h+=hits.slice(0,6).map(t=>{
      const g=t.graha||t.transit||t.planet||'';
      const tgt=t.natal_point||t.natal||t.target||'';
      const asp=t.aspect||'';const orb=t.orb!=null?t.orb+'°':'';
      const q=(t.quality||t.nature||'').toLowerCase();
      const cls=q.includes('favor')||q.includes('good')?'fav':q.includes('tense')||q.includes('hard')?'tense':'';
      const col=gc[Object.keys(gc).find(k=>g.toLowerCase().includes(k.toLowerCase()))]||'var(--muted)';
      return `<div class="transit-row ${cls}"><span style="color:${col}">●</span> ${g}${tgt?' → '+tgt:''} <span style="color:var(--muted);font-size:9px">${asp}${orb?' '+orb:''}</span></div>`;
    }).join('');
  }else h+='<div style="color:var(--dim)">◌ no major transits</div>';

  // Sound
  const ss=F.sound_state||SND||{};
  const raga=ss.raga||p(SND,'raga','')||'';
  const tala=ss.tala||p(SND,'tala','')||'';
  const bpm=ss.bpm||p(SND,'bpm','')||'';
  const bija=ss.bija||p(SND,'bija','')||'';
  const shrutis=ss.shruti_ratios||SND.shrutis||SND.active_shrutis||[];
  h+='<div class="sep"></div><div class="hdr">SOUND</div>';
  if(raga)h+=`<div class="g" style="font-size:14px;color:var(--gold)">${raga}</div>`;

  }
  h+='</div>';
  if(bija)h+=`<div class="g" style="font-size:14px;color:var(--teal)">${bija}</div>`;

  // Guild
  h+='<div class="sep"></div><div class="hdr">GUILD</div>';

  // Intention
  h+='<div class="sep"></div><div class="hdr">INTENTION</div>';
  const rec=INT.recommendation||INT.current||INT.suggestion||'';
  const iid=(INT.intention_id||'').replace(/_/g,' ');
  const win=INT.favorable_window||INT.window||INT.time||'';
  if(rec)h+=`<div style="line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${rec}</div>`;
  else if(iid)h+=`<div style="color:var(--muted)">${iid}</div>`;
  if(win)h+=`<div style="color:var(--muted);font-size:9px">${win}</div>`;

  // System
  h+='<div class="sep"></div><div class="hdr">SYSTEM</div>';
  const audioOn=AUD.tanpura_active||AUD.tanpura||AUD.playing||false;
  h+=`<div style="font-size:9px"><span style="color:var(--teal)">●</span> kernel :5000</div>`;
  h+=`<div style="font-size:9px"><span style="color:${audioOn?'var(--teal)':'var(--amber)'}">●</span> audio om.py</div>`;
  h+=`<div style="font-size:9px"><span style="color:var(--dim)">●</span> NPU</div>`;
  h+=`<div style="font-size:9px"><span style="color:var(--dim)">●</span> iGPU</div>`;
  el.innerHTML=h;
}

// ════ WHEELS ═════════════════════════════════════
function triSVG(parent,labels,colors,balance,dom){
  const w=parent.clientWidth-16||120,h=100;
  const svg=makeSVG(w,h);
  const pts=[[w/2,6],[w-6,h-6],[6,h-6]];
  svg.appendChild(svgEl('polygon',{points:pts.map(p=>p.join(',')).join(' '),fill:'none',stroke:'#1a2840','stroke-width':0.5}));
  const dIdx=balance.indexOf(Math.max(...balance));
  svg.appendChild(svgEl('polygon',{points:pts.map(p=>p.join(',')).join(' '),fill:colors[dIdx],'fill-opacity':0.1}));
  const bx=pts[0][0]*balance[0]+pts[1][0]*balance[1]+pts[2][0]*balance[2];
  const by=pts[0][1]*balance[0]+pts[1][1]*balance[1]+pts[2][1]*balance[2];
  addCirc(svg,bx.toFixed(1),by.toFixed(1),4,'#c8d8e8',1);
  labels.forEach((l,i)=>{
    const lx=pts[i][0]+(i===0?0:i===1?6:-6);
    const ly=pts[i][1]+(i===0?-1:11);
    addText(svg,l,lx,ly,{size:9,color:colors[i],anchor:i===0?'middle':i===1?'start':'end'});
  });
  parent.appendChild(svg);
  const d=document.createElement('div');
  d.style.cssText=`font-size:10px;color:${colors[dIdx]};margin-top:2px`;
  d.textContent=dom;
  parent.appendChild(d);
}

function renderDosha(){
  const el=document.getElementById('w-dosha');
  const element=(F.panchanga?.element||'').toLowerCase();
  let v=.33,pi=.33,k=.34;
  if(element.includes('air')||element.includes('ether'))v=.5;
  else if(element.includes('fire'))pi=.5;
  else if(element.includes('water')||element.includes('earth'))k=.5;
  const t=v+pi+k;v/=t;pi/=t;k/=t;
  const dom=v>=pi&&v>=k?'Vata':pi>=v&&pi>=k?'Pitta':'Kapha';
  triSVG(el,['Vata','Pitta','Kapha'],['#8070dd','#c84040','#2858b8'],[v,pi,k],dom);
}

function renderGuna(){
  const el=document.getElementById('w-guna');
  const guna=(F.panchanga?.guna||'').toLowerCase();
  let s=.33,r=.33,t=.34;
  if(guna.includes('sattva'))s=.55;else if(guna.includes('rajas'))r=.55;else if(guna.includes('tamas'))t=.55;
  const tot=s+r+t;s/=tot;r/=tot;t/=tot;
  const dom=s>=r&&s>=t?'Sattva':r>=s&&r>=t?'Rajas':'Tamas';
  triSVG(el,['Sattva','Rajas','Tamas'],['#e0b040','#c84040','#3a5060'],[s,r,t],dom);
}

function renderElement(){
  const el=document.getElementById('w-elem');
  const cur=(F.panchanga?.element||'').toLowerCase();
  const elems=[{n:'Ether',c:'#8070dd',a:-Math.PI/2},{n:'Air',c:'#20a88a',a:-Math.PI/2+2*Math.PI/5},{n:'Fire',c:'#c84040',a:-Math.PI/2+4*Math.PI/5},{n:'Earth',c:'#c87820',a:-Math.PI/2+6*Math.PI/5},{n:'Water',c:'#2858b8',a:-Math.PI/2+8*Math.PI/5}];
  const w=el.clientWidth-16||120,h=100;
  const svg=makeSVG(w,h);
  const cx=w/2,cy=h/2+2,r=36;
  const pts=elems.map(e=>({x:cx+r*Math.cos(e.a),y:cy+r*Math.sin(e.a)}));
  svg.appendChild(svgEl('polygon',{points:pts.map(p=>p.x.toFixed(1)+','+p.y.toFixed(1)).join(' '),fill:'none',stroke:'#1a2840','stroke-width':0.5}));
  elems.forEach((e,i)=>{
    const is=cur.includes(e.n.toLowerCase());
    addCirc(svg,pts[i].x.toFixed(1),pts[i].y.toFixed(1),is?5:2.5,e.c,is?0.9:0.3);
    const lx=cx+(r+12)*Math.cos(e.a),ly=cy+(r+12)*Math.sin(e.a);
    addText(svg,e.n,lx.toFixed(1),(ly+3).toFixed(1),{size:8,color:is?e.c:'#3a5060'});
  });
  addText(svg,cur||'◌',cx,cy+3,{size:10,color:'var(--text)',font:'Georgia,serif'});
  el.appendChild(svg);
}

function renderHora(){
  const el=document.getElementById('w-hora');
  const horaLord=F.hora?.hora_lord||'';
  const ch=new Date().getHours();
  const gc={Sun:'#e8c86a',Moon:'#c8d8e8',Mars:'#c84040',Mercury:'#20a88a',Jupiter:'#c8a050',Venus:'#e8a0c0',Saturn:'#8090a8'};
  const order=['Sun','Moon','Mars','Mercury','Jupiter','Venus','Saturn'];
  let h='<div style="display:flex;height:24px;margin-top:4px">';
  for(let i=0;i<24;i++){
    const lord=order[i%7];const col=gc[lord]||'#3a5060';
    const active=i===ch;
    h+=`<div style="flex:1;background:${col};opacity:${active?1:0.5}${active?';border-top:2px solid var(--gold)':''}" title="${lord}"></div>`;
  }
  h+='</div>';
  h+=`<div style="font-size:10px;color:${gc[horaLord]||'var(--text)'};margin-top:3px">${horaLord||'—'}</div>`;
  h+='<div style="color:var(--dim);font-size:9px">current hora</div>';
  el.insertAdjacentHTML('beforeend',h);
}

function renderMoonWave(){
  const el=document.getElementById('w-moon');
  const tidx=F.panchanga?.tidx||15;
  const tithiNum=((tidx-1)%30)+1;
  const w=el.clientWidth-16||160,h=70;
  const svg=makeSVG(w,h);
  const cy=h/2;
  addLine(svg,0,cy,w,cy,'#1a2840',0.3);
  let pts=[];
  for(let d=1;d<=30;d++){
    const x=((d-1)/29)*w;
    const y=cy-Math.sin(((d-1)/30)*Math.PI*2)*22;
    pts.push(x.toFixed(1)+','+y.toFixed(1));
    if(d===15)addCirc(svg,x.toFixed(1),(cy-22).toFixed(1),2.5,'#e0b040',1);
    if(d===1||d===30)addCirc(svg,x.toFixed(1),cy.toFixed(1),2,'#3a5060',0.6);
    if(d===11||d===26)addCirc(svg,x.toFixed(1),y.toFixed(1),2,'#20a88a',0.8);
  }
  svg.appendChild(svgEl('polyline',{points:pts.join(' '),fill:'none',stroke:'#e0b040','stroke-width':0.8,'stroke-opacity':0.6}));
  const tx=((tithiNum-1)/29)*w;
  addLine(svg,tx,0,tx,h,'#e0b040',1);
  const ty=cy-Math.sin(((tithiNum-1)/30)*Math.PI*2)*22;
  addCirc(svg,tx.toFixed(1),ty.toFixed(1),3,'#e0b040',1);
  el.appendChild(svg);
  const daysToFull=tithiNum<=15?(15-tithiNum):(30-tithiNum+15);
  const phaseNames=['New','Wax Cresc','First Qtr','Wax Gibb','Full','Wan Gibb','Third Qtr','Wan Cresc'];
  const phaseIdx=Math.min(7,Math.floor((tithiNum-1)/3.75));
  el.insertAdjacentHTML('beforeend',`<div style="color:var(--muted);font-size:9px;margin-top:2px">${daysToFull} days to pūrṇimā</div><div style="color:var(--gold);font-size:10px">${phaseNames[phaseIdx]||''}</div>`);
}

function renderIntent(){
  const el=document.getElementById('p-intent');
  const rec=INT.recommendation||INT.current||INT.suggestion||'';
  const iid=(INT.intention_id||'').replace(/_/g,' ');
  const score=INT.score||0;
  const act=INT.activity||INT.activity_type||'';
  const pada=RDG.pada||RDG.excerpt||RDG.passage||RDG.text||'';
  const trad=RDG.tradition||RDG.source_tradition||'';
  let h='';
  if(rec)h+=`<div class="g" style="font-size:13px;color:var(--text);line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden">${rec}</div>`;
  else if(iid)h+=`<div class="g" style="font-size:13px;color:var(--text)">${iid.charAt(0).toUpperCase()+iid.slice(1)}</div>`;
  if(score)h+=`<div class="bar"><div class="bar-f" style="width:${Math.min(100,score*100)}%;background:var(--teal)"></div></div>`;
  if(act)h+=`<div style="color:var(--gold)">${act}</div>`;
  if(pada){
    h+=`<div class="sep"></div>`;
    h+=`<div class="g" style="font-size:9px;color:var(--muted);font-style:italic;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${pada}</div>`;
    if(trad)h+=`<div style="font-size:7px;color:var(--dim)">${trad}</div>`;
  }
  if(!h)h='<div style="color:var(--dim)">◌</div>';
  el.insertAdjacentHTML('beforeend',h);
}
