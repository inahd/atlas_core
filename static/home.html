<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atlas</title>
<link rel="stylesheet" href="/static/atlas-theme.css">
<script src="/static/atlas.js"></script>
<style>
:root{--bg:#02030a;--panel:#070d14;--gold:#f0c040;--teal:#28c8aa;--purple:#8070dd;--green:#3a8a4a;--text:#d8e8f0;--dim:#567080}
html,body{height:100%;overflow:hidden}
body{background:var(--border);font-family:'Courier New',monospace;font-size:11px;color:var(--text);display:grid;grid-template-columns:160px 1fr 160px;grid-template-rows:28px 160px 1fr 160px;gap:1px}
.g{font-family:Georgia,serif}
.hdr{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.12em;margin-bottom:4px}
.sep{height:1px;background:var(--border);margin:4px 0}
.bar{width:100%;height:3px;background:var(--border);border-radius:1px;margin:2px 0}.bar-f{height:100%;border-radius:1px}

/* ── Zones ── */
.zone{background:var(--bg);overflow:hidden;padding:6px;position:relative}
.zone-side{cursor:pointer;transition:box-shadow .15s}
.zone-side:hover{box-shadow:inset 0 0 0 1px var(--zone-color,#1a2840)}
.zone-hdr{font-size:8px;color:var(--dim);margin-bottom:3px;display:flex;gap:4px;align-items:center}
.zone-glyph{font-size:12px}

/* ── Field strip ── */
#fs{grid-column:1/-1;background:var(--panel);display:flex;align-items:center;padding:0 12px;gap:8px}
.fs-l{font-size:11px;color:var(--gold);letter-spacing:.3em;flex-shrink:0}
.fs-sub{font-size:9px;color:var(--dim);margin-left:4px}
.fs-c{flex:1;text-align:center;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fs-c .nak{font-family:Georgia,serif;font-size:13px;color:var(--gold)}
.fs-r{font-size:10px;color:var(--dim);flex-shrink:0;display:flex;align-items:center;gap:6px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--teal)}.dot.off{background:var(--dim)}

/* ── North/South bands ── */
#north{grid-column:2;display:flex;gap:1px;background:var(--border);overflow:hidden}
#north>div{background:var(--bg);flex:1;padding:6px;overflow:hidden;min-width:0}
#south{grid-column:2;display:flex;gap:1px;background:var(--border);overflow:hidden}
#south>div{background:var(--bg);flex:1;padding:6px;overflow:hidden;min-width:0}

/* ── Center ── */
#center{background:var(--bg);overflow:hidden;position:relative}
#center-content{width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow-y:auto}
#center-back{position:absolute;top:6px;left:8px;font-size:10px;color:var(--dim);cursor:pointer;display:none;z-index:10}
#center-back:hover{color:var(--gold)}
#center-label{position:absolute;top:6px;right:8px;font-size:9px;color:var(--dim);display:none}
#center-crumb{position:absolute;bottom:4px;left:8px;font-size:9px;color:var(--dim);z-index:10}
#center-crumb span{cursor:pointer}#center-crumb span:hover{color:var(--gold)}
.ent{cursor:pointer;border-bottom:1px solid transparent;transition:border-color .12s}.ent:hover{border-bottom-color:var(--gold)}

/* ── Tooltip ── */
#tip{position:fixed;background:rgba(7,13,20,.97);border:1px solid #1a2840;border-radius:3px;padding:5px 8px;font-size:10px;color:#d8e8f0;pointer-events:none;z-index:9000;display:none;max-width:200px;line-height:1.4}

/* ── Shruti ── */
.shr{display:flex;gap:2px;margin:2px 0}.shr-d{width:5px;height:5px;border-radius:50%;background:#1a2840}.shr-d.on{background:var(--gold)}

/* ── Transit ── */
.tr{display:flex;align-items:center;gap:3px;font-size:10px;border-left:2px solid var(--border);padding-left:3px;margin-bottom:1px}
.tr.fav{border-color:var(--green)}.tr.tense{border-color:var(--red)}
</style>
</head>
<body>

<!-- ═══ FIELD STRIP ═══ -->
<div id="fs" class="zone">
  <span class="fs-l">✦ ATLAS</span><span class="fs-sub">· kanjira</span>
  <div class="fs-c" id="fsc">◌</div>
  <div class="fs-r"><span id="clk"></span><span class="dot" id="dot"></span></div>
</div>

<!-- ═══ SIDE ZONES ═══ -->
<div id="nw" class="zone zone-side" style="--zone-color:#2878a8" onclick="activate('NW')"></div>
<div id="north"></div>
<div id="ne" class="zone zone-side" style="--zone-color:#8070dd" onclick="activate('NE')"></div>
<div id="w"  class="zone zone-side" style="--zone-color:#285898" onclick="activate('W')"></div>
<div id="center"><div id="center-back" onclick="goBack()">← back</div><div id="center-label"></div><div id="center-content"></div><div id="center-crumb"></div></div>
<div id="e"  class="zone zone-side" style="--zone-color:#e8c870" onclick="activate('E')"></div>
<div id="sw" class="zone zone-side" style="--zone-color:#4b0082" onclick="activate('SW')"></div>
<div id="south"></div>
<div id="se" class="zone zone-side" style="--zone-color:#c85028" onclick="activate('SE')"></div>

<div id="tip"></div>

<script>
// ══════════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════════
function p(d,path,fb){if(!d)return fb;let v=d;for(const k of path.split('.')){if(v==null)return fb;v=v[k]}if(v==null)return fb;return(typeof v==='object'&&v!==null&&'name'in v)?v.name:v}
function tick(){document.getElementById('clk').textContent=new Date().toLocaleTimeString('en-GB',{hour12:false})}
tick();setInterval(tick,1000);
function svgEl(tag,a){const e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const[k,v]of Object.entries(a))e.setAttribute(k,v);return e}
function addC(s,cx,cy,r,fill,op){s.appendChild(svgEl('circle',{cx,cy,r,fill,'fill-opacity':op??1}))}
function addL(s,x1,y1,x2,y2,stroke,w){s.appendChild(svgEl('line',{x1,y1,x2,y2,stroke,'stroke-width':w??.5}))}
function addT(s,t,x,y,o={}){const e=svgEl('text',{x,y,'text-anchor':o.anchor||'middle','font-family':o.font||"'Courier New',monospace",'font-size':o.size||9,fill:o.color||'#8aabbb'});e.textContent=t;s.appendChild(e)}
function mkSVG(w,h){return svgEl('svg',{width:'100%',height:'100%',viewBox:`0 0 ${w} ${h}`,preserveAspectRatio:'xMidYMid meet'})}
function rad(d){return(d-90)*Math.PI/180}
const tipEl=document.getElementById('tip');
function showTip(e,h){tipEl.innerHTML=h;tipEl.style.display='block';tipEl.style.left=Math.min(e.clientX+10,innerWidth-210)+'px';tipEl.style.top=Math.min(e.clientY-30,innerHeight-60)+'px'}
function hideTip(){tipEl.style.display='none'}

// ══════════════════════════════════════════════════
// GLYPHS
// ══════════════════════════════════════════════════
const G={
  gr:{Sun:'☉',Moon:'☽',Mars:'♂',Mercury:'☿',Jupiter:'♃',Venus:'♀',Saturn:'♄',Rahu:'☊',Ketu:'☋',Budha:'☿',Guru:'♃',Shukra:'♀',Shani:'♄','Śukra':'♀','Śani':'♄','Maṅgala':'♂','Sūrya':'☉','Candra':'☽','Rāhu':'☊'},
  el:{fire:'▲',water:'▽',earth:'◼',air:'⬡',ether:'●'},
  gu:{sattva:'✦',rajas:'✶',tamas:'▪'},
  ly:{S0:'●',S1:'◎',S2:'≋',S3:'◑',S4:'◈',S5:'✿',S6:'∞'},
  ak:{pratah:'◌',sangava:'◑',madhyahna:'●',aparahna:'◕',sayahna:'◐',pradosha:'◔',nisha:'○',ardharatri:'◯'},
  va:{C:'✦',N:'↑',NE:'↗',E:'→',SE:'↘',S:'↓',SW:'↙',W:'←',NW:'↖'},
  gc:{Sun:'#e8c86a',Moon:'#c8d8e8',Mars:'#c84040',Mercury:'#28c8aa',Jupiter:'#c8a050',Venus:'#e8a0c0',Saturn:'#8090a8',Rahu:'#8070dd',Ketu:'#806040'}
};

// ══════════════════════════════════════════════════
// RING RENDERER
// ══════════════════════════════════════════════════
function drawRing(svg,ring,cx,cy,r,opts={}){
  const{ns=3,labels=false,cursor=true,rtype=''}=opts;
  if(!ring)return;const st=ring.style||{};
  svg.appendChild(svgEl('circle',{cx,cy,r,fill:'none',stroke:st.ring_color||'rgba(255,255,255,.06)','stroke-width':.5}));
  for(const n of ring.nodes||[]){
    const a=rad(n.angle_deg||0),x=cx+r*Math.cos(a),y=cy+r*Math.sin(a);
    const sz=n.active?(ns+2):ns,col=n.active?(st.active_color||'#f0c040'):(n.color||'#567080'),op=n.active?1:.3;
    const c=svgEl('circle',{cx:x.toFixed(1),cy:y.toFixed(1),r:sz,fill:col,'fill-opacity':op,style:'cursor:pointer'});
    const d=n.data||{};let tt=`<b style="color:${n.color||'#f0c040'}">${n.label_full||n.label||''}</b>`;
    if(rtype==='nakshatra')tt+=`<br>${d.deity||''} · ${d.element||''}`;
    else if(rtype==='devi')tt+=`<br>tithi ${(n.index||0)+1} · ${n.symbol||''}`;
    else if(rtype==='graha')tt+=`<br>${d.element||''} · ${n.quality||''}`;
    else if(rtype==='agricultural')tt+=`<br>${d.nakshatra||''} · ${d.season||''}`;
    c.addEventListener('mouseover',e=>showTip(e,tt));c.addEventListener('mousemove',e=>showTip(e,tt));c.addEventListener('mouseout',hideTip);
    svg.appendChild(c);
    if(labels&&n.active){const lx=cx+(r+10)*Math.cos(a),ly=cy+(r+10)*Math.sin(a);addT(svg,n.label||'',lx.toFixed(1),(ly+3).toFixed(1),{size:8,color:st.active_color||'#f0c040',anchor:lx>cx?'start':'end',font:'Georgia,serif'})}
  }
  if(cursor&&ring.cursor){const a=rad(ring.cursor.angle_deg||0);addL(svg,cx,cy,(cx+r*Math.cos(a)).toFixed(1),(cy+r*Math.sin(a)).toFixed(1),st.cursor_color||'#f0c04060',.5)}
}

// ══════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════
let F={},GU={},K={},TR={},TJ={},INT={},COH={},SND={},RDG={},AUD={},RINGS={},FGLY=[];
let online=false,activeZone=null;
const OBS={};
let history=[];// [{id,type,label}]

function slug(s){return(s||'').toLowerCase().replace(/\s+/g,'_').replace(/[āáà]/g,'a').replace(/[īíì]/g,'i').replace(/[ūúù]/g,'u').replace(/ś/g,'sh').replace(/ṣ/g,'sh').replace(/ṭ/g,'t').replace(/ḍ/g,'d').replace(/ṇ/g,'n').replace(/ḥ/g,'h').replace(/ṃ/g,'m').replace(/[^a-z0-9_]/g,'')}
async function obs(eid){if(OBS[eid])return OBS[eid];const d=await atlasPost('/observe',{entity:eid},null);if(d)OBS[eid]=d;return d}

async function openEnt(eid,type,label){
  activeZone='__entity';
  history.push({id:eid,type,label:label||eid});
  const cc=document.getElementById('center-content');
  cc.innerHTML='<div style="padding:20px;color:var(--dim)">◌ loading '+eid+'</div>';
  document.getElementById('center-back').style.display='block';
  const d=await obs(eid);
  renderEntity(cc,eid,type,d);
  updateCrumb();
}
function goBack(){
  if(history.length>1){history.pop();const prev=history[history.length-1];activeZone='__entity';obs(prev.id).then(d=>{renderEntity(document.getElementById('center-content'),prev.id,prev.type,d);updateCrumb()})}
  else{history=[];deactivate()}
}
function updateCrumb(){
  const el=document.getElementById('center-crumb');
  el.innerHTML='<span onclick="history=[];deactivate()">field</span>'+history.map((h,i)=>` → <span onclick="history=history.slice(0,${i+1});obs('${h.id}').then(d=>renderEntity(document.getElementById('center-content'),'${h.id}','${h.type}',d))">${h.label}</span>`).join('');
}

async function fetchAll(){
  const results=await Promise.all([
    atlasGet('/field',DEFAULT_FIELD),
    atlasGet('/rings',{}),
    atlasGet('/guild/state',{}),
    atlasGet('/goloka',{}),
    atlasGet('/transits',{}),
    atlasGet('/trajectory',{}),
    atlasGet('/intention/now',{}),
    atlasGet('/coherence-score',{}),
    atlasGet('/sound/spec',{}),
    atlasGet('/reading/bandhu',{}),
    atlasGet('/system/audio',{}),
    atlasGet('/glyphs/field',[])
  ]);
  F=results[0]||{};online=!!F.panchanga;RINGS=results[1]||{};GU=results[2]||{};K=results[3]||{};TR=results[4]||{};TJ=results[5]||{};INT=results[6]||{};COH=results[7]||{};SND=results[8]||{};RDG=results[9]||{};AUD=results[10]||{};FGLY=results[11]||[];
  render();
}

function activate(z){if(activeZone===z){deactivate();return}activeZone=z;history=[];render()}
function deactivate(){activeZone=null;history=[];document.getElementById('center-crumb').innerHTML='';render()}

function render(){
  document.getElementById('dot').className='dot'+(online?'':' off');
  rStrip();rNW();rNorth();rNE();rW();rCenter();rE();rSW();rSouth();rSE();
}

// ══════════════════════════════════════════════════
// FIELD STRIP
// ══════════════════════════════════════════════════
function rStrip(){
  const pa=F.panchanga||{},ss=F.sound_state||{};
  const nak=pa.nakshatra||'—',tithi=pa.tithi||'—',paksha=pa.paksha||'',vara=pa.vara||'—';
  const devi=p(F,'panchanga.devi',''),raga=ss.raga||'',bpm=ss.bpm||'';
  let parts=[`<span class="nak">${nak}</span>`];
  if(paksha)parts.push(paksha);parts.push(tithi,vara);
  const deviId=F.panchanga?.devi?.entity_id||('devi_'+slug(devi));
  if(devi)parts.push(`<span class="ent" onclick="openEnt('${deviId}','devi','${devi}')">${devi}</span>`);
  if(raga)parts.push(`<span class="ent" onclick="openEnt('raga_${slug(raga)}','raga','${raga}')">${raga}</span>`);
  if(bpm)parts.push(bpm+'bpm');
  const gl=FGLY.slice(0,3).map(g=>`<span title="${g.name}" style="font-size:14px;color:${g.color}">${g.glyph}</span>`).join(' ');
  if(gl)parts.push(gl);
  document.getElementById('fsc').innerHTML=parts.join(' · ');
}

// ══════════════════════════════════════════════════
// SIDE ZONES — COMPACT WIDGETS
// ══════════════════════════════════════════════════
function rNW(){
  const el=document.getElementById('nw');
  const hits=(TR.hits||TR.transits||TR.aspects||[]).filter(t=>t.orb<10);
  let h=`<div class="zone-hdr"><span class="zone-glyph">${G.va.NW}</span> NW · Vāyu</div><div class="hdr">TRANSITS</div>`;
  if(hits.length){
    h+=hits.slice(0,3).map(t=>{
      const gr=t.transit_graha||t.graha||t.transit||'';const tgt=t.natal_point||'';
      const q=(t.quality||t.nature||'').toLowerCase();const cls=q.includes('fav')||q.includes('good')?'fav':q.includes('tense')||q.includes('hard')?'tense':'';
      return`<div class="tr ${cls}"><span style="color:${G.gc[Object.keys(G.gc).find(k=>gr.toLowerCase().includes(k.toLowerCase()))]||'var(--muted)'}">●</span><span class="ent" onclick="event.stopPropagation();openEnt('graha_${slug(gr)}','graha','${gr}')">${gr}</span>→${tgt} ${t.aspect||''}</div>`;
    }).join('');
  }else h+='<div style="color:var(--dim)">◌ clear</div>';
  el.innerHTML=h;
}

function rNE(){
  const el=document.getElementById('ne');
  const ap=K.ashtakala_period||{};const akName=(ap.name||'').toLowerCase().replace(/\s/g,'');
  const akGlyph=G.ak[akName]||'●';
  let h=`<div class="zone-hdr"><span class="zone-glyph">${G.va.NE}</span> NE · Īśāna</div>`;
  h+=`<div style="font-size:20px;color:var(--teal)">${akGlyph}</div>`;
  h+=`<div class="g" style="font-size:12px;color:var(--teal)">${ap.name||'◌'}</div>`;
  if(ap.presiding_sakhi||(K.active_sakhis||[])[0])h+=`<div style="color:var(--gold);font-size:10px">${ap.presiding_sakhi||(K.active_sakhis||[])[0]}</div>`;
  h+=`<div style="color:var(--muted);font-size:9px">${ap.mood||ap.primary_seva||''}</div>`;
  if(K.active_forest?.name)h+=`<div style="color:var(--dim);font-size:9px;font-style:italic">${K.active_forest.name}</div>`;
  const nd=K.nitya_devi||{};
  if(nd.name){const deviId=F.panchanga?.devi?.entity_id||('devi_'+slug(nd.name));h+=`<div class="sep"></div><div class="ent" style="color:var(--gold);font-size:10px" onclick="event.stopPropagation();openEnt('${deviId}','devi','${nd.name}')">${nd.bija||''} ${nd.name}</div>`}
  el.innerHTML=h;
}

function rW(){
  const el=document.getElementById('w');
  const ss=F.sound_state||SND||{};const raga=ss.raga||'';const tala=ss.tala||'';const bpm=ss.bpm||'';const bija=ss.bija||'';
  let h=`<div class="zone-hdr"><span class="zone-glyph">${G.va.W}</span> W · Varuṇa</div><div class="hdr">SOUND</div>`;
  if(raga)h+=`<div class="g ent" style="font-size:14px;color:var(--gold)" onclick="event.stopPropagation();openEnt('raga_${slug(raga)}','raga','${raga}')">${raga}</div>`;
  if(tala||bpm)h+=`<div style="color:var(--teal);font-size:10px">${tala}${bpm?' · '+bpm+'bpm':''}</div>`;
  h+='<div class="shr">';for(let i=0;i<22;i++)h+='<div class="shr-d"></div>';h+='</div>';
  if(bija)h+=`<div class="g" style="font-size:14px;color:var(--teal)">${bija}</div>`;
  if(ss.raga_time)h+=`<div style="color:var(--dim);font-size:9px">${ss.raga_time}</div>`;
  el.innerHTML=h;
}

function rE(){
  const el=document.getElementById('e');
  const res=computeRes();
  const da=F.dasha||TJ.dasha||{};const daLord=da.lord||da.mahadasha||'Mercury';
  let h=`<div class="zone-hdr"><span class="zone-glyph">${G.va.E}</span> E · Indra</div><div class="hdr">JYOTISH</div>`;
  h+=`<div class="g" style="font-size:20px;color:var(--gold)">${res}%</div>`;
  h+=`<div style="color:var(--dim);font-size:9px">field resonance</div>`;
  h+=`<div style="font-size:10px">♉ Vṛṣabha · Rohiṇī</div>`;
  h+=`<div style="font-size:10px">${G.gr[daLord]||'☿'} ${daLord} daśā</div>`;
  const hits=(TR.hits||TR.transits||TR.aspects||[]);
  if(hits[0])h+=`<div class="tr" style="font-size:9px"><span style="color:${G.gc[Object.keys(G.gc).find(k=>(hits[0].transit_graha||'').toLowerCase().includes(k.toLowerCase()))]||'var(--muted)'}">●</span> ${hits[0].transit_graha||''} ${hits[0].aspect||''}</div>`;
  el.innerHTML=h;
}

function rSW(){
  const el=document.getElementById('sw');
  let h=`<div class="zone-hdr"><span class="zone-glyph">${G.va.SW}</span> SW · Nirṛti</div><div class="hdr">SYSTEM</div>`;
  const audioOn=AUD.tanpura_active||AUD.tanpura||AUD.playing||false;
  h+=`<div style="font-size:10px"><span style="color:var(--teal)">●</span> kernel :5000</div>`;
  h+=`<div style="font-size:10px"><span style="color:${audioOn?'var(--teal)':'var(--amber)'}">●</span> audio</div>`;
  h+=`<div style="font-size:10px"><span style="color:var(--dim)">●</span> NPU</div>`;
  h+=`<div style="font-size:10px"><span style="color:var(--dim)">●</span> iGPU</div>`;
  h+=`<div class="sep"></div><div style="color:var(--dim);font-size:9px">7208 entities · 8466 edges</div>`;
  el.innerHTML=h;
}

function rSE(){
  const el=document.getElementById('se');
  let coh=COH.coherence_top||COH.score||0;if(coh<=1)coh=coh*100;coh=Math.max(0,Math.min(100,coh));
  const cohCol=coh<34?'var(--red)':coh<67?'var(--gold)':'var(--green)';
  const iid=(INT.intention_id||'').replace(/_/g,' ');
  let h=`<div class="zone-hdr"><span class="zone-glyph">${G.va.SE}</span> SE · Agni</div><div class="hdr">COHERENCE</div>`;
  h+=`<div class="g" style="font-size:20px;color:${cohCol}">${Math.round(coh)}%</div>`;
  h+=`<div style="color:var(--dim);font-size:9px">coherence</div>`;
  if(iid)h+=`<div class="sep"></div><div style="color:var(--muted);font-size:9px">${iid}</div>`;
  el.innerHTML=h;
}

function computeRes(){
  const nak=(F.panchanga?.nakshatra||'').toLowerCase(),vara=F.panchanga?.vara||'';let s=50;
  if(nak.includes('rohiṇī')||nak.includes('rohini'))s+=25;else if(nak.includes('mṛga')||nak.includes('hasta'))s+=10;
  const vl={Sunday:'Sun',Monday:'Moon',Tuesday:'Mars',Wednesday:'Mercury',Thursday:'Jupiter',Friday:'Venus',Saturday:'Saturn'};
  const v=vl[Object.keys(vl).find(k=>vara.includes(k))]||'';
  if(v==='Venus')s+=15;else if(['Mercury','Saturn'].includes(v))s+=5;
  if((F.hora?.hora_lord||'').includes('Mercury'))s+=10;
  return Math.max(0,Math.min(100,s));
}

// ══════════════════════════════════════════════════
// NORTH BAND — KALA INSTRUMENTS
// ══════════════════════════════════════════════════
function rNorth(){
  const el=document.getElementById('north');
  const pa=F.panchanga||{},hora=F.hora||{},rk=F.rahu_kala||{},da=F.dasha||TJ.dasha||{},muh=F.muhurta||{};
  const nak=pa.nakshatra||'—',tithi=pa.tithi||'—',tidx=pa.tidx||15,paksha=pa.paksha||'';

function cS(cc){
  // Ṣaḍkoṇa yantra
  const w=300,h=280;const svg=mkSVG(w,h);const cx=w/2,cy=130,r=80;
  const tastes=[{n:'Bitter',el:'ether+air',gu:'Sattva',c:'#8070dd',a:-Math.PI/2},{n:'Pungent',el:'air+fire',gu:'Rajas',c:'#c84040',a:-Math.PI/2+Math.PI/3},{n:'Salty',el:'fire+water',gu:'Rajas',c:'#c87820',a:-Math.PI/2+2*Math.PI/3},{n:'Sweet',el:'water+earth',gu:'Sattva',c:'#2858b8',a:-Math.PI/2+Math.PI},{n:'Astringent',el:'earth+air',gu:'Sattva',c:'#508860',a:-Math.PI/2+4*Math.PI/3},{n:'Sour',el:'fire+earth',gu:'Rajas',c:'#c84040',a:-Math.PI/2+5*Math.PI/3}];
  const pts=tastes.map(t=>({x:cx+r*Math.cos(t.a),y:cy+r*Math.sin(t.a)}));
  // Hexagon
  svg.appendChild(svgEl('polygon',{points:pts.map(p=>p.x.toFixed(1)+','+p.y.toFixed(1)).join(' '),fill:'none',stroke:'#3a5a7a','stroke-width':.8}));
  // Upward triangle (0,1,2 = Bitter,Pungent,Salty)
  svg.appendChild(svgEl('polygon',{points:[pts[0],pts[2],pts[4]].map(p=>p.x.toFixed(1)+','+p.y.toFixed(1)).join(' '),fill:'#c84040','fill-opacity':.06,stroke:'#c84040','stroke-width':.5,'stroke-opacity':.4}));
  // Downward triangle (3,4,5 = Sweet,Astringent,Sour)
  svg.appendChild(svgEl('polygon',{points:[pts[1],pts[3],pts[5]].map(p=>p.x.toFixed(1)+','+p.y.toFixed(1)).join(' '),fill:'#2858b8','fill-opacity':.06,stroke:'#2858b8','stroke-width':.5,'stroke-opacity':.4}));
  // Vertices + labels
  tastes.forEach((t,i)=>{
    addC(svg,pts[i].x.toFixed(1),pts[i].y.toFixed(1),5,t.c,.8);
    const lx=cx+(r+16)*Math.cos(t.a),ly=cy+(r+16)*Math.sin(t.a);
    addT(svg,t.n,lx.toFixed(1),(ly+3).toFixed(1),{size:9,color:t.c,anchor:Math.cos(t.a)>0.3?'start':Math.cos(t.a)<-0.3?'end':'middle'});
  });
  // Bindu
  const element=(F.panchanga?.element||'').toLowerCase();
  const binduIdx={fire:1,water:3,earth:5,air:0,ether:0}[element]||0;
  const bx=(cx+pts[binduIdx].x)/2,by=(cy+pts[binduIdx].y)/2;
  addC(svg,bx.toFixed(1),by.toFixed(1),6,'#f0c040',.8);
  addC(svg,bx.toFixed(1),by.toFixed(1),9,'#f0c040',.2);
  // Guna labels inside
  addT(svg,'Rajas',cx+15,cy-r*.3+3,{size:8,color:'#ff9030'});
  addT(svg,'Tamas',cx-15,cy+r*.3+3,{size:8,color:'#607080'});
  addT(svg,'Sattva',cx,cy+3,{size:9,color:'#ffd050'});
  // Title
  addT(svg,'ṢAḌKOṆA',cx,h-10,{size:10,color:'#567080'});
  cc.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%"></div>';
  cc.firstChild.appendChild(svg);
}

function renderEntity(cc,eid,type,d){
  document.getElementById('center-back').style.display='block';
  document.getElementById('center-label').style.display='block';
  document.getElementById('center-label').textContent=type;

  const dom=d.domains||{};const astro=dom.astrology?.content||{};const data=astro.data||{};
  const ayur=dom.ayurveda?.content||{};const ratna=dom.ratna?.content||{};const marma=dom.marma?.content||{};

  if(type==='nakshatra'){
    const nd=F.panchanga?.nak_data||{};
    h+='<div style="display:flex;gap:14px"><div style="flex:1;min-width:0">';
    // Identity
    h+='<div class="hdr" style="margin-top:4px">IDENTITY</div>';
    if(nd.deity)h+=`<div style="font-size:12px">${nd.deity}</div>`;
    if(nd.shakti)h+=`<div style="color:var(--muted);font-size:10px">shakti: ${nd.shakti}</div>`;
    const el0=data.element||astro.element||'';const gu0=data.guna||astro.guna||'';
    if(el0)h+=`<div style="color:var(--muted)">${G.el[el0.toLowerCase()]||''} ${el0}</div>`;
    if(gu0)h+=`<div style="color:var(--muted)">${G.gu[gu0.toLowerCase()]||''} ${gu0}</div>`;
    const nak_lord=astro.nak_lord||nd.graha||'';
    if(nak_lord){const lc=G.gc[Object.keys(G.gc).find(k=>nak_lord.toLowerCase().includes(k.toLowerCase()))]||'var(--muted)';h+=`<div><span class="ent" style="color:${lc}" onclick="openEnt('graha_${slug(nak_lord)}','graha','${nak_lord}')">${G.gr[nak_lord]||''} ${nak_lord}</span></div>`}
    if(nd.symbol)h+=`<div style="color:var(--muted);font-size:10px">symbol: ${nd.symbol}</div>`;
    if(nd.quality)h+=`<div style="color:var(--muted);font-size:10px">quality: ${nd.quality}</div>`;
    // Body
    const NAK_BODY={Ashwini:'feet',Bharani:'head',Krittika:'head · neck',Rohini:'forehead','Rohiṇī':'forehead',Mrigashira:'eyes · brows',Ardra:'hair · skull',Punarvasu:'fingers · nose',Pushya:'face · mouth',Ashlesha:'ears · nails',Magha:'nose · lips',Hasta:'fingers',Chitra:'forehead · neck',Swati:'chest · lungs',Vishakha:'arms · breasts',Anuradha:'stomach · womb',Jyeshtha:'tongue',Mula:'feet · left side','Pūrvāṣāḍhā':'thighs · back',Shravana:'ears',Dhanishtha:'back',Shatabhisha:'right thigh',Revati:'feet · ankles'};
    const br=NAK_BODY[name]||NAK_BODY[F.panchanga?.nakshatra||'']||'';
    if(br)h+=`<div style="color:var(--muted);font-size:10px">body: ${br}</div>`;
    if(marma.marma_name)h+=`<div style="color:var(--muted);font-size:10px">marma: ${marma.marma_name} (${marma.marma_location||''})</div>`;

    const NAK_ACT={fixed:'· foundation\n· permanence\n· planting',movable:'· travel\n· trade\n· change',sharp:'· surgery\n· cutting\n· confrontation',soft:'· art\n· music\n· fine work',mixed:'· study\n· routine\n· maintenance'};

    if(data.guna)h+=`<div style="color:var(--muted)">${G.gu[data.guna]||''} ${data.guna}</div>`;
    if(data.governing_graha)h+=`<div><span class="ent" style="color:var(--muted)" onclick="openEnt('graha_${slug(data.governing_graha)}','graha','${data.governing_graha}')">${G.gr[data.governing_graha]||''} ${data.governing_graha}</span></div>`;
    if(data.body_parts?.length)h+=`<div style="color:var(--muted);font-size:10px">body: ${data.body_parts.join(', ')}</div>`;

    // Iconography
    if(data.raga||ds.raga)h+=`<div style="color:var(--teal)"><span class="ent" onclick="openEnt('raga_${slug(data.raga||ds.raga)}','raga','${data.raga||ds.raga}')">raga: ${data.raga||ds.raga}</span></div>`;
    if(data.yantra_geometry_name)h+=`<div style="color:var(--muted);font-size:10px">yantra: ${data.yantra_geometry_name}</div>`;

    if(ds.description||data.process){h+='<div class="hdr" style="margin-top:4px">DESCRIPTION</div>';h+=`<div class="g" style="font-size:10px;color:var(--muted);font-style:italic;line-height:1.5">${ds.description||data.process}</div>`}
    // Adjacent devis
    if(data.tithi_number){
      const prev=data.tithi_number>1?data.tithi_number-1:15;const next=data.tithi_number<15?data.tithi_number+1:1;
      h+=`<div style="color:var(--dim);font-size:9px;margin-top:4px">tithi ${prev} ← <span style="color:var(--gold)">${data.tithi_number}</span> → tithi ${next}</div>`;

  }else{

      if(typeof v==='string'&&v)h+=`<div style="color:var(--muted);font-size:10px"><span style="color:var(--dim);min-width:60px;display:inline-block">${k}</span> ${v}</div>`;

  // Synthesis
  if(typeof synth==='string'&&synth.length>10){h+='<div class="sep"></div><div class="hdr">SYNTHESIS</div>';h+=`<div class="g" style="font-size:10px;color:var(--muted);font-style:italic;line-height:1.5">${synth}</div>`}

  h+='</div>';cc.innerHTML=h;
}

async function loadSystemStatus(){
  const d=await atlasGet('/dashboard/status',null);
  if(!d)return;
  const grid=document.getElementById('status-grid');
  if(!grid)return;
  const dot=v=>v==='ok'?'<span style="color:var(--teal)">●</span>':'<span style="color:var(--dim)">○</span>';
  const items=[
    {label:'field',value:dot(d.field)},
    {label:'corpus',value:(d.corpus?.chunks?.toLocaleString()||'0')+' chunks'},
    {label:'graph',value:(d.graph?.entities||0)+' entities'},
    {label:'sound',value:dot(d.probe?.sound)},
  ];
  if(d.probe){
    for(const[k,v]of Object.entries(d.probe)){
      if(['sound'].includes(k))continue;
      items.push({label:k,value:dot(v)});
    }
  }
  const up=d.uptime?Math.round(d.uptime/60)+'m':'—';
  grid.innerHTML='<div><span style="color:var(--gold)">uptime</span><br>'+up+'</div>'+
    items.map(i=>'<div><span style="color:var(--gold)">'+i.label+'</span><br>'+i.value+'</div>').join('');
}
loadSystemStatus();
