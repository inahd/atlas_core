<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atlas</title>
<style>
:root{--bg:#02030a;--panel:#070d14;--surface:#0c1520;--border:#1a2840;--gold:#e0b040;--teal:#20a88a;--purple:#8070dd;--green:#3a8a4a;--text:#c8d8e8;--muted:#6a8a9a;--dim:#3a5060;--red:#c84040;--amber:#c87820}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'Courier New',monospace;font-size:10px;display:flex;flex-direction:column}

/* ── FIELD STRIP ── */
.field-strip{height:28px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 14px;flex-shrink:0;gap:10px;z-index:10}
.fs-left{display:flex;align-items:center;gap:6px;flex-shrink:0}
.fs-atlas{font-size:11px;color:var(--gold);letter-spacing:0.3em}
.fs-home{font-size:10px;color:var(--dim)}
.fs-center{flex:1;text-align:center;font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fs-center .nak{font-family:Georgia,serif;color:var(--gold)}
.fs-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.fs-clock{font-size:11px;color:var(--muted)}
.fs-dot{width:5px;height:5px;border-radius:50%;background:var(--teal)}
.fs-dot.off{background:var(--dim)}

/* ── BANDS ── */
.band-north{height:28%;background:var(--bg);display:flex;border-bottom:1px solid var(--border);min-height:0;overflow:hidden}
.band-center{height:32%;background:var(--bg);display:flex;border-bottom:1px solid var(--border);min-height:0;overflow:hidden}
.band-wheels{height:18%;background:var(--bg);display:flex;border-bottom:1px solid var(--border);min-height:0;overflow:hidden}
.band-south{height:calc(22% - 28px);background:var(--panel);display:flex;min-height:0;overflow:hidden}

/* ── COLUMNS ── */
.col{flex:1;padding:8px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.col+.col{border-left:1px solid var(--border)}
.col-hdr{font-size:10px;text-transform:uppercase;color:var(--dim);letter-spacing:0.1em;margin-bottom:6px;flex-shrink:0}
.col-body{flex:1;overflow:hidden;min-height:0}

/* ── SHARED ── */
.label{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:0.08em}
.val{font-size:12px;color:var(--text)}
.val-gold{font-size:12px;color:var(--gold);font-family:Georgia,serif}
.val-teal{font-size:12px;color:var(--teal)}
.sub{font-size:10px;color:var(--muted);margin-bottom:2px}
.dim-text{font-size:10px;color:var(--dim)}
.row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}
.row .k{font-size:10px;color:var(--muted);min-width:50px}
.row .v{font-size:11px;color:var(--text);text-align:right}
.divider{height:1px;background:var(--border);margin:6px 0;flex-shrink:0}
.progress{width:100%;height:3px;background:var(--border);border-radius:1px;margin:4px 0}
.progress-fill{height:100%;border-radius:1px}

/* ── MANDALA CENTER ── */
.mandala-wrap{display:flex;align-items:center;justify-content:center;flex:1;min-width:0}
.side-panel{width:200px;padding:10px;flex-shrink:0;overflow:hidden;display:flex;flex-direction:column;gap:6px}
.side-panel .label{margin-bottom:4px}

/* ── DONUT ── */
.donut-wrap{text-align:center;margin-bottom:4px}
.donut-label{font-size:10px;color:var(--dim);text-align:center}

/* ── TRANSIT ROW ── */
.transit-row{display:flex;align-items:center;gap:4px;height:18px;font-size:10px;border-left:2px solid var(--border);padding-left:4px;margin-bottom:1px}
.transit-row.fav{border-color:var(--green)}
.transit-row.tense{border-color:var(--red)}

/* ── WHEELS ── */
.hora-bar{display:flex;height:24px;width:100%;gap:0}
.hora-seg{flex:1;opacity:0.6;position:relative}
.hora-seg.active{opacity:1;border:1px solid var(--gold);z-index:1}
.rahu-bar{height:16px;width:100%;background:var(--border);position:relative;border-radius:2px;margin:4px 0}
.rahu-fill{position:absolute;height:100%;background:var(--red);opacity:0.5;border-radius:2px}
.rahu-now{position:absolute;height:100%;width:2px;background:var(--gold)}

/* ── PRACTICE ── */
.practice-name{font-family:Georgia,serif;font-size:13px;color:var(--gold);margin-bottom:2px}
.practice-eng{font-size:10px;color:var(--text);margin-bottom:4px}
.practice-detail{font-size:10px;color:var(--muted);margin-bottom:2px}
.practice-dim{font-size:10px;color:var(--dim);margin-bottom:2px}
.reading-text{font-family:Georgia,serif;font-size:10px;color:var(--muted);font-style:italic;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ── ZONE LINKS ── */
.zone-link{cursor:pointer}
.zone-link:hover .zone-fill{opacity:0.3!important}
</style>
</head>
<body>

<!-- ═══ FIELD STRIP ═══ -->
<div class="field-strip">
  <div class="fs-left"><span class="fs-atlas">✦ ATLAS</span><span class="fs-home">· home</span></div>
  <div class="fs-center" id="fs-center">◌</div>
  <div class="fs-right"><span class="fs-clock" id="fs-clock"></span><span class="fs-dot" id="fs-dot"></span></div>
</div>

<!-- ═══ BAND 1: NORTH — TIME ═══ -->
<div class="band-north">
  <!-- Col 1: Nakshatra Wheel -->
  <div class="col">
    <div class="col-body" id="nak-wheel" style="display:flex;flex-direction:column;align-items:center;justify-content:center">◌</div>
    <div class="label" style="text-align:center">nakshatra</div>
  </div>
  <!-- Col 2: Moon -->
  <div class="col">
    <div class="col-body" id="moon-col" style="display:flex;flex-direction:column;align-items:center;justify-content:center">◌</div>
  </div>
  <!-- Col 3: Vedic Time -->
  <div class="col">
    <div class="col-body" id="vedic-col" style="overflow-y:auto">◌</div>
  </div>
  <!-- Col 4: Western Time -->
  <div class="col">
    <div class="col-body" id="western-col" style="display:flex;flex-direction:column;align-items:center;justify-content:center">◌</div>
  </div>
  <!-- Col 5: Transits -->
  <div class="col">
    <div class="col-hdr">TRANSITS</div>
    <div class="col-body" id="transits-col">◌</div>
  </div>
</div>

<!-- ═══ BAND 2: CENTER — VASTU MANDALA ═══ -->
<div class="band-center">
  <div class="side-panel" id="left-panel">◌</div>
  <div class="mandala-wrap" id="mandala-wrap">◌</div>
  <div class="side-panel" id="right-panel">◌</div>
</div>

<!-- ═══ BAND 3: WHEELS ═══ -->
<div class="band-wheels">
  <div class="col"><div class="col-hdr">DOSHA</div><div class="col-body" id="dosha-col">◌</div></div>
  <div class="col"><div class="col-hdr">GUNA</div><div class="col-body" id="guna-col">◌</div></div>
  <div class="col"><div class="col-hdr">ELEMENT</div><div class="col-body" id="element-col">◌</div></div>
  <div class="col"><div class="col-hdr">PLANETARY HOURS</div><div class="col-body" id="hora-col">◌</div></div>
  <div class="col"><div class="col-hdr">RAHU KALA</div><div class="col-body" id="rahu-col">◌</div></div>
</div>

<!-- ═══ BAND 4: SOUTH — PRACTICE ═══ -->
<div class="band-south">
  <div class="col"><div class="col-hdr">PRANAYAMA</div><div class="col-body" id="prana-col">◌</div></div>
  <div class="col"><div class="col-hdr">ASANA</div><div class="col-body" id="asana-col">◌</div></div>
  <div class="col"><div class="col-hdr">PLANT · MEDICINE</div><div class="col-body" id="plant-col">◌</div></div>
  <div class="col"><div class="col-hdr">INTENTION</div><div class="col-body" id="intent-col">◌</div></div>
</div>

<script>
// ── Helpers ──
function p(d,path,fb){let v=d;for(const k of path.split('.')){if(!v)return fb;v=v[k]}return(typeof v==='object'&&v!==null)?(v.name||fb):v||fb}
function tick(){document.getElementById('fs-clock').textContent=new Date().toLocaleTimeString('en-GB',{hour12:false})}
tick();setInterval(tick,1000);

const nakshatras=['Ashvini','Bharani','Krittika','Rohini','Mrigashira','Ardra','Punarvasu','Pushya','Ashlesha','Magha','Purva Phalguni','Uttara Phalguni','Hasta','Chitra','Svati','Vishakha','Anuradha','Jyeshtha','Mula','Purva Ashadha','Uttara Ashadha','Shravana','Dhanishtha','Shatabhisha','Purva Bhadrapada','Uttara Bhadrapada','Revati'];
const zodiacGlyphs=['♈','♉','♊','♋','♌','♍','♎','♏','♐','♑','♒','♓'];
const zodiacNames=['Aries','Taurus','Gemini','Cancer','Leo','Virgo','Libra','Scorpio','Sagittarius','Capricorn','Aquarius','Pisces'];
const grahaColors={Sun:'#e8c86a',Moon:'#c8d8e8',Mars:'#c84040',Mercury:'#20a88a',Jupiter:'#c8a050',Venus:'#e8a0c0',Saturn:'#8090a8',Rahu:'#8070dd',Ketu:'#806040'};
const horaOrder=['Sun','Moon','Mars','Mercury','Jupiter','Venus','Saturn'];
const dashaStart=new Date('2010-09-01').getTime(),dashaEnd=new Date('2027-10-01').getTime();

// ── State ──
let F={},G={},K={},TR={},NAT={},TJ={},INT={},COH={},SND={},RDG={},AUD={};
let online=false;

// ── Fetch all ──
async function fetchAll(){
  const fetches=[
    fetch('/field').then(r=>r.json()).then(d=>{F=d;online=true}).catch(()=>{}),
    fetch('/guild/state').then(r=>r.json()).then(d=>G=d).catch(()=>{}),
    fetch('/goloka').then(r=>r.json()).then(d=>K=d).catch(()=>{}),
    fetch('/transits').then(r=>r.json()).then(d=>TR=d).catch(()=>{}),
    fetch('/natal').then(r=>r.json()).then(d=>NAT=d).catch(()=>{}),
    fetch('/trajectory').then(r=>r.json()).then(d=>TJ=d).catch(()=>{}),
    fetch('/intention/now').then(r=>r.json()).then(d=>INT=d).catch(()=>{}),
    fetch('/coherence-score').then(r=>r.json()).then(d=>COH=d).catch(()=>{}),
    fetch('/sound/spec').then(r=>r.json()).then(d=>SND=d).catch(()=>{}),
    fetch('/reading/bandhu').then(r=>r.json()).then(d=>RDG=d).catch(()=>{}),
    fetch('/system/audio').then(r=>r.json()).then(d=>AUD=d).catch(()=>{})
  ];
  await Promise.all(fetches);
  render();
}

// ── Main render ──
function render(){
  renderFieldStrip();
  renderNakWheel();
  renderMoon();
  renderVedic();
  renderWestern();
  renderTransits();
  renderMandala();
  renderLeftPanel();
  renderRightPanel();
  renderDosha();
  renderGuna();
  renderElement();
  renderHora();
  renderRahu();
  renderPranayama();
  renderAsana();
  renderPlant();
  renderIntention();
  document.getElementById('fs-dot').className='fs-dot'+(online?'':' off');
}

// ════════════════════════════════════════════════
// FIELD STRIP
// ════════════════════════════════════════════════
function renderFieldStrip(){
  const pa=F.panchanga||{};
  const nak=p(F,'panchanga.nakshatra','—');
  const tithi=p(F,'panchanga.tithi','—');
  const paksha=pa.paksha||pa.tithi?.paksha||'';
  const vara=p(F,'panchanga.vara','—');
  const devi=p(F,'panchanga.devi','');
  const raga=SND.raga||p(F,'field.raga','');
  const ragaName=typeof raga==='object'?(raga.name||''):raga;
  const bpm=SND.bpm||SND.tempo||'';
  let parts=['<span class="nak">'+nak+'</span>'];
  if(paksha)parts.push(paksha);
  parts.push(tithi,vara);
  if(devi)parts.push(devi);
  if(ragaName)parts.push(ragaName);
  if(bpm)parts.push(bpm+'bpm');
  document.getElementById('fs-center').innerHTML=parts.join(' · ');
}

// ════════════════════════════════════════════════
// NAKSHATRA WHEEL
// ════════════════════════════════════════════════
function renderNakWheel(){
  const el=document.getElementById('nak-wheel');
  const currentNak=p(F,'panchanga.nakshatra','');
  const deity=F.panchanga?.nakshatra?.deity||F.panchanga?.nakshatra_deity||'';
  const quality=F.panchanga?.nakshatra?.quality||F.panchanga?.nakshatra_quality||'';
  const idx=nakshatras.findIndex(n=>currentNak.toLowerCase().includes(n.toLowerCase()));
  const cx=90,cy=90,r=80,ir=45;
  let svg='<svg width="180" height="180" viewBox="0 0 180 180">';
  for(let i=0;i<27;i++){
    const a1=(i/27)*Math.PI*2-Math.PI/2;
    const a2=((i+1)/27)*Math.PI*2-Math.PI/2;
    const am=(a1+a2)/2;
    const isCurrent=i===idx;
    const isNear=idx>=0&&Math.abs(i-idx)<=2;
    const x1o=cx+r*Math.cos(a1),y1o=cy+r*Math.sin(a1);
    const x1i=cx+ir*Math.cos(a1),y1i=cy+ir*Math.sin(a1);
    const x2o=cx+r*Math.cos(a2),y2o=cy+r*Math.sin(a2);
    const x2i=cx+ir*Math.cos(a2),y2i=cy+ir*Math.sin(a2);
    if(isCurrent){
      svg+='<path d="M'+x1i+','+y1i+' L'+x1o+','+y1o+' A'+r+','+r+' 0 0,1 '+x2o+','+y2o+' L'+x2i+','+y2i+' A'+ir+','+ir+' 0 0,0 '+x1i+','+y1i+'" fill="#e0b040" fill-opacity="0.3" stroke="#e0b040" stroke-width="1.2"/>';
      const lr=r+6;const lx=cx+lr*Math.cos(am),ly=cy+lr*Math.sin(am);
      const rot=am*180/Math.PI+(am>Math.PI/2&&am<Math.PI*1.5?180:0);
    }else{
      svg+='<line x1="'+x1i+'" y1="'+y1i+'" x2="'+x1o+'" y2="'+y1o+'" stroke="'+(isNear?'#e0b04040':'#1a2840')+'" stroke-width="0.5"/>';
    }
  }
  svg+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="#1a2840" stroke-width="0.5"/>';
  svg+='<circle cx="'+cx+'" cy="'+cy+'" r="'+ir+'" fill="none" stroke="#1a2840" stroke-width="0.5"/>';
  svg+='<text x="'+cx+'" y="'+(cy-4)+'" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#e0b040">'+(currentNak||'◌')+'</text>';
  if(deity)svg+='<text x="'+cx+'" y="'+(cy+10)+'" text-anchor="middle" font-family="Courier New" font-size="9" fill="#6a8a9a">'+deity+'</text>';
  if(quality)svg+='<text x="'+cx+'" y="'+(cy+22)+'" text-anchor="middle" font-family="Courier New" font-size="9" fill="#3a5060">'+quality+'</text>';
  svg+='</svg>';
  el.innerHTML=svg;
}

// ════════════════════════════════════════════════
// MOON
// ════════════════════════════════════════════════
function renderMoon(){
  const el=document.getElementById('moon-col');
  const pa=F.panchanga||{};
  const tithiNum=pa.tithi?.number||pa.tithi_number||15;
  const tithiName=p(F,'panchanga.tithi','—');
  const paksha=pa.paksha||pa.tithi?.paksha||'';
  const phase=(tithiNum<=15?tithiNum/30:1-((tithiNum-15)/30));
  const phaseNames=['New Moon','Waxing Crescent','First Quarter','Waxing Gibbous','Full Moon','Waning Gibbous','Third Quarter','Waning Crescent'];
  const phaseIdx=Math.min(7,Math.floor((tithiNum-1)/3.75));
  const phaseName=phaseNames[phaseIdx]||'';

  // Moon phase SVG
  const mr=35,mcx=40,mcy=40;
  const f=tithiNum<=15?tithiNum/15:(30-tithiNum)/15;
  const bulge=mr*Math.abs(1-f*2);
  const sweep=f>0.5?1:0;
  let moonSvg='<svg width="80" height="80" viewBox="0 0 80 80">';
  moonSvg+='<circle cx="'+mcx+'" cy="'+mcy+'" r="'+mr+'" fill="#0c1520" stroke="#1a2840" stroke-width="0.5"/>';
  if(tithiNum>0&&tithiNum<30){
    moonSvg+='<path d="M'+mcx+' '+(mcy-mr)+' A'+mr+' '+mr+' 0 0 1 '+mcx+' '+(mcy+mr)+' A'+bulge+' '+mr+' 0 0 '+sweep+' '+mcx+' '+(mcy-mr)+'" fill="#e0b040" opacity="0.85"/>';
  }
  moonSvg+='</svg>';

  // Moon sine wave
  const ww=160,wh=40,wcx=0,wcy=wh/2;
  let waveSvg='<svg width="'+ww+'" height="'+wh+'" viewBox="0 0 '+ww+' '+wh+'" style="margin-top:6px">';
  waveSvg+='<line x1="0" y1="'+wcy+'" x2="'+ww+'" y2="'+wcy+'" stroke="#1a2840" stroke-width="0.5"/>';
  let pts=[];
  for(let d=0;d<=30;d++){
    const x=(d/30)*ww;
    const y=wcy-Math.sin((d/30)*Math.PI*2)*16;
    pts.push(x.toFixed(1)+','+y.toFixed(1));
    if(d===15){waveSvg+='<circle cx="'+x.toFixed(1)+'" cy="'+(wcy-16).toFixed(1)+'" r="2.5" fill="#e0b040"/>';}
    if(d===0||d===30){waveSvg+='<circle cx="'+x.toFixed(1)+'" cy="'+(wcy).toFixed(1)+'" r="2" fill="#3a5060"/>';}
    if(d===11||d===26){waveSvg+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="2" fill="#20a88a"/>';}
  }
  waveSvg+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="#e0b040" stroke-width="0.8" opacity="0.6"/>';
  const todayX=((tithiNum-1)/30)*ww;
  waveSvg+='<line x1="'+todayX.toFixed(1)+'" y1="0" x2="'+todayX.toFixed(1)+'" y2="'+wh+'" stroke="#e0b040" stroke-width="1"/>';
  waveSvg+='</svg>';

  const daysToFull=tithiNum<=15?(15-tithiNum):(30-tithiNum+15);
  const daysToNew=tithiNum<=15?(30-tithiNum):(30-tithiNum);

  el.innerHTML=moonSvg
    +'<div style="font-family:Georgia,serif;font-size:11px;color:#e0b040;margin-top:4px">'+phaseName+'</div>'
    +'<div class="sub">Tithi '+tithiNum+' of 30</div>'
    +'<div class="dim-text">'+paksha+'</div>'
    +waveSvg
    +'<div class="label" style="text-align:center;margin-top:2px">lunar month</div>'
    +'<div class="dim-text" style="text-align:center">'+daysToFull+' days to pūrṇimā</div>';
}

// ════════════════════════════════════════════════
// VEDIC TIME
// ════════════════════════════════════════════════
function renderVedic(){
  const el=document.getElementById('vedic-col');
  const pa=F.panchanga||{};
  const tithiNum=pa.tithi?.number||pa.tithi_number||'';
  const tithiName=p(F,'panchanga.tithi','—');
  const yoga=p(F,'panchanga.yoga','');
  const karana=p(F,'panchanga.karana','');
  const vara=p(F,'panchanga.vara','');
  const hora=p(F,'panchanga.hora','');
  const rahu=pa.rahu_kala||pa.rahu_kalam||'';
  const lord=p(TJ,'dasha_lord','')||p(TJ,'dasha.lord','Mercury');
  const dEnd=TJ.dasha_end||TJ.dasha?.end_date||'Oct 2027';
  const sub=TJ.sub_dasha||TJ.dasha?.sub||TJ.antardasha||'';
  const pct=Math.min(100,Math.max(0,((Date.now()-dashaStart)/(dashaEnd-dashaStart))*100));

  let html='<div class="label">PANCHANGA</div><div class="divider"></div>';
  html+='<div class="row"><span class="k">Tithi</span><span class="v" style="color:var(--gold)">'+(tithiNum?tithiNum+' · ':'')+tithiName+'</span></div>';
  if(yoga)html+='<div class="row"><span class="k">Yoga</span><span class="v">'+yoga+'</span></div>';
  if(karana)html+='<div class="row"><span class="k">Karana</span><span class="v">'+karana+'</span></div>';
  if(vara)html+='<div class="row"><span class="k">Vara</span><span class="v">'+vara+'</span></div>';
  if(hora)html+='<div class="row"><span class="k">Hora</span><span class="v">'+hora+'</span></div>';
  html+='<div class="divider"></div><div class="label">DASHA</div>';
  html+='<div style="font-family:Georgia,serif;font-size:13px;color:var(--gold);margin:3px 0">'+(typeof lord==='object'?lord.name||'Mercury':lord)+' daśā</div>';
  html+='<div class="dim-text">ends '+(typeof dEnd==='object'?dEnd.name||'Oct 2027':dEnd)+'</div>';
  html+='<div class="progress"><div class="progress-fill" style="width:'+pct.toFixed(1)+'%;background:var(--purple)"></div></div>';
  if(sub)html+='<div class="sub">sub: '+(typeof sub==='object'?sub.name||'':sub)+'</div>';
  html+='<div class="divider"></div><div class="label">RAHU KALA</div>';
  if(rahu)html+='<div style="font-size:11px;color:var(--red);margin:3px 0">'+rahu+'</div>';
  else html+='<div class="dim-text">—</div>';
  el.innerHTML=html;
}

// ════════════════════════════════════════════════
// WESTERN TIME
// ════════════════════════════════════════════════
function renderWestern(){
  const el=document.getElementById('western-col');
  const sunSign=NAT.sun_sign||F.western?.sun_sign||'';
  const sunDeg=NAT.sun_degree||F.western?.sun_degree||'';
  const moonSign=NAT.moon_sign||F.western?.moon_sign||'';
  const moonDeg=NAT.moon_degree||F.western?.moon_degree||'';
  const sunIdx=zodiacNames.findIndex(z=>sunSign.toLowerCase().includes(z.toLowerCase()));
  const moonIdx=zodiacNames.findIndex(z=>moonSign&&moonSign.toLowerCase().includes(z.toLowerCase()));

  const cx=80,cy=80,r=65;
  let svg='<svg width="160" height="160" viewBox="0 0 160 160">';
  svg+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="#1a2840" stroke-width="0.5"/>';
  for(let i=0;i<12;i++){
    const a1=(i/12)*Math.PI*2-Math.PI/2;
    const a2=((i+1)/12)*Math.PI*2-Math.PI/2;
    const am=(a1+a2)/2;
    svg+='<line x1="'+(cx+(r-10)*Math.cos(a1)).toFixed(1)+'" y1="'+(cy+(r-10)*Math.sin(a1)).toFixed(1)+'" x2="'+(cx+r*Math.cos(a1)).toFixed(1)+'" y2="'+(cy+r*Math.sin(a1)).toFixed(1)+'" stroke="#1a2840" stroke-width="0.5"/>';
    if(i===sunIdx){
      const x1=cx+(r-10)*Math.cos(a1),y1=cy+(r-10)*Math.sin(a1);
      const x2=cx+r*Math.cos(a1),y2=cy+r*Math.sin(a1);
      const x3=cx+r*Math.cos(a2),y3=cy+r*Math.sin(a2);
      const x4=cx+(r-10)*Math.cos(a2),y4=cy+(r-10)*Math.sin(a2);
      svg+='<path d="M'+x1.toFixed(1)+','+y1.toFixed(1)+' L'+x2.toFixed(1)+','+y2.toFixed(1)+' A'+r+','+r+' 0 0,1 '+x3.toFixed(1)+','+y3.toFixed(1)+' L'+x4.toFixed(1)+','+y4.toFixed(1)+' A'+(r-10)+','+(r-10)+' 0 0,0 '+x1.toFixed(1)+','+y1.toFixed(1)+'" fill="#e0b040" fill-opacity="0.15"/>';
    }
    const gx=cx+(r-20)*Math.cos(am),gy=cy+(r-20)*Math.sin(am);
    svg+='<text x="'+gx.toFixed(1)+'" y="'+(gy+3).toFixed(1)+'" text-anchor="middle" font-size="10" fill="#3a5060">'+zodiacGlyphs[i]+'</text>';
  }
  // Sun dot
  if(sunIdx>=0){
    const sa=((sunIdx+0.5)/12)*Math.PI*2-Math.PI/2;
    svg+='<circle cx="'+(cx+r*Math.cos(sa)).toFixed(1)+'" cy="'+(cy+r*Math.sin(sa)).toFixed(1)+'" r="4" fill="#e8c86a"/>';
  }
  // Moon dot
  if(moonIdx>=0){
    const ma=((moonIdx+0.5)/12)*Math.PI*2-Math.PI/2;
    svg+='<circle cx="'+(cx+r*Math.cos(ma)).toFixed(1)+'" cy="'+(cy+r*Math.sin(ma)).toFixed(1)+'" r="3" fill="#c8d8e8"/>';
  }
  svg+='</svg>';

  el.innerHTML=svg
    +(sunSign?'<div class="sub">Sun: '+sunSign+(sunDeg?' '+sunDeg+'°':'')+'</div>':'')
    +(moonSign?'<div class="sub">Moon: '+moonSign+(moonDeg?' '+moonDeg+'°':'')+'</div>':'')
    +'<div class="label" style="text-align:center">western</div>';
}

function donutSVG(pct,color,sz){
  sz=sz||70;const r=sz/2-8,cx=sz/2,cy=sz/2,sw=7;
  const circ=2*Math.PI*r;const dash=circ*(pct/100);
  return '<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 '+sz+' '+sz+'">'
    +'<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="#1a2840" stroke-width="'+sw+'"/>'
    +'<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+sw+'" stroke-dasharray="'+dash.toFixed(1)+' '+circ.toFixed(1)+'" stroke-linecap="round" transform="rotate(-90 '+cx+' '+cy+')"/>'
    +'<text x="'+cx+'" y="'+(cy+5)+'" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="'+color+'">'+Math.round(pct)+'</text>'
    +'</svg>';
}

function computeResonance(){
  const todayNak=p(F,'panchanga.nakshatra','').toLowerCase();
  const vara=p(F,'panchanga.vara','');
  let score=50;
  if(todayNak.includes('rohini'))score+=25;
  else if(todayNak.includes('mriga')||todayNak.includes('hasta'))score+=10;
  const varaLords={Sunday:'Sun',Monday:'Moon',Tuesday:'Mars',Wednesday:'Mercury',Thursday:'Jupiter',Friday:'Venus',Saturday:'Saturn'};
  const vl=varaLords[vara]||'';
  if(vl==='Venus')score+=15;
  else if(['Mercury','Saturn'].includes(vl))score+=5;
  else if(['Sun','Moon'].includes(vl))score-=5;
  const hora=p(F,'panchanga.hora','');
  if(hora&&(hora.includes('Mercur')||hora.includes('Budha')))score+=10;
  return Math.max(0,Math.min(100,score));
}

function renderLeftPanel(){
  const el=document.getElementById('left-panel');
  let coh=COH.coherence_score||COH.score||COH.coherence||0;
  if(typeof coh==='number'&&coh<=1)coh=coh*100;

  const cohColor=coh<34?'#c84040':coh<67?'#e0b040':'#3a8a4a';

}

function triangleSVG(labels,colors,balancePoint,w,h){
  w=w||120;h=h||100;
  const pts=[[w/2,8],[w-8,h-8],[8,h-8]];
  let svg='<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'">';
  svg+='<polygon points="'+pts.map(p=>p.join(',')).join(' ')+'" fill="none" stroke="#1a2840" stroke-width="0.8"/>';
  // Fill with dominant color
  const domIdx=balancePoint.indexOf(Math.max(...balancePoint));
  svg+='<polygon points="'+pts.map(p=>p.join(',')).join(' ')+'" fill="'+colors[domIdx]+'" fill-opacity="0.1"/>';
  // Balance dot
  const bx=pts[0][0]*balancePoint[0]+pts[1][0]*balancePoint[1]+pts[2][0]*balancePoint[2];
  const by=pts[0][1]*balancePoint[0]+pts[1][1]*balancePoint[1]+pts[2][1]*balancePoint[2];
  svg+='<circle cx="'+bx.toFixed(1)+'" cy="'+by.toFixed(1)+'" r="4" fill="#c8d8e8"/>';
  // Labels
  labels.forEach((l,i)=>{
    const lx=pts[i][0]+(i===0?0:i===1?8:-8);
    const ly=pts[i][1]+(i===0?-2:12);
    svg+='<text x="'+lx+'" y="'+ly+'" text-anchor="'+(i===0?'middle':i===1?'start':'end')+'" font-size="10" fill="'+colors[i]+'">'+l+'</text>';
  });
  svg+='</svg>';
  return svg;
}

function renderDosha(){
  const el=document.getElementById('dosha-col');
  const element=p(F,'field.element','').toLowerCase();
  let v=0.33,pi=0.33,k=0.34;
  if(element.includes('air')||element.includes('ether'))v=0.5;
  else if(element.includes('fire'))pi=0.5;
  else if(element.includes('water')||element.includes('earth'))k=0.5;
  const t=v+pi+k;v/=t;pi/=t;k/=t;
  const dom=v>=pi&&v>=k?'Vata':pi>=v&&pi>=k?'Pitta':'Kapha';
  const domColor=dom==='Vata'?'#8070dd':dom==='Pitta'?'#c84040':'#285898';
  el.innerHTML=triangleSVG(['Vata','Pitta','Kapha'],['#8070dd','#c84040','#285898'],[v,pi,k])
    +'<div style="font-size:11px;color:'+domColor+';margin-top:2px">'+dom+'</div>';
}

function renderRahu(){
  const el=document.getElementById('rahu-col');
  const pa=F.panchanga||{};
  const rahu=pa.rahu_kala||pa.rahu_kalam||'';
  const vara=p(F,'panchanga.vara','');
  const now=new Date();
  const ch=now.getHours()+now.getMinutes()/60;
  // Parse rahu kala time range
  let rs=0,re=0,isActive=false;
  if(rahu){
    const m=rahu.match(/(\d{1,2}):?(\d{2})?\s*[-–]\s*(\d{1,2}):?(\d{2})?/);
    if(m){rs=parseInt(m[1])+(parseInt(m[2]||0)/60);re=parseInt(m[3])+(parseInt(m[4]||0)/60);isActive=ch>=rs&&ch<re}
  }
  // Day bar 6am-6pm
  const ds=6,de=18,dur=de-ds;
  const barW=100;
  const rsP=Math.max(0,(rs-ds)/dur*barW);
  const reP=Math.min(barW,(re-ds)/dur*barW);
  const nowP=Math.max(0,Math.min(barW,(ch-ds)/dur*barW));

  let html='<div class="rahu-bar"><div class="rahu-fill" style="left:'+rsP+'%;width:'+(reP-rsP)+'%"></div><div class="rahu-now" style="left:'+nowP+'%"></div></div>';
  if(isActive)html+='<div style="font-size:11px;color:var(--red);animation:pulse 2s infinite">RAHU KALA ACTIVE</div>';
  else html+='<div class="sub">'+(rahu?'clear':'—')+'</div>';
  html+='<div style="font-size:10px;margin-top:2px">'+rahu+'</div>';
  if(vara)html+='<div class="dim-text">'+vara+'</div>';
  el.innerHTML=html;
}

// ════════════════════════════════════════════════
// PRACTICE — Pranayama, Asana, Plant, Intention
// ════════════════════════════════════════════════
function renderPranayama(){
  const el=document.getElementById('prana-col');
  const vara=p(F,'panchanga.vara','');
  const nak=p(F,'panchanga.nakshatra','');
  const ch=new Date().getHours();
  // Derive swara from time of day (simplified: left nostril evening, right morning)
  const isIda=ch>=17||ch<5;
  const swaraName=isIda?'Ida · Chandra':'Pingala · Sūrya';
  const swaraColor=isIda?'#285898':'#e8c86a';
  const swaraSymbol=isIda?'☽':'☉';
  const swaraDesc=isIda?'cooling · receptive':'heating · active';
  // Derive practice
  const practices={morning:{name:'Kapālabhāti',eng:'Skull-shining breath',dur:15},midday:{name:'Nāḍī Śodhana',eng:'Alternate nostril',dur:10},evening:{name:'Bhrāmarī',eng:'Bee breath',dur:10},night:{name:'Śītalī',eng:'Cooling breath',dur:10}};
  const period=ch<10?'morning':ch<14?'midday':ch<19?'evening':'night';
  const pr=practices[period];

  el.innerHTML='<div style="font-size:16px;color:'+swaraColor+';margin-bottom:4px">'+swaraSymbol+'</div>'
    +'<div class="sub">'+swaraName+'</div>'
    +'<div class="dim-text">'+swaraDesc+'</div>'
    +'<div class="divider"></div>'
    +'<div class="practice-name">'+pr.name+'</div>'
    +'<div class="practice-eng">'+pr.eng+'</div>'
    +'<div class="practice-dim">'+pr.dur+' minutes · '+period+'</div>';
}

function renderAsana(){
  const el=document.getElementById('asana-col');
  const element=p(F,'field.element','').toLowerCase();
  const guna=p(F,'field.guna','').toLowerCase();
  // Derive asana
  let asana={sk:'Vṛkṣāsana',en:'Tree Pose',quality:'grounding',dur:'1 min each side'};
  if(element.includes('fire')||guna.includes('rajas'))asana={sk:'Ardha Chandrāsana',en:'Half Moon',quality:'cooling',dur:'30s each side'};
  else if(element.includes('water')||element.includes('earth'))asana={sk:'Ūrdhva Dhanurāsana',en:'Wheel Pose',quality:'energizing',dur:'3 rounds'};
  else if(element.includes('air')||element.includes('ether'))asana={sk:'Padmāsana',en:'Lotus Pose',quality:'stabilizing',dur:'5 min'};

  // Simple stick figure
  const fig='<svg width="40" height="50" viewBox="0 0 40 50"><circle cx="20" cy="8" r="4" fill="none" stroke="#3a5060" stroke-width="1"/><line x1="20" y1="12" x2="20" y2="30" stroke="#3a5060" stroke-width="1"/><line x1="20" y1="18" x2="10" y2="24" stroke="#3a5060" stroke-width="1"/><line x1="20" y1="18" x2="30" y2="24" stroke="#3a5060" stroke-width="1"/><line x1="20" y1="30" x2="12" y2="45" stroke="#3a5060" stroke-width="1"/><line x1="20" y1="30" x2="28" y2="45" stroke="#3a5060" stroke-width="1"/></svg>';

  el.innerHTML='<div class="practice-name">'+asana.sk+'</div>'
    +'<div class="practice-eng">'+asana.en+'</div>'
    +fig
    +'<div class="practice-dim">'+asana.quality+'</div>'
    +'<div class="practice-dim">'+asana.dur+'</div>';
}

function renderPlant(){
  const el=document.getElementById('plant-col');
  const anchor=G.anchor||G.anchor_plant||G.plant||{};
  const name=typeof anchor==='string'?anchor:(anchor.name||anchor.common_name||'—');
  const latin=anchor.latin||anchor.scientific_name||anchor.species||'';
  const fn=anchor.guild_function||anchor.function||G.guild_function||'';
  const nak=G.nakshatra||p(F,'panchanga.nakshatra','');
  const graha=anchor.graha||G.graha||'';
  const grahaColor=grahaColors[graha]||'#3a5060';
  // Leaf SVG
  const leaf='<svg width="40" height="40" viewBox="0 0 40 40"><path d="M20 38 Q8 28 8 16 Q8 4 20 2 Q32 4 32 16 Q32 28 20 38Z" fill="'+grahaColor+'" fill-opacity="0.2" stroke="'+grahaColor+'" stroke-width="0.8"/><line x1="20" y1="38" x2="20" y2="8" stroke="'+grahaColor+'" stroke-width="0.5"/></svg>';

  el.innerHTML='<div style="font-family:Georgia,serif;font-size:14px;color:var(--gold)">'+name+'</div>'
    +(latin?'<div class="dim-text" style="font-style:italic">'+latin+'</div>':'')
    +leaf
    +(fn?'<div class="practice-detail">'+fn+'</div>':'')
    +'<div class="practice-dim">'+nak+'</div>';
}

function renderIntention(){
  const el=document.getElementById('intent-col');
  const rec=INT.recommendation||INT.current||INT.suggestion||'';
  const win=INT.favorable_window||INT.window||INT.time||'';
  const act=INT.activity||INT.activity_type||INT.type||'';
  const pada=RDG.pada||RDG.excerpt||RDG.passage||RDG.text||'';

  let html='';
  if(rec)html+='<div style="font-family:Georgia,serif;font-size:12px;color:var(--text);line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:4px">'+rec+'</div>';
  if(win)html+='<div style="font-size:10px;color:var(--teal)">'+win+'</div>';
  if(act)html+='<div style="font-size:10px;color:var(--gold);margin-top:2px">'+act+'</div>';
  if(pada){
    html+='<div class="divider"></div>';
    html+='<div class="reading-text">'+pada+'</div>';
  }
  if(!html)html='<div class="dim-text">◌</div>';
  el.innerHTML=html;
}
