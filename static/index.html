<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atlas · Vedic Cosmological Field Computer</title>
<link rel="stylesheet" href="/static/atlas-theme.css">
<script src="/static/atlas.js"></script>
<style>
body{background:#020408;color:var(--text);font-family:var(--font-mono);font-size:10px;height:100vh;display:grid;grid-template-columns:180px 1fr 180px;grid-template-rows:28px 140px 1fr 140px 24px;gap:1px;overflow:hidden;margin:0}
.z{background:#020408;padding:8px;overflow:hidden;position:relative}
.zhdr{font-size:7px;color:var(--dim);text-transform:uppercase;letter-spacing:.15em;margin-bottom:4px;display:flex;justify-content:space-between}
.zdir{font-size:7px;color:var(--dim);opacity:.5}
.zval{font-family:var(--font-body);font-size:13px;color:var(--gold);margin-bottom:2px}
.zsub{font-size:9px;color:var(--muted);margin-bottom:1px}
.zdim{font-size:9px;color:var(--dim);margin-bottom:1px}
.zsep{height:1px;background:rgba(26,40,64,.5);margin:5px 0}

/* Top bar */
.top{grid-column:1/-1;background:var(--panel);display:flex;align-items:center;padding:0 12px;gap:8px;border-bottom:1px solid var(--border)}
.top-atlas{font-size:10px;color:var(--gold);letter-spacing:.4em;flex-shrink:0}
.top-sub{font-size:8px;color:var(--dim);flex-shrink:0}
.top-field{flex:1;text-align:center;font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-field .nak{font-family:var(--font-body);font-size:12px;color:var(--gold)}
.top-clk{font-size:9px;color:var(--dim);flex-shrink:0}

/* Bottom bar */
.bot{grid-column:1/-1;background:var(--panel);display:flex;align-items:center;justify-content:center;gap:8px;font-size:8px;color:var(--dim);border-top:1px solid var(--border)}
.bot-dot{width:5px;height:5px;border-radius:50%;background:var(--teal)}

/* Center toroid */
.center{display:flex;align-items:center;justify-content:center;overflow:hidden}
.toroid-svg{animation:spin 180s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ring{cursor:pointer;transition:stroke-opacity .2s}.ring:hover{stroke-opacity:1!important}

/* N/S bands */
.n-band{grid-column:2;display:flex;align-items:center;justify-content:center}
.s-band{grid-column:2;display:flex;gap:1px;background:rgba(26,40,64,.3)}
.s-band>div{background:#020408;flex:1;padding:6px;overflow:hidden}

/* Corner tints */
.z-nw{background:linear-gradient(135deg,rgba(74,158,255,.02),transparent 60%)}
.z-ne{background:linear-gradient(225deg,rgba(74,158,255,.02),transparent 60%)}
.z-sw{background:linear-gradient(45deg,rgba(136,136,136,.02),transparent 60%)}
.z-se{background:linear-gradient(315deg,rgba(255,107,53,.02),transparent 60%)}
.z-w{background:linear-gradient(90deg,rgba(74,158,255,.015),transparent 40%)}
.z-e{background:linear-gradient(270deg,rgba(255,107,53,.015),transparent 40%)}

/* Probe dots */
.probe{display:inline-flex;align-items:center;gap:3px;font-size:8px;color:var(--dim);margin-right:5px}
.pdot{width:4px;height:4px;border-radius:50%}
.temple-link{color:var(--teal);text-decoration:none;font-size:8px;display:block}.temple-link:hover{text-decoration:underline}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="top">
  <span class="top-atlas">✦ ATLAS</span><span class="top-sub">kanjira</span>
  <div class="top-field" id="panchanga-bar">◌</div>
  <span class="top-clk" id="clk"></span>
</div>

<!-- ROW 2: NW / N / NE -->
<div class="z z-nw" id="z-nw"></div>
<div class="z n-band" id="z-n"></div>
<div class="z z-ne" id="z-ne"></div>

<!-- ROW 3: W / CENTER / E -->
<div class="z z-w" id="z-w"></div>
<div class="z center" id="z-center"></div>
<div class="z z-e" id="z-e"></div>

<!-- ROW 4: SW / S / SE -->
<div class="z z-sw" id="z-sw"></div>
<div class="z s-band" id="z-s"></div>
<div class="z z-se" id="z-se"></div>

<!-- BOTTOM BAR -->
<div class="bot">
  <span>ATLAS 330</span><span>·</span><span>Vedic Cosmological Field Computer</span>
  <span>·</span><span id="bot-date"></span><span class="bot-dot"></span>
</div>

<script>
function dv(o){return typeof o==='object'&&o?(o.name||'—'):(o||'—')}
function tick(){document.getElementById('clk').textContent=new Date().toLocaleTimeString('en-GB',{hour12:false})}
tick();setInterval(tick,1000);
document.getElementById('bot-date').textContent=new Date().toLocaleDateString('en-US');

const LAYERS=[
  {id:'S0',n:'Bindu',c:'#7060cc',p:'/s0'},{id:'S1',n:'Archetype',c:'#e0b040',p:'/s1'},
  {id:'S2',n:'Sound',c:'#20a88a',p:'/s2'},{id:'S3',n:'Rhythm',c:'#c8d8e8',p:'/s3'},
  {id:'S4',n:'Geometry',c:'#e0b040',p:'/s4'},{id:'S5',n:'Nature',c:'#3a7a4a',p:'/s5'},
  {id:'S6',n:'Lila',c:'#7060cc',p:'/s6'}
];

async function loadAll(){
  const[f,y,gol,h,res,din,sv,snd]=await Promise.all([
    atlasGet('/field',{}),atlasGet('/yantra/navagraha',{}),atlasGet('/goloka',{}),
    atlasGet('/dashboard/health',{}),atlasGet('/resonance',{}),atlasGet('/dinacharya',{}),
    atlasGet('/svarodaya',{}),atlasGet('/sound/state',{})
  ]);
  const pa=f?.panchanga||{},ss=f?.sound_state||snd||{};
  const nak=pa.nakshatra||'—',tithi=pa.tithi||'—',vara=pa.vara||'—';
  const devi=dv(pa.devi),deviCol=(typeof pa.devi==='object'?pa.devi?.color:null)||'#9370db';
  const da=f?.dasha||{};const ap=gol?.ashtakala_period||{};const nd=gol?.nitya_devi||{};

  // ═══ PANCHANGA BAR ═══
  const raga=ss.raga||'';const bpm=ss.bpm||'';
  document.getElementById('panchanga-bar').innerHTML=
    `<span class="nak">${nak}</span> · ${tithi} · ${pa.paksha||''} · ${vara} · ${devi}${raga?' · '+raga:''}${bpm?' · '+bpm+'bpm':''}`;

  // ═══ NW · Vāyu · SOUND ═══
  let nw=`<div class="zhdr"><span>SOUND</span><span class="zdir">NW · Vāyu</span></div>`;
  nw+=`<div class="zval">${raga||'—'}</div>`;
  if(bpm)nw+=`<div class="zsub">${ss.tala||''} · ${bpm}bpm</div>`;
  if(ss.sa_hz)nw+=`<div class="zdim">Sa ${ss.sa_hz}Hz</div>`;
  if(ss.raga_vadi)nw+=`<div class="zdim">vādī ${ss.raga_vadi}${ss.raga_samvadi?' · samvādī '+ss.raga_samvadi:''}</div>`;
  const prahar=res?.prahar||'';if(prahar)nw+=`<div class="zdim">${prahar} prahar</div>`;
  document.getElementById('z-nw').innerHTML=nw;

  // ═══ N · Kubera · YANTRA ═══
  let n=`<div class="zhdr"><span>YANTRA</span><span class="zdir">N · Kubera</span></div>`;
  if(y&&!y.error){
    n+=`<div class="zval">${y.graha_name||'—'}</div>`;
    n+=`<div class="zsub">M = ${y.magic_constant} · λ = ±${(y.invariant_eigenvalue||4.899).toFixed(3)}</div>`;
    // Mini yantra 3x3
    n+=`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:1px;width:90px;margin-top:4px">`;
    (y.cells||[]).forEach(c=>{
      const col=c.vastu_color||'#333';const isBr=c.vastu_zone==='Brahma';
      n+=`<div style="text-align:center;font-family:var(--font-body);font-size:12px;color:var(--gold);padding:2px;background:rgba(${parseInt(col.slice(1,3),16)},${parseInt(col.slice(3,5),16)},${parseInt(col.slice(5,7),16)},0.08);${isBr?'box-shadow:0 0 8px rgba(147,112,219,.3)':''}">${c.value}</div>`;
    });
    n+=`</div>`;
  }
  document.getElementById('z-n').innerHTML=n;

  // ═══ NE · Īśāna · DASHA ═══
  let ne=`<div class="zhdr"><span>DASHA</span><span class="zdir">NE · Īśāna</span></div>`;
  ne+=`<div class="zval">${da.lord||da.mahadasha||'Budha'}</div>`;
  ne+=`<div class="zsub">daśā · ends ${da.closes||'2027-10'}</div>`;
  if(da.antardasha)ne+=`<div class="zdim">sub: ${da.antardasha}</div>`;
  const hora=f?.hora||{};if(hora.hora_lord)ne+=`<div class="zsep"></div><div class="zdim">hora: ${hora.hora_lord} · ${hora.hora_quality||''}</div>`;
  const rk=f?.rahu_kala||{};if(rk.rahu_kala_start)ne+=`<div class="zdim" style="color:${rk.rahu_kala_active?'var(--red)':'var(--dim)'}">rahu: ${rk.rahu_kala_start}–${rk.rahu_kala_end}${rk.rahu_kala_active?' ●':''}</div>`;
  document.getElementById('z-ne').innerHTML=ne;

  // ═══ W · Varuṇa · SYSTEM ═══
  let w=`<div class="zhdr"><span>SYSTEM</span><span class="zdir">W · Varuṇa</span></div>`;
  if(h?.graph)w+=`<div class="zsub">${(h.graph.entities||0).toLocaleString()} entities</div><div class="zdim">${(h.graph.edges||0).toLocaleString()} edges</div>`;
  if(h?.corpus)w+=`<div class="zdim">${(h.corpus.chunks||0).toLocaleString()} chunks</div>`;
  w+=`<div class="zsep"></div>`;
  ['goloka','trajectory','svarodaya','astrobotany','chandas'].forEach(p=>{
    const st=h?.routes?.['/'+p]||h?.routes?.[p]||'?';const ok=st==='ok'||st==='registered';
    w+=`<span class="probe"><span class="pdot" style="background:${ok?'var(--teal)':'var(--amber)'}"></span>${p.slice(0,6)}</span>`;
  });
  document.getElementById('z-w').innerHTML=w;

  // ═══ CENTER · TOROID ═══
  renderToroid(deviCol,nak);

  // ═══ E · Indra · JYOTISH ═══
  let e=`<div class="zhdr"><span>JYOTISH</span><span class="zdir">E · Indra</span></div>`;
  e+=`<div class="zval" style="font-size:11px">${pa.element||'—'} · ${pa.guna||'—'}</div>`;
  e+=`<div class="zsub">♉ Vṛṣabha · Rohiṇī</div>`;
  e+=`<div class="zdim">${da.lord||'Budha'} daśā</div>`;
  if(sv?.optimal_nadi){e+=`<div class="zsep"></div><div class="zdim">nāḍī: ${sv.optimal_nadi} · ${sv.element_of_breath||''}</div>`;
    e+=`<div class="zdim">coherence: ${((sv.coherence_score||0)*100).toFixed(0)}%</div>`}
  document.getElementById('z-e').innerHTML=e;

  // ═══ SW · Nirṛti · HEALTH ═══
  let sw=`<div class="zhdr"><span>FIELD</span><span class="zdir">SW · Nirṛti</span></div>`;
  sw+=`<div class="zsub">${pa.element||'—'} · ${pa.guna||'—'}</div>`;
  if(sv?.optimal_nadi)sw+=`<div class="zdim">${sv.optimal_nadi} nāḍī · ${sv.nadi_quality||''}</div>`;
  if(gol?.bridge_to_material?.coherence!=null){const pct=Math.round(gol.bridge_to_material.coherence*100);
    sw+=`<div class="zsep"></div><div class="zdim">pratibimba: ${pct}%</div>`}
  document.getElementById('z-sw').innerHTML=sw;

  // ═══ S · Yama · DINACHARYA ═══
  let s='';
  if(din?.ashtakala_period){
    const cols=['period','activity','dietary','herbs'];
    s+=`<div><div class="zhdr"><span>PERIOD</span></div><div class="zval" style="font-size:11px">${din.ashtakala_period}</div><div class="zdim">${(din.primary_activity||'').replace(/_/g,' ')}</div></div>`;
    s+=`<div><div class="zhdr"><span>DIETARY</span></div><div class="zsub">${din.dietary_guidance||'—'}</div>${(din.recommended_herbs||[]).slice(0,2).map(h=>`<div class="zdim">${h}</div>`).join('')}</div>`;
    s+=`<div><div class="zhdr"><span>PRACTICE</span></div>${(din.recommended_practices||[]).slice(0,3).map(p=>`<div class="zdim">${p}</div>`).join('')}</div>`;
    s+=`<div><div class="zhdr"><span>MANTRA</span></div><div class="zsub" style="color:var(--gold)">${din.mantra||'—'}</div><div class="zdim">${din.raga||''}</div></div>`;
  }
  document.getElementById('z-s').innerHTML=s;

  // ═══ SE · Agni · GOLOKA ═══
  let se=`<div class="zhdr"><span>GOLOKA</span><span class="zdir">SE · Agni</span></div>`;
  const fo=gol?.active_forest||{};
  if(fo.name)se+=`<div class="zval" style="font-style:italic;font-size:12px">${fo.name}</div>`;
  if(ap.name)se+=`<div class="zsub">${ap.name}${ap.presiding_sakhi?' · '+ap.presiding_sakhi:''}</div>`;
  if(nd.bija)se+=`<div style="font-family:var(--font-body);font-size:14px;color:var(--teal);margin:3px 0">${nd.bija}</div>`;
  se+=`<div style="font-family:var(--font-body);font-size:11px;color:${nd.color||'#9370db'}">${nd.name||devi}</div>`;
  if(res?.live_now&&res.temples?.length){const t=res.temples[0];
    se+=`<div class="zsep"></div><a href="${t.stream_url||'#'}" target="_blank" rel="noopener" class="temple-link">● ${t.name}</a>`}
  document.getElementById('z-se').innerHTML=se;
}

function renderToroid(deviCol,nak){
  const el=document.getElementById('z-center');
  const sz=Math.min(el.clientWidth,el.clientHeight)-20;if(sz<100)return;
  const NS='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(NS,'svg');
  svg.setAttribute('width',sz);svg.setAttribute('height',sz);
  svg.setAttribute('viewBox',`0 0 ${sz} ${sz}`);
  svg.classList.add('toroid-svg');
  const cx=sz/2,cy=sz/2;
  LAYERS.forEach((ly,i)=>{
    const r=sz*0.1+i*sz*0.055;
    const c=document.createElementNS(NS,'circle');
    c.setAttribute('cx',cx);c.setAttribute('cy',cy);c.setAttribute('r',r);
    c.setAttribute('fill','none');c.setAttribute('stroke',ly.c);
    c.setAttribute('stroke-width','1');c.setAttribute('stroke-opacity','0.3');
    c.classList.add('ring');c.style.cursor='pointer';
    c.addEventListener('click',()=>location.href=ly.p);
    c.addEventListener('mouseenter',()=>c.setAttribute('stroke-opacity','0.8'));
    c.addEventListener('mouseleave',()=>c.setAttribute('stroke-opacity','0.3'));
    svg.appendChild(c);
    // Label
    if(i%2===0||i===6){const t=document.createElementNS(NS,'text');
      t.setAttribute('x',cx);t.setAttribute('y',cy-r-3);t.setAttribute('text-anchor','middle');
      t.setAttribute('font-size','7');t.setAttribute('fill',ly.c);t.setAttribute('fill-opacity','0.4');
      t.setAttribute('font-family',"'Space Mono',monospace");t.textContent=ly.id;svg.appendChild(t)}
  });
  // Center devi glow
  const g=document.createElementNS(NS,'circle');g.setAttribute('cx',cx);g.setAttribute('cy',cy);
  g.setAttribute('r',sz*0.06);g.setAttribute('fill',deviCol);g.setAttribute('fill-opacity','0.2');svg.appendChild(g);
  const g2=document.createElementNS(NS,'circle');g2.setAttribute('cx',cx);g2.setAttribute('cy',cy);
  g2.setAttribute('r',sz*0.02);g2.setAttribute('fill',deviCol);g2.setAttribute('fill-opacity','0.7');svg.appendChild(g2);
  // Nak label
  const nt=document.createElementNS(NS,'text');nt.setAttribute('x',cx);nt.setAttribute('y',cy+sz*0.04);
  nt.setAttribute('text-anchor','middle');nt.setAttribute('font-size','8');nt.setAttribute('fill',deviCol);
  nt.setAttribute('font-family',"'Cormorant Garamond',serif");nt.textContent=nak;svg.appendChild(nt);
  el.innerHTML='';el.appendChild(svg);
}

loadAll();setInterval(loadAll,60000);
</script>
</body>
</html>
