<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nitya Mandala · 3D Mediator · Atlas 330</title>
<link rel="stylesheet" href="/static/atlas-theme.css">
<script src="/static/atlas.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--bg:#06080f;--panel:#0a0e18;--border:#1a2840;
  --gold:rgba(200,169,110,1);--gold-dim:rgba(200,169,110,0.2);
  --teal:rgba(93,202,165,1);--dim:#4a5a6a;--muted:#7a8a9a;
  --serif:'Cormorant Garamond',Georgia,serif;--mono:'IBM Plex Mono',monospace;--cinzel:'Cinzel',Georgia,serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:rgba(255,255,255,0.85);font-family:var(--mono);font-size:11px;display:flex;flex-direction:column}

#topbar{height:28px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 16px}
#topbar .brand{font-size:11px;color:var(--gold);letter-spacing:.15em}
#topbar .strip{font-size:9px;color:var(--muted)}

#main{flex:1;display:flex;overflow:hidden}
#three-col{flex:1;position:relative}
#three-col canvas{display:block}
#caption{position:absolute;bottom:8px;left:16px;right:16px;font-size:9px;color:var(--dim);font-style:italic;text-align:center}

#side{width:320px;border-left:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;padding:16px 20px}
#side h3{font-family:var(--cinzel);font-size:12px;color:var(--gold);letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px}
.lbl{font-size:8px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;margin-top:6px}
.val{font-family:var(--serif);font-size:12px;font-style:italic;color:rgba(255,255,255,0.85);line-height:1.6}
.val-gold{font-family:var(--serif);font-size:12px;font-style:italic;color:var(--gold);line-height:1.6}
.sep{height:1px;background:var(--border);margin:8px 0}

#preview-wrap{margin:12px 0}
#preview-canvas{width:100%;aspect-ratio:1;border:1px solid var(--border);border-radius:4px;background:#020408}

#home-btn{position:absolute;top:8px;right:8px;font-size:9px;color:var(--dim);border:1px solid var(--border);
  background:transparent;padding:4px 10px;border-radius:2px;cursor:pointer;letter-spacing:.1em;text-transform:uppercase}
#home-btn:hover{color:var(--gold);border-color:rgba(200,169,110,.3)}

@media(max-width:768px){
  #main{flex-direction:column}
  #side{width:100%;max-height:40vh;border-left:none;border-top:1px solid var(--border)}
}
</style>
</head>
<body>

<div id="topbar">
  <span class="brand">&#10022; NITYA MANDALA</span>
  <span class="strip" id="field-strip">loading...</span>
</div>

<div id="main">
  <div id="three-col">
    <button id="home-btn" onclick="goHome()">&#8962; whole month</button>
    <div id="caption">loading 6D parent description...</div>
  </div>
  <div id="side">
    <h3 id="devi-name">--</h3>
    <div id="devi-info"></div>
    <div class="sep"></div>
    <div class="lbl">2D PROJECTION</div>
    <div id="preview-wrap">
      <canvas id="preview-canvas"></canvas>
    </div>
    <div id="preview-label" style="font-size:9px;color:var(--dim);text-align:center">--</div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════

let scene, camera, renderer, polyGroup;
let isDragging = false, prevMouse = {x:0, y:0};
let autoRotate = true, idleTimer = null;
let currentTithi = null;
let currentPolyData = null;
let F = {};

const _get = typeof atlasGet === 'function' ? atlasGet : async (url) => {
  const r = await fetch(url); return r.ok ? r.json() : null;
};

// ══════════════════════════════════════════════
//  THREE.JS SETUP
// ══════════════════════════════════════════════

function initThree() {
  const container = document.getElementById('three-col');
  const w = container.clientWidth, h = container.clientHeight;

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(40, w / h, 0.1, 100);
  camera.position.set(0, 1.5, 4);
  camera.lookAt(0, 0, 0);

  renderer = new THREE.WebGLRenderer({antialias: true, alpha: true});
  renderer.setSize(w, h);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x06080f, 1);
  container.insertBefore(renderer.domElement, container.firstChild);

  // Lights
  const ambient = new THREE.AmbientLight(0xc8a96e, 0.3);
  scene.add(ambient);
  const point = new THREE.PointLight(0xc8a96e, 0.8, 10);
  point.position.set(2, 3, 2);
  scene.add(point);
  const point2 = new THREE.PointLight(0x5dcaa5, 0.4, 10);
  point2.position.set(-2, -1, 3);
  scene.add(point2);

  polyGroup = new THREE.Group();
  scene.add(polyGroup);

  // Controls
  const canvas = renderer.domElement;
  canvas.addEventListener('mousedown', e => { isDragging = true; prevMouse = {x:e.clientX, y:e.clientY}; autoRotate = false; clearTimeout(idleTimer); });
  canvas.addEventListener('mousemove', e => {
    if (!isDragging) return;
    polyGroup.rotation.y += (e.clientX - prevMouse.x) * 0.005;
    polyGroup.rotation.x += (e.clientY - prevMouse.y) * 0.005;
    prevMouse = {x:e.clientX, y:e.clientY};
  });
  canvas.addEventListener('mouseup', () => { isDragging = false; idleTimer = setTimeout(() => autoRotate = true, 2000); });
  canvas.addEventListener('mouseleave', () => { isDragging = false; idleTimer = setTimeout(() => autoRotate = true, 2000); });
  canvas.addEventListener('wheel', e => {
    camera.position.z = Math.max(2, Math.min(8, camera.position.z + e.deltaY * 0.005));
  });

  animate();
}

function animate() {
  requestAnimationFrame(animate);
  if (autoRotate && polyGroup) {
    polyGroup.rotation.y -= 0.003; // counterclockwise (lunar direction)
  }
  renderer.render(scene, camera);
}

function handleResize() {
  const container = document.getElementById('three-col');
  if (!container || !renderer) return;
  const w = container.clientWidth, h = container.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', handleResize);

// ══════════════════════════════════════════════
//  POLYHEDRON RENDERING
// ══════════════════════════════════════════════

function buildPolyhedron(data, highlightFace, deviColor) {
  // Clear existing
  while (polyGroup.children.length) polyGroup.remove(polyGroup.children[0]);

  const verts = data.vertices || [];
  const faces = data.faces || [];
  const labels = data.face_labels || [];

  // Parse color
  const col = deviColor || '#c8a96e';
  const cr = parseInt(col.slice(1,3),16)/255 || 0.78;
  const cg = parseInt(col.slice(3,5),16)/255 || 0.66;
  const cb = parseInt(col.slice(5,7),16)/255 || 0.43;

  // Build geometry from faces
  const geometry = new THREE.BufferGeometry();
  const positions = [];
  const colors = [];

  faces.forEach((face, fi) => {
    if (face.length < 3) return;
    const isHighlight = (labels && labels[fi] === highlightFace) || fi === highlightFace;
    const alpha = isHighlight ? 0.5 : 0.15;

    // Triangulate (fan from first vertex)
    for (let i = 1; i < face.length - 1; i++) {
      const v0 = verts[face[0]], v1 = verts[face[i]], v2 = verts[face[i+1]];
      if (!v0 || !v1 || !v2) continue;
      positions.push(v0[0], v0[1], v0[2], v1[0], v1[1], v1[2], v2[0], v2[1], v2[2]);
      for (let j = 0; j < 3; j++) {
        colors.push(isHighlight ? 1.0 : cr, isHighlight ? 0.85 : cg, isHighlight ? 0.3 : cb);
      }
    }
  });

  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  geometry.computeVertexNormals();

  // Semi-transparent faces
  const faceMat = new THREE.MeshPhongMaterial({
    vertexColors: true, transparent: true, opacity: 0.2,
    side: THREE.DoubleSide, shininess: 30,
  });
  polyGroup.add(new THREE.Mesh(geometry, faceMat));

  // Edges
  const edgeGeo = new THREE.EdgesGeometry(geometry);
  const edgeMat = new THREE.LineBasicMaterial({color: new THREE.Color(cr, cg, cb), transparent: true, opacity: 0.6});
  polyGroup.add(new THREE.LineSegments(edgeGeo, edgeMat));

  // Vertex spheres
  verts.forEach(v => {
    const sphere = new THREE.Mesh(
      new THREE.SphereGeometry(0.025, 8, 8),
      new THREE.MeshBasicMaterial({color: new THREE.Color(cr*1.3, cg*1.3, cb*1.3), transparent: true, opacity: 0.7})
    );
    sphere.position.set(v[0], v[1], v[2]);
    polyGroup.add(sphere);
  });
}

// ══════════════════════════════════════════════
//  DATA LOADING
// ══════════════════════════════════════════════

async function loadWholeMonth() {
  const data = await _get('/nitya/mediator/whole');
  if (!data) return;
  currentPolyData = data;

  // Get today's tithi
  const f = await _get('/field');
  F = f || {};
  const tidx = f?.panchanga?.tidx || 0;
  const todayFace = tidx + 1;
  currentTithi = null;

  buildPolyhedron(data, todayFace, '#c8a96e');

  // Update strip
  const pa = f?.panchanga || {};
  document.getElementById('field-strip').textContent =
    (pa.nakshatra||'') + ' \u00b7 ' + (pa.tithi||'') + ' \u00b7 ' + (pa.vara||'');

  // Caption
  document.getElementById('caption').textContent =
    'Rhombic triacontahedron \u00b7 30 faces = 30 tithis \u00b7 icosahedral symmetry mediator \u00b7 face ' + todayFace + ' highlighted';

  // Load today's devi for side panel
  await loadDeviPanel(todayFace);

  // URL
  history.replaceState(null, '', '/nitya/mandala');
}

async function loadSpecificDevi(tithi) {
  if (tithi < 1 || tithi > 15) tithi = 1;
  currentTithi = tithi;

  // Update field strip
  const f = await _get('/field');
  if (f) {
    F = f;
    const pa = f.panchanga || {};
    document.getElementById('field-strip').textContent =
      (pa.nakshatra||'') + ' \u00b7 ' + (pa.tithi||'') + ' \u00b7 ' + (pa.vara||'');
  } else {
    document.getElementById('field-strip').textContent = 'offline';
  }

  const data = await _get('/nitya/mediator/' + tithi);
  if (!data) return;
  currentPolyData = data;

  const deviColor = data.devi?.color_hex || '#c8a96e';
  buildPolyhedron(data.polyhedron, 0, deviColor);

  // Caption
  document.getElementById('caption').textContent =
    data.sixd_parent_description + ' \u00b7 ' + (data.polyhedron?.construction_name || '');

  // Side panel
  await loadDeviPanel(tithi);

  // URL
  history.replaceState(null, '', '/nitya/mandala?tithi=' + tithi);
}

async function loadDeviPanel(tithi) {
  const devi = await _get('/nitya/devi/' + tithi);
  if (!devi) return;

  document.getElementById('devi-name').textContent = devi.name_iast || '--';

  let h = '';
  if (devi.name_devanagari) h += `<div class="val" style="font-size:14px;color:rgba(200,169,110,.6)">${devi.name_devanagari}</div>`;
  h += `<div class="lbl">TITHI</div><div class="val">${devi.tithi_position || tithi} \u00b7 ${devi.N || '?'}-fold symmetry</div>`;

  if (devi.bija) h += `<div style="font-size:18px;color:var(--teal);margin:6px 0">${devi.bija}</div>`;
  if (devi.mantra_short) h += `<div style="font-size:9px;color:var(--dim)">${devi.mantra_short}</div>`;

  h += `<div class="sep"></div><div class="lbl">CHARACTER</div>`;
  h += `<div class="val" style="font-style:italic;color:var(--muted);font-size:11px;line-height:1.6">${devi.character || ''}</div>`;

  h += `<div class="sep"></div>`;
  if (devi.element) h += `<div class="lbl">ELEMENT</div><div class="val">${devi.element}</div>`;
  if (devi.graha) h += `<div class="lbl">GRAHA</div><div class="val">${devi.graha}</div>`;
  if (devi.guna) h += `<div class="lbl">GUNA</div><div class="val">${devi.guna}</div>`;
  if (devi.shakti) h += `<div class="lbl">SHAKTI</div><div class="val">${devi.shakti}</div>`;
  if (devi.rasa) h += `<div class="lbl">RASA</div><div class="val">${devi.rasa}</div>`;

  if (devi.attestation) {
    h += `<div class="sep"></div><div class="lbl">ATTESTATION</div>`;
    h += `<div style="font-size:9px;color:var(--dim)">${devi.attestation}</div>`;
  }

  document.getElementById('devi-info').innerHTML = h;

  // 2D preview
  render2DPreview(tithi, devi);
}

async function render2DPreview(tithi, devi) {
  const canvas = document.getElementById('preview-canvas');
  const ctx = canvas.getContext('2d');
  const size = 256;
  canvas.width = size; canvas.height = size;

  const N = devi.N || 3;
  const phase = (devi.angular_position_degrees || 0) * Math.PI / 180;
  const k = devi.frequency_multiplier || 1;
  const col = devi.color_hex || '#c8a96e';
  const cr = parseInt(col.slice(1,3),16)||200, cg = parseInt(col.slice(3,5),16)||169, cb = parseInt(col.slice(5,7),16)||110;

  const imageData = ctx.createImageData(size, size);
  const half = size / 2, scale = 4 * k;

  for (let py = 0; py < size; py++) {
    for (let px = 0; px < size; px++) {
      const x = (px - half) / (size / scale), y = (py - half) / (size / scale);
      let v = 0;
      for (let j = 0; j < N; j++) {
        const angle = 2 * Math.PI * j / N + phase;
        v += Math.cos(x * Math.cos(angle) + y * Math.sin(angle));
      }
      const norm = (v + N) / (2 * N);
      const idx = (py * size + px) * 4;
      imageData.data[idx] = Math.floor(norm * cr);
      imageData.data[idx+1] = Math.floor(norm * cg);
      imageData.data[idx+2] = Math.floor(norm * cb);
      imageData.data[idx+3] = Math.floor(40 + 200 * norm);
    }
  }
  ctx.putImageData(imageData, 0, 0);

  document.getElementById('preview-label').textContent =
    `${devi.name_iast || '?'} \u00b7 N=${N} \u00b7 2D projection`;
}

function goHome() {
  loadWholeMonth();
}

// ══════════════════════════════════════════════
//  KEYBOARD
// ══════════════════════════════════════════════

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') goHome();
  const num = parseInt(e.key);
  if (num >= 1 && num <= 9) loadSpecificDevi(num);
});

// ══════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════

window.addEventListener('DOMContentLoaded', () => {
  initThree();

  // Check URL for tithi parameter
  const params = new URLSearchParams(window.location.search);
  const tithi = params.get('tithi');
  if (tithi) {
    loadSpecificDevi(parseInt(tithi));
  } else {
    loadWholeMonth();
  }
});
</script>
</body>
</html>
