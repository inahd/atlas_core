<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>S0 · grounds</title>
<style>
:root{--bg:#02030a;--panel:#080c14;--border:#0e1420;--gold:#c8941a;--teal:#1a8a7a;--purple:#7060cc;--text:#8a9ab0;--dim:#3a4a5a;--bright:#c8d8e8}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Courier New',monospace;font-size:10px;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.layer-strip{height:24px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 12px;flex-shrink:0}
.layer-left{display:flex;align-items:center;gap:8px}
.layer-id{font-size:9px;color:var(--dim)}
.layer-name{font-size:10px;color:var(--purple);font-family:Georgia,serif}
.layer-clock{font-size:9px;color:var(--dim)}
.main{flex:1;overflow-y:auto;padding:16px}
.field-strip{height:20px;background:var(--panel);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:center;gap:12px;font-size:9px;color:var(--dim);flex-shrink:0}
.block-header{font-size:8px;text-transform:uppercase;color:var(--dim);letter-spacing:0.12em;margin-bottom:8px;margin-top:20px}
.block-header:first-child{margin-top:0}
.passage{margin-bottom:14px}
.passage-meta{font-size:8px;color:var(--dim);margin-bottom:2px}
.passage-text{font-family:Georgia,serif;font-size:11px;color:var(--text);line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.passage-attr{font-size:8px;color:var(--dim);margin-top:2px}
.devi-name{font-family:Georgia,serif;font-size:14px;color:var(--gold);margin-bottom:4px}
.detail{font-size:9px;color:var(--dim);margin-bottom:2px}
.home-link{position:fixed;bottom:8px;right:8px;font-family:'Courier New',monospace;font-size:8px;color:var(--dim);text-decoration:none;letter-spacing:0.15em}
.badge{display:inline-block;font-size:7px;color:var(--dim);border:1px solid var(--border);padding:0 4px;border-radius:2px;margin-right:4px}
</style>
</head>
<body>
<div class="layer-strip">
  <div class="layer-left"><span class="layer-id">S0</span><span class="layer-name">grounds</span></div>
  <span class="layer-clock" id="clock"></span>
</div>
<div class="main" id="content">
  <div class="block-header">CORPUS</div>
  <div id="corpus">◌ loading</div>
  <div class="block-header">FIELD DEPTH</div>
  <div id="depth">◌ loading</div>
</div>
<div class="field-strip" id="field-strip">◌</div>
<a href="/" class="home-link">✦ ATLAS</a>
<script>
function tick(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('en-GB',{hour12:false})}
tick();setInterval(tick,1000);

function p(d,path,fb){let v=d;for(const k of path.split('.')){if(!v)return fb;v=v[k]}return(typeof v==='object'&&v!==null)?(v.name||fb):v||fb}

async function loadField(){
  try{
    const r=await fetch('/field');const d=await r.json();
    const nak=p(d,'panchanga.nakshatra','—');
    const tithi=p(d,'panchanga.tithi','—');
    const vara=p(d,'panchanga.vara','—');
    const devi=p(d,'panchanga.devi','—');
    document.getElementById('field-strip').textContent=[nak,tithi,vara,devi].join(' · ');
    renderDepth(d);
    loadCorpus(nak);
  }catch(e){document.getElementById('field-strip').textContent='◌'}
}

async function loadCorpus(nak){
  const el=document.getElementById('corpus');
  try{
    const r=await fetch('/corpus/search?q='+encodeURIComponent(nak)+'&limit=3');
    const d=await r.json();
    const results=d.results||d.passages||d;
    if(!Array.isArray(results)||results.length===0){el.textContent='◌ no passages';return}
    el.innerHTML='';
    results.slice(0,3).forEach(p=>{
      const div=document.createElement('div');div.className='passage';
      const trad=p.tradition||p.source_tradition||'';
      const src=p.source||p.text_id||'';
      const excerpt=p.excerpt||p.passage||p.text||'';
      const att=p.attestation||p.confidence||'';
      div.innerHTML='<div class="passage-meta">'+(trad?'<span class="badge">'+trad+'</span>':'')+src+'</div>'
        +'<div class="passage-text">'+excerpt+'</div>'
        +(att?'<div class="passage-attr">'+att+'</div>':'');
      el.appendChild(div);
    });
  }catch(e){el.textContent='◌ corpus offline'}
}

function renderDepth(d){
  const el=document.getElementById('depth');
  const devi=p(d,'panchanga.devi','—');
  const element=p(d,'field.element','')||p(d,'element','');
  const traditions=d.field?.active_traditions||d.active_traditions||[];
  const alpha=d.field?.alpha||d.alpha||'';
  let html='<div class="devi-name">'+devi+'</div>';
  if(element)html+='<div class="detail">tradition: '+element+'</div>';
  if(traditions.length)html+='<div class="detail">active texts: '+traditions.join(', ')+'</div>';
  if(alpha)html+='<div class="detail">alpha: '+alpha+'</div>';
  el.innerHTML=html;
}

loadField();setInterval(loadField,60000);
</script>
</body>
</html>
