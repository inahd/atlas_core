<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>S1 · Archetype · Sound</title>
<link rel="stylesheet" href="/static/atlas-theme.css">
<script src="/static/atlas.js"></script>
<style>
body{background:var(--bg);color:var(--text);font-family:var(--font-mono);font-size:11px;height:100vh;display:grid;grid-template-columns:200px 1fr 200px;grid-template-rows:1fr 28px;overflow:hidden}
.col{padding:12px;overflow-y:auto}
.col-l{border-right:1px solid var(--border)}
.col-r{border-left:1px solid var(--border)}
.hdr{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.15em;margin-bottom:6px}
.val{font-family:var(--font-body);font-size:14px;color:var(--gold);margin-bottom:2px}
.sub{font-size:10px;color:var(--muted);margin-bottom:2px}
.dim{font-size:10px;color:var(--dim);margin-bottom:2px}
.sep{height:1px;background:var(--border);margin:8px 0}
.raga-name{font-family:var(--font-body);font-size:28px;color:var(--gold);text-align:center;margin-bottom:8px}
.sa{font-family:var(--font-mono);font-size:13px;color:var(--teal);text-align:center;margin-bottom:12px}
.mix-row{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.mix-label{font-size:9px;color:var(--dim);min-width:50px}
.mix-bar{flex:1;height:3px;background:var(--border);border-radius:1px}
.mix-fill{height:100%;border-radius:1px}
.footer{grid-column:1/-1;background:var(--panel);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:center;gap:12px;font-size:10px;color:var(--dim)}
.footer .nak{font-family:var(--font-body);color:var(--gold);font-size:12px}
.nav{position:fixed;right:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px}
.nav a{width:8px;height:8px;border-radius:50%;border:1px solid var(--border);display:block}
.nav a.active{background:var(--gold);border-color:var(--gold)}
.nav a:hover{border-color:var(--gold)}
.sc-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px}
</style>
</head>
<body>
<div class="col col-l" id="left">◌</div>
<div class="col" id="center" style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px">◌</div>
<div class="col col-r" id="right">◌</div>
<div class="footer"><span id="ft-nak" class="nak">—</span><span id="ft-tithi">—</span><span id="ft-vara">—</span><span id="ft-devi">—</span><span style="width:6px;height:6px;border-radius:50%;background:var(--teal)"></span></div>
<nav class="nav"><a href="/s0"></a><a href="/s1" class="active"></a><a href="/s2"></a><a href="/s3"></a><a href="/s4"></a><a href="/s5"></a><a href="/s6"></a></nav>
<script>
async function load(){
  const[field,snd,chandas,gol]=await Promise.all([atlasGet('/field',{}),atlasGet('/sound/state',{}),atlasGet('/chandas',{}),atlasGet('/goloka',{})]);
  const pa=field?.panchanga||{};const ss=field?.sound_state||snd||{};
  const nak=pa.nakshatra||'—';const tithi=pa.tithi||'—';const vara=pa.vara||'—';
  const devi=typeof pa.devi==='object'?(pa.devi?.name||'—'):(pa.devi||'—');
  document.getElementById('ft-nak').textContent=nak;document.getElementById('ft-tithi').textContent=tithi;
  document.getElementById('ft-vara').textContent=vara;document.getElementById('ft-devi').textContent=devi;

  // Left — Panchanga
  let left=`<div class="hdr">PANCHANGA</div><div class="val">${nak}</div>`;
  if(pa.nak_data?.deity)left+=`<div class="sub">${pa.nak_data.deity}</div>`;
  left+=`<div class="sub">${tithi} · ${pa.paksha||''}</div><div class="sub">${vara}</div>`;
  if(pa.element)left+=`<div class="dim">${pa.element} · ${pa.guna||''}</div>`;
  const hora=field?.hora||{};if(hora.hora_lord)left+=`<div class="dim">hora: ${hora.hora_lord}</div>`;
  const rk=field?.rahu_kala||{};if(rk.rahu_kala_start)left+=`<div class="dim" style="color:${rk.rahu_kala_active?'var(--red)':'var(--dim)'}">rahu: ${rk.rahu_kala_start}–${rk.rahu_kala_end}${rk.rahu_kala_active?' ACTIVE':''}</div>`;
  document.getElementById('left').innerHTML=left;

  // Center — Sound
  const raga=ss.raga||snd?.raga||'—';const saHz=ss.sa_hz||snd?.sa_hz||'?';
  const tala=ss.tala||snd?.tala||'—';const bpm=ss.bpm||snd?.bpm||'?';
  const vadi=ss.raga_vadi||snd?.raga_detail?.vadi||'';const samvadi=ss.raga_samvadi||snd?.raga_detail?.samvadi||'';
  let center=`<div class="raga-name">${raga}</div>`;
  center+=`<div class="sa">Sa ${saHz}Hz</div>`;
  if(vadi||samvadi)center+=`<div class="sub" style="text-align:center">vādī: ${vadi||'—'} · samvādī: ${samvadi||'—'}</div>`;
  center+=`<div class="sub" style="text-align:center">${tala} · ${bpm}bpm</div>`;
  // Layer mix
  const layers=snd?.layers||{};const mixNames=['tanpura','melody','tabla','bija','drone'];
  center+=`<div style="width:200px;margin-top:16px">`;
  mixNames.forEach(name=>{
    const val=layers[name]??0.5;
    center+=`<div class="mix-row"><span class="mix-label">${name}</span><div class="mix-bar"><div class="mix-fill" style="width:${val*100}%;background:var(--gold)"></div></div></div>`;
  });
  center+=`</div>`;
  // SC status
  const sc=snd?.sc||{};const scOk=sc.status==='booted'||sc.status==='ready';
  center+=`<div style="margin-top:12px;font-size:10px"><span class="sc-dot" style="background:${scOk?'var(--teal)':'var(--dim)'}"></span>SC ${scOk?'running':'offline'}</div>`;
  document.getElementById('center').innerHTML=center;

  // Right — Field
  const deviCol=typeof pa.devi==='object'?(pa.devi?.color||'#7060cc'):'#7060cc';
  let right=`<div class="hdr">DEVI</div><div style="font-family:var(--font-body);font-size:14px;color:${deviCol}">${devi}</div>`;
  if(chandas?.primary_metre)right+=`<div class="sep"></div><div class="hdr">CHANDAS</div><div class="sub">${chandas.primary_metre}</div><div class="dim">${chandas.cadence_pattern||''}</div>`;
  const golRaga=gol?.ashtakala_period?.raga||'';
  if(golRaga){
    const match=golRaga.toLowerCase()===raga.toLowerCase();
    right+=`<div class="sep"></div><div class="hdr">GOLOKA RAGA</div><div class="sub" style="color:${match?'var(--teal)':'var(--amber)'}">${golRaga} ${match?'✓ aligned':'≠ divergent'}</div>`;
  }
  // S-layer dots
  right+=`<div class="sep"></div><div class="hdr">LAYERS</div><div style="display:flex;gap:4px;margin-top:4px">`;
  ['#7060cc','#e0b040','#20a88a','#c8d8e8','#e0b040','#3a7a4a','#7060cc'].forEach((c,i)=>{
    const active=i===1;right+=`<div style="width:8px;height:8px;border-radius:50%;background:${c};opacity:${active?1:0.3}"></div>`;
  });
  right+=`</div>`;
  document.getElementById('right').innerHTML=right;
}
load();setInterval(load,60000);
</script>
</body>
</html>
