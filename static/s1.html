<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>S1 · Archetype</title>
<link rel="stylesheet" href="/static/atlas-theme.css">
<script src="/static/atlas.js"></script>
<style>
body{background:var(--bg);color:var(--text);font-family:var(--font-mono);font-size:11px;height:100vh;display:grid;grid-template-columns:200px 1fr 200px;grid-template-rows:1fr 28px;overflow:hidden}
.col{padding:12px;overflow-y:auto}.col-l{border-right:1px solid var(--border)}.col-r{border-left:1px solid var(--border)}
.hdr{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.15em;margin-bottom:5px;margin-top:10px}.hdr:first-child{margin-top:0}
.val{font-family:var(--font-body);font-size:14px;color:var(--gold);margin-bottom:2px}.sub{font-size:10px;color:var(--muted);margin-bottom:2px}.dim{font-size:10px;color:var(--dim);margin-bottom:2px}
.sep{height:1px;background:var(--border);margin:8px 0}
.devi-name{font-family:var(--font-body);font-size:28px;text-align:center;margin-bottom:4px}
.deity-name{font-family:var(--font-body);font-size:18px;color:var(--teal);text-align:center;margin-bottom:8px}
.weapon-list{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.weapon{font-size:10px;color:var(--amber);border:1px solid var(--border);padding:2px 6px;border-radius:3px}
.attr-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;margin:4px 0}
.attr-k{font-size:9px;color:var(--dim);text-align:right}.attr-v{font-size:10px;color:var(--muted)}
.footer{grid-column:1/-1;background:var(--panel);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:center;gap:12px;font-size:10px;color:var(--dim)}
.footer .nak{font-family:var(--font-body);color:var(--gold);font-size:12px}
.nav{position:fixed;right:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px}
.nav a{width:8px;height:8px;border-radius:50%;border:1px solid var(--border);display:block;text-decoration:none}.nav a.on{background:var(--gold);border-color:var(--gold)}.nav a:hover{border-color:var(--gold)}
</style>
</head>
<body>
<div class="col col-l" id="left">◌</div>
<div class="col" id="center" style="display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:20px">◌</div>
<div class="col col-r" id="right">◌</div>
<div class="footer"><span id="fn" class="nak">—</span><span id="ft">—</span><span id="fv">—</span><span id="fd">—</span><span style="width:6px;height:6px;border-radius:50%;background:var(--teal)"></span></div>
<nav class="nav"><a href="/s0"></a><a href="/s1" class="on"></a><a href="/s2"></a><a href="/s3"></a><a href="/s4"></a><a href="/s5"></a><a href="/s6"></a></nav>
<script>
function dv(o){return typeof o==='object'&&o?(o.name||'—'):(o||'—')}
function fmt(s){return s?s.replace(/_/g,' '):'—'}

async function load(){
  const[f,lyr,snd]=await Promise.all([
    atlasGet('/field',{}),
    atlasGet('/layer/s1/compose',{}),
    atlasGet('/sound/state',{})
  ]);
  const pa=f?.panchanga||{},ss=f?.sound_state||{};
  document.getElementById('fn').textContent=pa.nakshatra||'—';
  document.getElementById('ft').textContent=pa.tithi||'—';
  document.getElementById('fv').textContent=pa.vara||'—';
  document.getElementById('fd').textContent=dv(pa.devi);

  // Parse layer sections
  const secs={};
  (lyr?.sections||[]).forEach(s=>{secs[s.title]=s.content});

  // ── LEFT: Panchanga + Sound ──
  let L=`<div class="hdr">PANCHANGA</div><div class="val">${pa.nakshatra||'—'}</div>`;
  if(pa.nak_data?.deity)L+=`<div class="sub">${pa.nak_data.deity} · ${pa.nak_data.shakti||''}</div>`;
  L+=`<div class="sub">${pa.tithi||'—'} · ${pa.paksha||''}</div><div class="sub">${pa.vara||'—'}</div>`;
  if(pa.element)L+=`<div class="dim">${pa.element} · ${pa.guna||''}</div>`;

  L+=`<div class="sep"></div><div class="hdr">SOUND</div>`;
  const raga=ss.raga||snd?.raga||'—';
  L+=`<div class="val">${raga}</div>`;
  const tala=ss.tala||snd?.tala||'—';
  L+=`<div class="dim">${tala} · ${ss.bpm||snd?.bpm||'?'}bpm</div>`;

  // Graha bija from layer
  const bija=secs['GRAHA BIJA'];
  if(Array.isArray(bija)){
    L+=`<div class="sep"></div><div class="hdr">GRAHA BIJA</div>`;
    bija.forEach(b=>L+=`<div class="dim">${b.graha||''}: ${b.bija||''}</div>`);
  }

  document.getElementById('left').innerHTML=L;

  // ── CENTER: Devi + Deity profile ──
  const deviSec=secs['NITYA DEVI']||{};
  const deitySec=secs['NAKSHATRA DEITY']||{};
  const dc=deviSec.color||'#7060cc';

  let C='';
  // Devi header
  C+=`<div class="devi-name" style="color:${dc}">${deviSec.name||dv(pa.devi)}</div>`;
  if(deviSec.color_meaning)C+=`<div class="dim" style="text-align:center">${deviSec.color_meaning}</div>`;

  C+=`<div class="sep"></div>`;

  // Nakshatra deity
  if(deitySec.deity){
    C+=`<div class="deity-name">${fmt(deitySec.deity)}</div>`;
    C+=`<div class="dim" style="text-align:center">${fmt(deitySec.nakshatra)} · ${fmt(deitySec.rasa)} · ${fmt(deitySec.tattva)}</div>`;

    // Weapons
    const wpns=deitySec.weapons||[];
    if(wpns.length){
      C+=`<div class="hdr" style="text-align:center;margin-top:10px">WEAPONS</div>`;
      C+=`<div class="weapon-list">`;
      wpns.forEach(w=>C+=`<span class="weapon">${fmt(w)}</span>`);
      C+=`</div>`;
    }

    // Attributes grid
    C+=`<div class="attr-grid" style="margin-top:8px">`;
    const attrs=[
      ['vahana',deitySec.vahana],['mudra',deitySec.mudra],
      ['color',deitySec.color_body],['garment',deitySec.color_garment],
      ['direction',deitySec.direction],['gemstone',deitySec.gemstone],
      ['metal',deitySec.metal],['day',deitySec.day],
      ['time',deitySec.time_of_day],['bija',deitySec.mantra_bija],
      ['shakti',deitySec.shakti_name],
    ];
    attrs.forEach(([k,v])=>{if(v)C+=`<div class="attr-k">${k}</div><div class="attr-v">${fmt(v)}</div>`});
    C+=`</div>`;
  }

  document.getElementById('center').innerHTML=C;

  // ── RIGHT: Domains + Vahana + Raga ──
  let R='';
  const masterSec=secs['DEITY']||{};
  if(masterSec.name){
    R+=`<div class="hdr">GRAHA DEITY</div>`;
    R+=`<div class="val">${masterSec.name}</div>`;
    R+=`<div class="dim">${masterSec.domain||''} · ${masterSec.element||''}</div>`;
    if(masterSec.weapon)R+=`<div class="dim">${masterSec.weapon} · ${masterSec.vahana||''}</div>`;
  }

  const domainSec=secs['DOMAINS'];
  if(Array.isArray(domainSec)){
    R+=`<div class="hdr">DEITY DOMAINS</div>`;
    domainSec.forEach(d=>R+=`<div class="dim">${d.deity||''}: ${d.domain||''} (${d.element||''})</div>`);
  }

  const vahanaSec=secs['VAHANA']||{};
  if(vahanaSec.vahana){
    R+=`<div class="sep"></div><div class="hdr">VAHANA</div>`;
    R+=`<div class="sub">${fmt(vahanaSec.vahana)}</div>`;
    R+=`<div class="dim">${fmt(vahanaSec.symbolism)}</div>`;
  }

  const ragaSec=secs['GRAHA RAGA'];
  if(Array.isArray(ragaSec)){
    R+=`<div class="sep"></div><div class="hdr">GRAHA RAGA</div>`;
    ragaSec.forEach(r=>{if(r.raga)R+=`<div class="dim">${r.graha||''}: ${r.raga}</div>`});
  }

  R+=`<div class="sep"></div><div class="hdr">LAYERS</div><div style="display:flex;gap:4px">`;
  ['#7060cc','#e0b040','#20a88a','#c8d8e8','#e0b040','#3a7a4a','#7060cc'].forEach((c,i)=>{
    R+=`<a href="/s${i}" style="width:8px;height:8px;border-radius:50%;background:${c};opacity:${i===1?1:0.3};display:block"></a>`;
  });R+=`</div>`;
  document.getElementById('right').innerHTML=R;
}
load();setInterval(load,60000);
</script>
</body>
</html>
