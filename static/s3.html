<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>S3 · Kāla · Time</title>
<link rel="stylesheet" href="/static/atlas-theme.css">
<script src="/static/atlas.js"></script>
<style>
body{background:var(--bg);color:var(--text);font-family:var(--font-mono);font-size:11px;height:100vh;display:grid;grid-template-rows:auto 1fr 28px;overflow:hidden}
.header-band{background:var(--panel);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;gap:20px;align-items:baseline;flex-wrap:wrap}
.hv{font-family:var(--font-body);font-size:18px;color:var(--gold)}
.hs{font-size:11px;color:var(--muted)}
.hd{font-size:10px;color:var(--dim)}
.main{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);overflow:hidden}
.panel{background:var(--bg);padding:14px;overflow-y:auto}
.hdr{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.15em;margin-bottom:6px;margin-top:10px}
.hdr:first-child{margin-top:0}
.val{font-family:var(--font-body);font-size:14px;color:var(--gold);margin-bottom:2px}
.sub{font-size:11px;color:var(--text);margin-bottom:2px}
.dim{font-size:10px;color:var(--dim);margin-bottom:2px}
.act{font-size:10px;color:var(--muted);padding-left:8px;margin-bottom:1px}
.act::before{content:'· ';color:var(--dim)}
.avoid{font-size:10px;color:var(--red);opacity:.7;padding-left:8px;margin-bottom:1px}
.avoid::before{content:'✗ ';color:var(--red)}
.sep{height:1px;background:var(--border);margin:8px 0}
.coh-bar{width:100%;height:3px;background:var(--border);border-radius:1px;margin:3px 0}
.coh-fill{height:100%;border-radius:1px;background:var(--teal)}
.footer{grid-column:1/-1;background:var(--panel);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:center;gap:12px;font-size:10px;color:var(--dim)}
.footer .nak{font-family:var(--font-body);color:var(--gold);font-size:12px}
.nav{position:fixed;right:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px}
.nav a{width:8px;height:8px;border-radius:50%;border:1px solid var(--border);display:block}
.nav a.active{background:var(--text);border-color:var(--text)}
.nav a:hover{border-color:var(--gold)}
</style>
</head>
<body>
<div class="header-band" id="panchanga-bar">◌</div>
<div class="main">
  <div class="panel" id="svarodaya-panel">◌</div>
  <div class="panel" id="dinacharya-panel">◌</div>
</div>
<div class="footer"><span id="ft-nak" class="nak">—</span><span id="ft-tithi">—</span><span id="ft-vara">—</span><span id="ft-devi">—</span><span style="width:6px;height:6px;border-radius:50%;background:var(--teal)"></span></div>
<nav class="nav"><a href="/s0"></a><a href="/s1"></a><a href="/s2"></a><a href="/s3" class="active"></a><a href="/s4"></a><a href="/s5"></a><a href="/s6"></a></nav>
<script>
async function load(){
  const[field,sv,din,traj]=await Promise.all([atlasGet('/field',{}),atlasGet('/svarodaya',{}),atlasGet('/dinacharya',{}),atlasGet('/trajectory',{})]);
  const pa=field?.panchanga||{};
  const nak=pa.nakshatra||'—';const tithi=pa.tithi||'—';const vara=pa.vara||'—';
  const devi=typeof pa.devi==='object'?(pa.devi?.name||'—'):(pa.devi||'—');
  document.getElementById('ft-nak').textContent=nak;document.getElementById('ft-tithi').textContent=tithi;
  document.getElementById('ft-vara').textContent=vara;document.getElementById('ft-devi').textContent=devi;

  // Header band — Panchanga
  let hb=`<span class="hv">${nak}</span><span class="hs">${tithi} · ${pa.paksha||''}</span><span class="hs">${vara}</span>`;
  if(pa.element)hb+=`<span class="hd">${pa.element} · ${pa.guna||''}</span>`;
  if(pa.masa_name)hb+=`<span class="hd">${pa.masa_name}</span>`;
  document.getElementById('panchanga-bar').innerHTML=hb;

  // Left — Svarodaya
  let left='<div class="hdr">SVARODAYA</div>';
  if(sv?.optimal_nadi){
    left+=`<div class="val">${sv.optimal_nadi} nāḍī</div>`;
    left+=`<div class="sub">${sv.nadi_side||''} · ${sv.nadi_graha||''}</div>`;
    left+=`<div class="dim">${sv.nadi_quality||''}</div>`;
    left+=`<div class="sep"></div><div class="hdr">ELEMENT</div>`;
    left+=`<div class="sub">${sv.element_of_breath||'—'}</div>`;
    left+=`<div class="dim">${sv.element_sensation||''}</div>`;
    left+=`<div class="dim">${sv.element_duration_minutes||''}min cycle</div>`;
    if(sv.coherence_score!=null){
      left+=`<div class="sep"></div><div class="hdr">COHERENCE</div>`;
      left+=`<div class="coh-bar"><div class="coh-fill" style="width:${sv.coherence_score*100}%"></div></div>`;
      left+=`<div class="dim">${(sv.coherence_score*100).toFixed(0)}%</div>`;
    }
    left+=`<div class="sep"></div><div class="hdr">RECOMMENDED</div>`;
    (sv.recommended_activities||[]).forEach(a=>left+=`<div class="act">${a.replace(/_/g,' ')}</div>`);
    if(sv.avoid_activities?.length){
      left+=`<div class="hdr">AVOID</div>`;
      sv.avoid_activities.forEach(a=>left+=`<div class="avoid">${a.replace(/_/g,' ')}</div>`);
    }
  }else left+='<div class="dim">engine offline</div>';
  document.getElementById('svarodaya-panel').innerHTML=left;

  // Right — Dinacharya
  let right='<div class="hdr">DINACHARYA</div>';
  if(din?.ashtakala_period){
    right+=`<div class="val">${din.ashtakala_period}</div>`;
    right+=`<div class="sub">${din.primary_activity?.replace(/_/g,' ')||''}</div>`;
    if(din.mantra)right+=`<div class="dim">mantra: ${din.mantra}</div>`;
    if(din.offering)right+=`<div class="dim">offering: ${din.offering}</div>`;
    right+=`<div class="sep"></div><div class="hdr">DOSHA</div>`;
    right+=`<div class="sub">${din.dosha_active||'—'} active</div>`;
    right+=`<div class="sep"></div><div class="hdr">DIETARY</div>`;
    right+=`<div class="sub">${din.dietary_guidance||'—'}</div>`;
    if(din.recommended_herbs?.length){
      right+=`<div class="sep"></div><div class="hdr">HERBS</div>`;
      din.recommended_herbs.forEach(h=>right+=`<div class="act">${h}</div>`);
    }
    if(din.recommended_practices?.length){
      right+=`<div class="sep"></div><div class="hdr">PRACTICE</div>`;
      din.recommended_practices.slice(0,5).forEach(p=>right+=`<div class="act">${p}</div>`);
    }
    if(din.avoid?.length){
      right+=`<div class="hdr">AVOID</div>`;
      din.avoid.slice(0,4).forEach(a=>right+=`<div class="avoid">${a.replace(/_/g,' ')}</div>`);
    }
    if(din.raga)right+=`<div class="sep"></div><div class="dim">rāga: ${din.raga}</div>`;
    if(din.forest)right+=`<div class="dim">forest: ${din.forest}</div>`;
  }else right+='<div class="dim">engine offline</div>';

  // Trajectory
  if(traj?.now){right+=`<div class="sep"></div><div class="hdr">TRAJECTORY</div><div class="sub">${traj.now}</div>`;
    if(traj.moving_toward)right+=`<div class="dim">→ ${traj.moving_toward}</div>`;
    if(traj.dasha_context)right+=`<div class="dim">${traj.dasha_context}</div>`}
  document.getElementById('dinacharya-panel').innerHTML=right;
}
load();setInterval(load,60000);
</script>
</body>
</html>
