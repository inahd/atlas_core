<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>S3 · Kāla</title>
<link rel="stylesheet" href="/static/atlas-theme.css">
<script src="/static/atlas.js"></script>
<script src="/static/interaction_engine.js"></script>
<style>
body{background:var(--bg);color:var(--text);font-family:var(--font-mono);font-size:11px;height:100vh;display:grid;grid-template-rows:auto 1fr auto 28px;overflow:hidden}

/* top bar */
.top{background:var(--panel);border-bottom:1px solid var(--border);padding:14px 20px;text-align:center}
.top .nak-name{font-family:var(--font-body);font-size:22px;color:var(--gold);letter-spacing:.02em}
.top .nak-sub{font-size:11px;color:var(--muted);margin-top:3px}

/* two-column grid */
.main{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);overflow:hidden}
.pan{background:var(--bg);padding:16px 18px;overflow-y:auto}

/* typography */
.hdr{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.15em;margin-bottom:5px;margin-top:12px}.hdr:first-child{margin-top:0}
.val{font-family:var(--font-body);font-size:16px;color:var(--gold);margin-bottom:2px}
.val-sm{font-family:var(--font-body);font-size:13px;color:var(--gold);margin-bottom:2px}
.sub{font-size:11px;color:var(--text);margin-bottom:2px;line-height:1.45}
.dim{font-size:10px;color:var(--dim);margin-bottom:2px}
.muted{font-size:10px;color:var(--muted);margin-bottom:2px}
.themes{font-family:var(--font-body);font-size:12px;color:var(--muted);font-style:italic;line-height:1.5;margin:4px 0 6px}

/* activities */
.act{font-size:10px;color:var(--muted);padding-left:6px;margin-bottom:1px}.act::before{content:'· '}
.avoid{font-size:10px;color:var(--red);opacity:.7;padding-left:6px;margin-bottom:1px}.avoid::before{content:'✗ '}

/* coherence bar */
.cbar{width:100%;height:3px;background:var(--border);border-radius:1px;margin:3px 0}.cfill{height:100%;border-radius:1px;background:var(--teal)}

/* detail grid for nakshatra attributes */
.dtl{display:grid;grid-template-columns:1fr 1fr;gap:1px 12px;margin:4px 0}
.dtl-row{font-size:10px;color:var(--text);margin-bottom:2px}
.dtl-row .lbl{color:var(--dim);margin-right:4px}

.sep{height:1px;background:var(--border);margin:8px 0}

/* bottom note */
.bnote{background:var(--panel);border-top:1px solid var(--border);padding:8px 20px;text-align:center;font-size:9px;color:var(--dim);font-style:italic;line-height:1.4}

/* footer */
.footer{grid-column:1/-1;background:var(--panel);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:center;gap:12px;font-size:10px;color:var(--dim)}
.footer .nak{font-family:var(--font-body);color:var(--gold);font-size:12px}

/* nav dots */
.nav{position:fixed;right:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px}
.nav a{width:8px;height:8px;border-radius:50%;border:1px solid var(--border);display:block;text-decoration:none}.nav a.on{background:var(--text);border-color:var(--text)}.nav a:hover{border-color:var(--gold)}
</style>
</head>
<body>

<div class="top" id="top">◌</div>
<div class="main">
  <div class="pan" id="left">◌</div>
  <div class="pan" id="right">◌</div>
</div>
<div class="bnote">Bhakti practices (harināma, smaraṇa, kīrtana) are always auspicious regardless of nāḍī state.</div>
<div class="footer">
  <span id="fn" class="nak">—</span>
  <span id="ft">—</span>
  <span id="fv">—</span>
  <span id="fd">—</span>
  <span style="width:6px;height:6px;border-radius:50%;background:var(--teal)"></span>
</div>
<nav class="nav">
  <a href="/s0"></a><a href="/s1"></a><a href="/s2"></a>
  <a href="/s3" class="on"></a>
  <a href="/s4"></a><a href="/s5"></a><a href="/s6"></a>
</nav>

<script>
const _bhakti=/harinama|japa|smarana|kirtan|remembrance.*supreme|chanting|nama_sankirtana/i;

function s(v){return v||'—'}
function fmt(v){return typeof v==='string'?v.replace(/_/g,' '):v}
function arr(v){return Array.isArray(v)?v:v?[v]:[]}

async function load(){
  const [f,sv,din,tr,compose,chandas] = await Promise.all([
    atlasGet('/field',{}),
    atlasGet('/svarodaya',{}),
    atlasGet('/dinacharya',{}),
    atlasGet('/trajectory',{}),
    atlasGet('/layer/s3/compose',{}),
    atlasGet('/chandas',{})
  ]);

  const pa = f?.panchanga||{};
  const nd = pa.nak_data||{};
  const raw = compose?.raw_data||{};
  const nk_canon = raw.nakshatra_canonical||{};
  const tithi_m = raw.tithi_master||{};
  const tithi_d = raw.tithi_deities||{};
  const deity_attr = raw.deity_attributes||{};
  const graha_av = raw.graha_avatar_bphs||{};
  const nak_padas = raw.nakshatra_padas||{};
  const nak_body = raw.nakshatra_body_map||{};

  // --- TOP BAR ---
  const nakName = pa.nakshatra||nd.nakshatra||nk_canon.name||'—';
  document.getElementById('top').innerHTML =
    `<div class="nak-name">${nakName}</div>`+
    `<div class="nak-sub">${s(pa.tithi)} · ${s(pa.paksha)} · ${s(pa.vara)} · ${s(nd.element||pa.element)} · ${s(nd.guna||pa.guna)}</div>`;

  // --- FOOTER ---
  document.getElementById('fn').textContent = nakName;
  document.getElementById('ft').textContent = s(pa.tithi);
  document.getElementById('fv').textContent = s(pa.vara);
  document.getElementById('fd').textContent = typeof pa.devi==='object'?(pa.devi?.name||'—'):(pa.devi||'—');

  // --- LEFT: NAKSHATRA PROFILE ---
  let L = '<div class="hdr">NAKSHATRA PROFILE</div>';

  // deity, symbol, shakti
  const nDeity = nd.deity||nk_canon.deity||'—';
  const nSymbol = nd.symbol||nk_canon.symbol||'—';
  const nShakti = nd.shakti||nk_canon.shakti||'—';
  L += `<div class="val-sm">${nDeity}</div>`;
  L += `<div class="sub">${nSymbol}</div>`;
  L += `<div class="sub" style="color:var(--teal)">${nShakti}</div>`;

  // yoni, gana, nadi
  L += '<div class="sep"></div>';
  const nYoni = nd.yoni||nk_canon.yoni||'';
  const nGana = nd.gana||nk_canon.gana||'';
  const nNadi = nk_canon.nadi||'';
  if(nYoni||nGana||nNadi){
    L += `<div class="sub">${[nYoni?'yoni: '+nYoni:'',nGana?'gaṇa: '+nGana:'',nNadi?'nāḍī: '+nNadi:''].filter(Boolean).join(' · ')}</div>`;
  }

  // dosha, direction, gemstone, tree, plant — 2-col grid
  const attrs = [];
  const nDosha = nd.dosha||nk_canon.dosha||'';
  const nDir = nk_canon.direction||'';
  const nGem = nk_canon.gemstone||'';
  const nTree = nk_canon.tree||'';
  const nPlant = nk_canon.plant||'';
  if(nDosha) attrs.push(['doṣa',nDosha]);
  if(nDir) attrs.push(['direction',nDir]);
  if(nGem) attrs.push(['gem',nGem]);
  if(nTree) attrs.push(['tree',nTree]);
  if(nPlant) attrs.push(['plant',nPlant]);

  if(attrs.length){
    L += '<div class="dtl">';
    attrs.forEach(([lbl,val])=>{
      L += `<div class="dtl-row"><span class="lbl">${lbl}:</span>${val}</div>`;
    });
    L += '</div>';
  }

  // themes
  const themes = nd.themes||nk_canon.themes||'';
  if(themes){
    const thArr = Array.isArray(themes)?themes:[themes];
    L += `<div class="themes">${thArr.join(' · ')}</div>`;
  }

  // qualities
  const quals = nd.qualities||nk_canon.qualities||'';
  if(quals){
    const qArr = Array.isArray(quals)?quals:[quals];
    L += `<div class="dim">${qArr.join(', ')}</div>`;
  }

  // body region
  const bodyRegion = nak_body[nakName]||nak_body[nakName.toLowerCase()]||'';
  if(bodyRegion){
    L += '<div class="sep"></div>';
    L += `<div class="hdr">BODY REGION</div>`;
    L += `<div class="sub">${bodyRegion}</div>`;
  }

  // nakshatra deity from deity_attributes
  const deityKey = nDeity.toLowerCase().replace(/\s+/g,'_');
  const da = deity_attr[deityKey]||deity_attr[nDeity]||null;
  if(da){
    L += '<div class="sep"></div>';
    L += '<div class="hdr">NAKSHATRA DEITY</div>';
    L += `<div class="val-sm">${nDeity}</div>`;
    const daFields = [];
    if(da.weapons) daFields.push(['weapons',arr(da.weapons).join(', ')]);
    if(da.vahana) daFields.push(['vāhana',da.vahana]);
    if(da.mudra) daFields.push(['mudrā',da.mudra]);
    if(da.color) daFields.push(['color',da.color]);
    if(da.bija) daFields.push(['bīja',da.bija]);
    if(da.shakti) daFields.push(['śakti',da.shakti]);
    if(daFields.length){
      L += '<div class="dtl">';
      daFields.forEach(([lbl,val])=>{
        L += `<div class="dtl-row"><span class="lbl">${lbl}:</span>${val}</div>`;
      });
      L += '</div>';
    }
  }

  document.getElementById('left').innerHTML = L;

  // --- RIGHT: TIME STATE ---
  let R = '';

  // SVARODAYA
  R += '<div class="hdr">SVARODAYA</div>';
  if(sv?.optimal_nadi){
    R += `<div class="val">${sv.optimal_nadi}</div>`;
    R += `<div class="sub">${s(sv.nadi_side)} · ${s(sv.nadi_graha)}</div>`;
    if(sv.nadi_quality) R += `<div class="dim">${sv.nadi_quality}</div>`;

    // element of breath
    R += `<div class="sub" style="margin-top:4px">${s(sv.element_of_breath)}</div>`;
    if(sv.element_sensation) R += `<div class="dim">${sv.element_sensation}</div>`;

    // coherence bar
    if(sv.coherence_score!=null){
      R += `<div class="cbar"><div class="cfill" style="width:${sv.coherence_score*100}%"></div></div>`;
      R += `<div class="dim">${(sv.coherence_score*100).toFixed(0)}% coherence</div>`;
    }

    // recommended — bhedabheda filtered
    const rec = arr(sv.recommended_activities);
    if(rec.length){
      R += '<div class="hdr">RECOMMENDED</div>';
      rec.forEach(a=>R+=`<div class="act">${fmt(a)}</div>`);
    }

    // avoid — filter out bhakti
    const avd = arr(sv.avoid_activities).filter(a=>!_bhakti.test(a));
    if(avd.length){
      R += '<div class="hdr">AVOID (material)</div>';
      avd.forEach(a=>R+=`<div class="avoid">${fmt(a)}</div>`);
    }
  } else {
    R += '<div class="dim">engine offline</div>';
  }

  R += '<div class="sep"></div>';

  // DINACHARYA
  R += '<div class="hdr">DINACHARYA</div>';
  if(din?.ashtakala_period){
    R += `<div class="val-sm">${din.ashtakala_period}</div>`;
    if(din.primary_activity) R += `<div class="sub">${fmt(din.primary_activity)}</div>`;

    if(din.dietary_guidance){
      R += '<div class="hdr">DIETARY</div>';
      R += `<div class="sub">${din.dietary_guidance}</div>`;
    }

    if(din.recommended_herbs?.length){
      R += '<div class="hdr">HERBS</div>';
      din.recommended_herbs.forEach(h=>R+=`<div class="act">${h}</div>`);
    }

    if(din.recommended_practices?.length){
      R += '<div class="hdr">PRACTICES</div>';
      din.recommended_practices.slice(0,6).forEach(p=>R+=`<div class="act">${fmt(p)}</div>`);
    }

    if(din.avoid?.length){
      const davd = din.avoid.filter(a=>!_bhakti.test(a));
      if(davd.length){
        R += '<div class="hdr">AVOID</div>';
        davd.slice(0,4).forEach(a=>R+=`<div class="avoid">${fmt(a)}</div>`);
      }
    }

    if(din.mantra) R += `<div class="dim" style="margin-top:4px">mantra: ${din.mantra}</div>`;
    if(din.raga) R += `<div class="dim">rāga: ${din.raga}</div>`;
    if(din.forest) R += `<div class="dim" style="font-style:italic">${din.forest}</div>`;
  } else {
    R += '<div class="dim">engine offline</div>';
  }

  R += '<div class="sep"></div>';

  // TITHI
  R += '<div class="hdr">TITHI</div>';
  const tName = pa.tithi||'—';
  const tDeity = tithi_m.deity||tithi_d?.deity||'';
  const tQuality = tithi_m.quality||'';
  R += `<div class="sub">${tName}</div>`;
  if(tDeity) R += `<div class="dim">deity: ${tDeity}</div>`;
  if(tQuality) R += `<div class="dim">quality: ${tQuality}</div>`;

  R += '<div class="sep"></div>';

  // TRAJECTORY
  if(tr?.now){
    R += '<div class="hdr">TRAJECTORY</div>';
    R += `<div class="sub">${tr.now}</div>`;
    if(tr.moving_toward) R += `<div class="dim">→ ${tr.moving_toward}</div>`;
    R += '<div class="sep"></div>';
  }

  // CHANDAS
  if(chandas?.active){
    R += '<div class="hdr">CHANDAS</div>';
    R += `<div class="sub">${chandas.active}</div>`;
  } else if(chandas?.metre||chandas?.name){
    R += '<div class="hdr">CHANDAS</div>';
    R += `<div class="sub">${chandas.metre||chandas.name||'—'}</div>`;
  }

  document.getElementById('right').innerHTML = R;
}

load(); setInterval(load, 60000);
</script>
</body>
</html>
