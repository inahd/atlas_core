<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S4 · Toroidal Field Yantra</title>
<link rel="stylesheet" href="/static/atlas-theme.css">
<script src="/static/atlas.js"></script>
<style>
:root{--bg:#02030a;--panel:#070d14;--purple:#8070dd;--text:#d8e8f0;--dim:#3a5060}

html, body {
  width: 100%; height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'Courier New', monospace;
  overflow: hidden;
}

#app {
  display: grid;
  grid-template-rows: 38px 1fr 28px;
  height: 100vh;
}

/* HEADER */
#header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  border-bottom: 1px solid var(--border);
  background: var(--panel);
}
#header-left { display: flex; align-items: center; gap: 12px; }
#s4-badge {
  font-size: 9px; color: var(--gold);
  border: 1px solid var(--gold); padding: 1px 6px;
  letter-spacing: 0.14em; opacity: 0.85;
}
#title { font-size: 11px; color: var(--muted); letter-spacing: 0.06em; }
#header-right { display: flex; align-items: center; gap: 10px; }

.hbtn {
  background: none; border: 1px solid var(--dim); color: var(--muted);
  font-family: 'Courier New', monospace; font-size: 9px;
  padding: 2px 9px; cursor: pointer; letter-spacing: 0.08em;
  transition: border-color 0.15s, color 0.15s;
}
.hbtn:hover, .hbtn.active { border-color: var(--gold); color: var(--gold); }
#live-badge { font-size: 9px; padding: 1px 7px; border-radius: 1px; letter-spacing: 0.1em; }
#live-badge.live   { color: var(--teal); border: 1px solid var(--teal); }
#live-badge.offline{ color: var(--dim);  border: 1px solid var(--dim); }

/* MAIN */
#main {
  display: grid;
  grid-template-columns: 1fr 180px;
  overflow: hidden;
}
#canvas-wrap {
  position: relative;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
canvas { display: block; }

/* mode toggle overlay */
#mode-toggle {
  position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 6px;
}
.mtbtn {
  background: rgba(7,13,20,0.85); border: 1px solid var(--dim);
  color: var(--muted); font-family: 'Courier New', monospace;
  font-size: 9px; padding: 3px 10px; cursor: pointer;
  letter-spacing: 0.1em; transition: all 0.2s;
}
.mtbtn:hover, .mtbtn.active { border-color: var(--gold); color: var(--gold); }

/* SIDEBAR */
#sidebar {
  background: var(--panel);
  border-left: 1px solid var(--border);
  padding: 12px 10px;
  overflow-y: auto;
  display: flex; flex-direction: column; gap: 12px;
  font-size: 9px;
}
.sb-lbl {
  font-size: 8px; color: var(--gold); letter-spacing: 0.14em;
  text-transform: uppercase; opacity: 0.7; margin-bottom: 4px;
}
.sb-val { font-size: 12px; color: var(--text); line-height: 1.4; }
.sb-sub { font-size: 9px; color: var(--muted); margin-top: 1px; }
.sb-div { border: none; border-top: 1px solid var(--border); }

.param-row { display: flex; justify-content: space-between; margin: 2px 0; }
.pname { color: var(--muted); }
.pval  { color: var(--teal-lt); }

.avar-row {
  display: flex; align-items: baseline; gap: 5px;
  margin: 1px 0; padding: 2px 4px; border-radius: 1px;
  transition: background 0.3s;
}
.avar-row.active { background: rgba(224,176,64,0.08); }
.avar-n { color: var(--gold); font-size: 8px; min-width: 14px; }
.avar-name { color: var(--text); font-size: 9px; }
.avar-deity { color: var(--muted); font-size: 8px; }

.petal-row {
  display: flex; align-items: baseline; gap: 5px;
  margin: 1px 0; font-size: 9px;
}
.petal-bija { color: var(--teal); min-width: 18px; font-size: 11px; }
.petal-name { color: var(--muted); }

/* FOOTER */
#footer {
  padding: 0 16px;
  border-top: 1px solid var(--border);
  background: var(--panel);
  display: flex; align-items: center; justify-content: space-between;
}
#equation { font-size: 8px; color: var(--dim); letter-spacing: 0.03em; }
#alpha-bar-wrap { display: flex; align-items: center; gap: 6px; }
#alpha-bar {
  width: 100px; height: 2px;
  background: linear-gradient(to right, var(--purple), var(--teal), var(--amber));
  position: relative; border-radius: 1px;
}
#alpha-cursor {
  position: absolute; top: -3px;
  width: 2px; height: 8px;
  background: var(--gold); border-radius: 1px;
  transition: left 1.2s ease;
}
#alpha-val { font-size: 9px; color: var(--gold); }
</style>
</head>
<body>
<div id="app">

  <div id="header">
    <div id="header-left">
      <div id="s4-badge">S4</div>
      <div id="title">toroidal field yantra</div>
    </div>
    <div id="header-right">
      <div id="live-badge" class="offline">OFFLINE</div>
      <button class="hbtn" onclick="fetchField()">↺</button>
    </div>
  </div>

  <div id="main">
    <div id="canvas-wrap">
      <canvas id="c"></canvas>
      <div id="mode-toggle">
        <button class="mtbtn active" id="btn-2d" onclick="setMode('2d')">YANTRA</button>
        <button class="mtbtn" id="btn-3d" onclick="setMode('3d')">TOROID</button>
        <button class="mtbtn" id="btn-bloom" onclick="setMode('bloom')">BLOOM</button>
        <button class="mtbtn" id="btn-aligned" onclick="setMode('aligned')">ALIGNED</button>
        <button class="mtbtn" id="btn-merkaba" onclick="setMode('merkaba')">MERKABA</button>
        <button class="mtbtn" id="btn-both" onclick="setMode('both')">FUSED</button>
      </div>
    </div>

    <div id="sidebar">
      <div>
        <div class="sb-lbl">field</div>
        <div class="sb-val" id="sb-nak">—</div>
        <div class="sb-sub" id="sb-tithi">—</div>
        <div class="sb-sub" id="sb-devi" style="color:var(--teal)">—</div>
      </div>

      <hr class="sb-div">

      <div>
        <div class="sb-lbl">9 āvaraṇas</div>
        <div id="avar-list"></div>
      </div>

      <hr class="sb-div">

      <div>
        <div class="sb-lbl">8 petals · Nitya Devī</div>
        <div id="petal-list"></div>
      </div>

      <hr class="sb-div">

      <div>
        <div class="sb-lbl">field params</div>
        <div class="param-row"><span class="pname">symmetry</span><span class="pval" id="p-n">6</span></div>
        <div class="param-row"><span class="pname">intensity</span><span class="pval" id="p-int">—</span></div>
        <div class="param-row"><span class="pname">phase</span><span class="pval" id="p-drift">—</span></div>
        <div class="param-row"><span class="pname">α kali</span><span class="pval" id="p-alpha">—</span></div>
      </div>

      <hr class="sb-div">

      <div>
        <div class="sb-lbl">bloom · 15 toroids</div>
        <div class="sb-val" id="sb-bloom" style="font-size:10px">—</div>
      </div>

      <hr class="sb-div">

      <div>
        <div class="sb-lbl">triguṇa strands</div>
        <div class="param-row"><span style="color:#e0b040">●</span><span class="pname" style="margin-left:4px" id="tA">sattva</span></div>
        <div class="param-row"><span style="color:#20a88a">●</span><span class="pname" style="margin-left:4px" id="tB">rajas</span></div>
        <div class="param-row"><span style="color:#8070dd">●</span><span class="pname" style="margin-left:4px" id="tC">tamas</span></div>
      </div>
    </div>
  </div>

  <div id="footer">
    <div id="equation">Φ=egg(ρ,z)·yuga(z)·Σⱼ[cos(nθ+kⱼz−ωz+2πj/3)+α·cos(nθ+kⱼz+ωz+2πj/3+δ)]</div>
    <div id="alpha-bar-wrap">
      <span style="font-size:9px;color:var(--muted)">α</span>
      <div id="alpha-bar"><div id="alpha-cursor"></div></div>
      <span id="alpha-val">—</span>
    </div>
    <div style="display:flex;align-items:center;gap:6px;margin-top:4px">
      <span style="font-size:9px;color:var(--muted)">tithi</span>
      <input type="range" id="tithi-slider" min="1" max="30" value="7" style="flex:1;height:3px;accent-color:var(--gold)">
      <span id="tithi-slider-val" style="font-size:9px;color:var(--gold);min-width:18px">7</span>
    </div>
    <div style="display:flex;align-items:center;gap:6px;margin-top:4px">
      <span style="font-size:9px;color:var(--muted)">k =</span>
      <input type="range" id="k-slider" min="2" max="12" step="0.1" value="5.5" style="flex:1;height:3px;accent-color:var(--teal)">
      <span id="k-slider-val" style="font-size:9px;color:var(--teal);min-width:24px">5.5</span>
      <span id="align-score" style="font-size:9px;color:var(--gold);min-width:60px"></span>
    </div>
    <div style="display:flex;align-items:center;gap:6px;margin-top:4px">
      <span style="font-size:9px;color:var(--muted)">k<sub>S</sub>=</span>
      <input type="range" id="ks-slider" min="2" max="12" step="0.1" value="3.8" style="flex:1;height:3px;accent-color:var(--gold)">
      <span id="ks-slider-val" style="font-size:9px;color:var(--gold);min-width:24px">3.8</span>
    </div>
  </div>

</div>
<script>
// ═══════════════════════════════════════════════════════════
// S4 · Toroidal Field Yantra
// 2D: complete Sri Yantra + triadic wreath + lotus
// 3D: three-toroid Sṛṣṭi/Sthiti/Saṃhāra engine
// FUSED: both layers simultaneously
// ═══════════════════════════════════════════════════════════

// ── CONSTANTS ─────────────────────────────────────────────
const TAU = Math.PI * 2;
const GOLD   = '#e0b040';
const TEAL   = '#20a88a';
const PURPLE = '#8070dd';
const AMBER  = '#c87820';
const RED    = '#c84040';

function clr(hex, a) {
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

// ── 9 ĀVARAṆAS ────────────────────────────────────────────
const AVARANAS = [
  { n:1, name:'Bhūpura',      deity:'Aṣṭa-Mātṛkā',    color:GOLD,   radFrac:1.00, triangles:0 },
  { n:2, name:'Ṣoḍaśadala',   deity:'16 Śaktis',       color:TEAL,   radFrac:0.88, triangles:0 },
  { n:3, name:'Aṣṭadala',     deity:'Nitya Devī',      color:GOLD,   radFrac:0.76, triangles:0 },
  { n:4, name:'Caturdaśāra',  deity:'14 Śaktis',       color:PURPLE, radFrac:0.64, triangles:14 },
  { n:5, name:'Bahirdaśāra',  deity:'10 outer Śaktis', color:TEAL,   radFrac:0.52, triangles:10 },
  { n:6, name:'Antardaśāra',  deity:'10 inner Śaktis', color:AMBER,  radFrac:0.42, triangles:10 },
  { n:7, name:'Aṣṭāra',       deity:'8 Śaktis',        color:GOLD,   radFrac:0.32, triangles:8  },
  { n:8, name:'Trikoṇa',      deity:'Tripura Sundarī', color:RED,    radFrac:0.22, triangles:3  },
  { n:9, name:'Bindu',        deity:'Kāmeśvarī',       color:GOLD,   radFrac:0.06, triangles:0  },
];

// ── NITYA DEVĪ (8 petals = 8 selected from 15) ────────────
const NITYA_DEVI = [
  { bija:'क्लीं', name:'Kāmeśvarī',    color:'#e0b040' },
  { bija:'ह्रीं', name:'Bhagamālinī',  color:'#20a88a' },
  { bija:'नित्यं',name:'Nityaklinā',   color:'#8070dd' },
  { bija:'भैं',   name:'Bheruṇḍā',    color:'#c87820' },
  { bija:'वह्नि', name:'Vahnivasini',  color:'#c84040' },
  { bija:'वज्रे', name:'Mahāvajreśvari',color:'#e0b040'},
  { bija:'शि',    name:'Śivadūtī',    color:'#20a88a' },
  { bija:'त्वे',  name:'Tvaritā',     color:'#8070dd' },
];

// ── 16 OUTER PETAL ŚAKTIS ─────────────────────────────────
const OUTER_PETALS = [
  'Kāmakarṣiṇī','Buddhyākarṣiṇī','Ahaṃkārākarṣiṇī','Śabdākarṣiṇī',
  'Sparśākarṣiṇī','Rūpākarṣiṇī','Rasākarṣiṇī','Gandhākarṣiṇī',
  'Cittākarṣiṇī','Dhairyākarṣiṇī','Smṛtyākarṣiṇī','Nāmākarṣiṇī',
  'Bījakarṣiṇī','Ātmākarṣiṇī','Amṛtākarṣiṇī','Śarīrākarṣiṇī',
];

// ── STATE ──────────────────────────────────────────────────
const state = {
  nakshatra:'Pūrvāṣāḍhā', nakshatra_num:20,
  tithi:7, tithi_name:'Saptamī',
  devi:'Śivadūtī',
  alpha:0.15, intensity:0.7,
  phase_drift:0, n_symmetry:6,
  online:false, t:0,
  mode:'2d',          // '2d' | '3d' | 'both'
  // 3d camera
  rotX:0.38, rotY:0, autoRot:true,
  lastMX:0, lastMY:0, dragging:false,
};

function deriveFromNakshatra(num) {
  state.phase_drift = (num/27)*TAU;
  state.n_symmetry = [6,9,12][Math.floor((num-1)/9)] || 6;
}
function deriveIntensity(tithi) {
  return 0.35 + (1 - Math.abs(tithi-15)/15) * 0.65;
}

// ── CANVAS SETUP ──────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  const wrap = document.getElementById('canvas-wrap');
  W = wrap.clientWidth;
  H = wrap.clientHeight;
  canvas.width  = W;
  canvas.height = H;
}

// ── 3D MATH ───────────────────────────────────────────────
function rotX3(x,y,z,a){ return [x, y*Math.cos(a)-z*Math.sin(a), y*Math.sin(a)+z*Math.cos(a)]; }
function rotY3(x,y,z,a){ return [x*Math.cos(a)+z*Math.sin(a), y, -x*Math.sin(a)+z*Math.cos(a)]; }

function project3(x,y,z) {
  const S = Math.min(W,H)*0.38;
  const fov = 2.6;
  const dz = fov + z;
  return [W/2 + (x*S*fov)/dz, H/2 + (y*S*fov)/dz, fov/dz];
}
function cam3(x,y,z) {
  let p = rotX3(x,y,z, state.rotX);
  p = rotY3(p[0],p[1],p[2], state.rotY);
  return project3(p[0],p[1],p[2]);
}

// toroid surface point
function toroidPt(theta,phi,R,r,offset) {
  const t = theta+offset;
  return [
    (R+r*Math.cos(phi))*Math.cos(t),
    (R+r*Math.cos(phi))*Math.sin(t),
    r*Math.sin(phi)
  ];
}

// ── DRAW 2D YANTRA ────────────────────────────────────────
function draw2D(opacity=1.0) {
  const cx=W/2, cy=H/2;
  const R = Math.min(W,H)*0.42;
  const t = state.t;
  const alpha = state.alpha;
  const intensity = state.intensity;
  const n = state.n_symmetry;
  const drift = state.phase_drift;

  ctx.save();
  ctx.globalAlpha = opacity;

  // bg pulse
  const bg = ctx.createRadialGradient(cx,cy,0,cx,cy,R*1.2);
  bg.addColorStop(0, `rgba(20,10,50,${0.12+intensity*0.08})`);
  bg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

  // ── MOIRÉ RINGS ──────────────────────────────────────────
  for(let ring=1;ring<=12;ring++){
    const rr=R*0.072*ring;
    const fade=Math.max(0.06,0.45-ring*0.03)*intensity;
    ctx.beginPath();
    for(let i=0;i<=240;i++){
      const a=TAU*i/240;
      const pert=1+0.065*Math.cos(n*a+drift+t*0.3)+0.04*Math.cos(n*a*1.5+drift*1.2-t*0.2)+alpha*0.03*Math.cos(n*a*2+t*0.15);
      const px=cx+rr*pert*Math.cos(a), py=cy+rr*pert*Math.sin(a);
      i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
    }
    ctx.closePath();
    ctx.strokeStyle=`rgba(90,80,150,${fade})`; ctx.lineWidth=0.5; ctx.stroke();
  }

  // ── BHŪPURA (square outer boundary) ─────────────────────
  const sq = R*1.05;
  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(drift*0.1);
  // outer square
  ctx.strokeStyle=clr(GOLD,0.25); ctx.lineWidth=1.2;
  ctx.strokeRect(-sq,-sq,sq*2,sq*2);
  // inner square (slightly smaller)
  ctx.strokeStyle=clr(GOLD,0.15); ctx.lineWidth=0.6;
  ctx.strokeRect(-sq*0.92,-sq*0.92,sq*0.92*2,sq*0.92*2);
  // 4 gates (T-shapes at cardinal points)
  const gSize=sq*0.12;
  [[0,-sq],[sq,0],[0,sq],[-sq,0]].forEach(([gx,gy])=>{
    ctx.strokeStyle=clr(GOLD,0.3); ctx.lineWidth=0.8;
    ctx.beginPath();
    if(gy<0){ctx.moveTo(-gSize,gy);ctx.lineTo(gSize,gy);ctx.moveTo(0,gy);ctx.lineTo(0,gy+gSize);}
    else if(gy>0){ctx.moveTo(-gSize,gy);ctx.lineTo(gSize,gy);ctx.moveTo(0,gy);ctx.lineTo(0,gy-gSize);}
    else if(gx>0){ctx.moveTo(gx,-gSize);ctx.lineTo(gx,gSize);ctx.moveTo(gx,0);ctx.lineTo(gx-gSize,0);}
    else{ctx.moveTo(gx,-gSize);ctx.lineTo(gx,gSize);ctx.moveTo(gx,0);ctx.lineTo(gx+gSize,0);}
    ctx.stroke();
  });
  ctx.restore();

  // ── TRIADIC WREATH ────────────────────────────────────────
  const wreathR=R*0.82, wreathAmp=R*0.058;
  const strandCols=[GOLD,TEAL,PURPLE];
  ['A','B','C'].forEach((lbl,si)=>{
    const phOff=si*TAU/3;
    const phi=Math.round((si*120+(drift*180/Math.PI))%360);
    document.getElementById('t'+lbl).textContent=`${['sattva','rajas','tamas'][si]} · φ=${phi}°`;
    ctx.beginPath();
    for(let k=0;k<=360;k++){
      const theta=k/360*TAU;
      const weave=wreathAmp*Math.sin(3*theta+phOff+t*0.6);
      const r=wreathR+weave;
      const cross=wreathAmp*0.35*Math.cos(3*theta+phOff+t*0.6);
      const px=cx+r*Math.cos(theta+drift)+cross*Math.cos(theta+drift+Math.PI/2);
      const py=cy+r*Math.sin(theta+drift)+cross*Math.sin(theta+drift+Math.PI/2);
      k===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
    }
    ctx.closePath();
    ctx.strokeStyle=clr(strandCols[si],0.65*intensity); ctx.lineWidth=1.8; ctx.stroke();
  });

  // ── 16 OUTER PETALS ──────────────────────────────────────
  const outerPetalR = R*0.82;
  for(let p=0;p<16;p++){
    const ang=p*TAU/16+drift+t*0.006;
    const px=cx+outerPetalR*Math.cos(ang), py=cy+outerPetalR*Math.sin(ang);
    ctx.beginPath();
    for(let pt=0;pt<=50;pt++){
      const ta=pt/50*Math.PI;
      const lx2=R*0.14*Math.cos(ta);
      const ly2=R*0.14*0.22*Math.sin(ta);
      const lxr=lx2*Math.cos(ang)-ly2*Math.sin(ang);
      const lyr=lx2*Math.sin(ang)+ly2*Math.cos(ang);
      pt===0?ctx.moveTo(px+lxr,py+lyr):ctx.lineTo(px+lxr,py+lyr);
    }
    const isActive = Math.round((state.tithi-1)/2)%16===p;
    ctx.strokeStyle=clr(TEAL, isActive?0.55:0.18); ctx.lineWidth=isActive?1.0:0.5; ctx.stroke();
    // tiny label
    const lx=cx+(outerPetalR+R*0.06)*Math.cos(ang);
    const ly=cy+(outerPetalR+R*0.06)*Math.sin(ang);
    ctx.font=`${W*0.008}px Courier New`;
    ctx.fillStyle=clr(TEAL,0.3);
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText((p+1).toString(),lx,ly);
  }

  // ── 8 INNER PETALS with Nitya Devī ───────────────────────
  const innerPetalR = R*0.52;
  NITYA_DEVI.forEach((d,p)=>{
    const ang=p*TAU/8+drift+t*0.012;
    const px=cx+innerPetalR*Math.cos(ang), py=cy+innerPetalR*Math.sin(ang);
    const isActive = d.name===state.devi;
    ctx.beginPath();
    for(let pt=0;pt<=60;pt++){
      const ta=pt/60*Math.PI;
      const lx2=R*0.22*Math.cos(ta);
      const ly2=R*0.22*0.3*Math.sin(ta);
      const lxr=lx2*Math.cos(ang)-ly2*Math.sin(ang);
      const lyr=lx2*Math.sin(ang)+ly2*Math.cos(ang);
      pt===0?ctx.moveTo(px+lxr,py+lyr):ctx.lineTo(px+lxr,py+lyr);
    }
    const r_c=parseInt(d.color.slice(1,3),16);
    const g_c=parseInt(d.color.slice(3,5),16);
    const b_c=parseInt(d.color.slice(5,7),16);
    const fade = isActive?0.75:0.28;
    ctx.strokeStyle=`rgba(${r_c},${g_c},${b_c},${fade*intensity})`;
    ctx.lineWidth=isActive?1.4:0.6; ctx.stroke();
    if(isActive){
      ctx.fillStyle=`rgba(${r_c},${g_c},${b_c},0.06)`;
      ctx.fill();
    }
    // bija at petal tip
    const tipR = innerPetalR + R*0.14;
    const tx=cx+tipR*Math.cos(ang), ty=cy+tipR*Math.sin(ang);
    ctx.font=`${W*(isActive?0.022:0.014)}px Georgia`;
    ctx.fillStyle=`rgba(${r_c},${g_c},${b_c},${isActive?0.9:0.4})`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(d.bija,tx,ty);
  });


  // ── 27 NAKSHATRA SPOKES ──────────────────────────────────
  for(let k=0;k<27;k++){
    const ang=k*TAU/27+drift;
    const fade=0.3+0.5*Math.pow(Math.sin(ang*3+drift),2);
    const spoke_r=R*(0.86+0.14*fade);
    ctx.beginPath();
    ctx.moveTo(cx+R*0.12*Math.cos(ang), cy+R*0.12*Math.sin(ang));
    ctx.lineTo(cx+spoke_r*Math.cos(ang), cy+spoke_r*Math.sin(ang));
    const r_c=Math.round(0xE0*fade+0x20*(1-fade));
    const g_c=Math.round(0xB0*fade+0xA8*(1-fade));
    const b_c=Math.round(0x40*fade+0x8A*(1-fade));
    ctx.strokeStyle=`rgba(${r_c},${g_c},${b_c},${0.2*intensity})`;
    ctx.lineWidth=0.4; ctx.stroke();
    // pada ticks
    for(let p=1;p<=4;p++){
      const pr=R*(0.12+(p/4)*0.68);
      const ppx=cx+pr*Math.cos(ang), ppy=cy+pr*Math.sin(ang);
      const perp=ang+Math.PI/2;
      ctx.beginPath();
      ctx.moveTo(ppx+3*Math.cos(perp), ppy+3*Math.sin(perp));
      ctx.lineTo(ppx-3*Math.cos(perp), ppy-3*Math.sin(perp));
      ctx.strokeStyle=`rgba(80,100,120,${0.15*intensity})`; ctx.lineWidth=0.3; ctx.stroke();
    }
  }

  // active nakshatra highlight
  const nakAng = (state.nakshatra_num-1)*TAU/27 + drift;
  ctx.beginPath();
  ctx.moveTo(cx+R*0.12*Math.cos(nakAng), cy+R*0.12*Math.sin(nakAng));
  ctx.lineTo(cx+R*0.98*Math.cos(nakAng), cy+R*0.98*Math.sin(nakAng));
  ctx.strokeStyle=clr(GOLD,0.6); ctx.lineWidth=1.2; ctx.stroke();

  // ── INTERFERENCE NODES ───────────────────────────────────
  const nc=Math.round(n/2)*2;
  [R*0.92, R*0.58].forEach((nr,li)=>{
    for(let i=0;i<nc;i++){
      const ang=i*TAU/nc+(li===0?1:-1)*t*0.04+drift*0.15;
      const nx=cx+nr*Math.cos(ang), ny=cy+nr*Math.sin(ang);
      const pulse=0.6+0.4*Math.sin(t*1.8+i*TAU/nc);
      const sz=W*(li===0?0.011:0.007)*pulse;
      ctx.beginPath(); ctx.arc(nx,ny,sz,0,TAU);
      ctx.fillStyle=clr(GOLD,(li===0?0.5:0.3)*intensity*pulse); ctx.fill();
      ctx.strokeStyle=clr(GOLD,0.7); ctx.lineWidth=0.5; ctx.stroke();
    }
  });

  // ── TITHI → ĀVARAṆA ACTIVATION ───────────────────────────
  // Waxing (1-15): energy moves outward bindu→bhūpura
  // Waning (16-30): energy returns inward bhūpura→bindu
  // Pūrṇimā (15): all circuits simultaneously lit
  // Amāvasyā (30): only bindu survives

  const tithi = state.tithi;
  const isPurnima = tithi===15;
  const isAmavasya = tithi===30||tithi===0;
  const isWaxing = tithi<=15;
  const avPulse = 0.7+0.3*Math.sin(t*1.8);

  function tithiToAvarana(tt) {
    if(tt===15) return -1;
    if(tt===30||tt===0) return 8;
    const wt = tt<=15 ? tt : 30-tt;
    if(wt<=2)  return 8;
    if(wt<=5)  return 6;
    if(wt<=8)  return 5;
    if(wt<=11) return 4;
    if(wt<=13) return 3;
    if(wt===14) return 1;
    return 8;
  }
  const activeAv = tithiToAvarana(tithi);

  // ── SRI YANTRA — 9 interlocked triangles ─────────────────
  // Each triangle mapped to its avarana — lights up with active tithi circuit
  const triData = [
    {up:false,sc:0.70,rot:0,           col:TEAL,av:4},
    {up:false,sc:0.54,rot:0.08,        col:TEAL,av:5},
    {up:false,sc:0.41,rot:0.05,        col:TEAL,av:5},
    {up:false,sc:0.29,rot:0.03,        col:TEAL,av:6},
    {up:false,sc:0.18,rot:0,           col:TEAL,av:8},
    {up:true, sc:0.62,rot:Math.PI,     col:GOLD,av:4},
    {up:true, sc:0.47,rot:Math.PI+0.06,col:GOLD,av:5},
    {up:true, sc:0.35,rot:Math.PI+0.04,col:GOLD,av:6},
    {up:true, sc:0.23,rot:Math.PI+0.02,col:GOLD,av:8},
  ];
  const triBase = R*0.70;
  triData.forEach(({up,sc,rot,col,av})=>{
    const isAct = isPurnima||(activeAv===av)||(isAmavasya&&av===8);
    const isNear = !isPurnima&&Math.abs(activeAv-av)<=1;
    const op = isAct?(0.72+0.22*avPulse):isNear?0.26:0.10;
    const lw = isAct?1.2:isNear?0.55:0.3;
    const tr = triBase*sc;
    ctx.beginPath();
    for(let i=0;i<3;i++){
      const a=(up?Math.PI/2:-Math.PI/2)+i*TAU/3+rot+t*(up?0.04:-0.04)*(1-alpha);
      const px=cx+tr*Math.cos(a),py=cy+tr*Math.sin(a);
      i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
    }
    ctx.closePath();
    ctx.strokeStyle=clr(col,op*intensity);ctx.lineWidth=lw;ctx.stroke();
    if(isAct){ctx.fillStyle=clr(col,0.05*avPulse*intensity);ctx.fill();}
  });


  // ── BINDU ────────────────────────────────────────────────
  const bp=0.7+0.3*Math.sin(t*2.5);
  // glow
  const binduGlow=ctx.createRadialGradient(cx,cy,0,cx,cy,W*0.06);
  binduGlow.addColorStop(0,clr(PURPLE,0.35*bp));
  binduGlow.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=binduGlow; ctx.beginPath(); ctx.arc(cx,cy,W*0.06,0,TAU); ctx.fill();
  // ring
  ctx.beginPath(); ctx.arc(cx,cy,W*0.016,0,TAU);
  ctx.strokeStyle=clr(PURPLE,0.75*bp); ctx.lineWidth=1.2; ctx.stroke();
  // dot
  ctx.beginPath(); ctx.arc(cx,cy,W*0.006,0,TAU);
  ctx.fillStyle=clr(PURPLE,0.9*bp); ctx.fill();

  AVARANAS.forEach((av,i)=>{
    if(i===0) return;
    const avR = R*av.radFrac*0.82;
    const isAct = isPurnima||(activeAv===i);
    const isNear = !isPurnima&&Math.abs(activeAv-i)===1;
    const baseAlpha = isAct?0.7*avPulse:isNear?0.18:0.06;

    if(isAct) {
      const r2=parseInt(av.color.slice(1,3),16);
      const g2=parseInt(av.color.slice(3,5),16);
      const b2=parseInt(av.color.slice(5,7),16);
      const glow=ctx.createRadialGradient(cx,cy,avR*0.82,cx,cy,avR*1.1);
      glow.addColorStop(0,`rgba(${r2},${g2},${b2},0)`);
      glow.addColorStop(0.5,`rgba(${r2},${g2},${b2},${0.14*avPulse})`);
      glow.addColorStop(1,`rgba(${r2},${g2},${b2},0)`);
      ctx.fillStyle=glow;
      ctx.beginPath();ctx.arc(cx,cy,avR*1.1,0,TAU);ctx.arc(cx,cy,avR*0.82,0,TAU,true);ctx.fill();
    }

    ctx.beginPath();ctx.arc(cx,cy,avR,0,TAU);
    ctx.strokeStyle=clr(av.color,baseAlpha*intensity);
    ctx.lineWidth=isAct?1.6:isNear?0.6:0.3;ctx.stroke();

    if(isAct&&!isPurnima) {
      ctx.font=`${W*0.011}px Georgia`;
      ctx.fillStyle=clr(av.color,0.75*avPulse);
      ctx.textAlign='center';ctx.textBaseline='middle';
      const la=drift+t*0.012;
      ctx.fillText(av.name,cx+(avR+R*0.05)*Math.cos(la),cy+(avR+R*0.05)*Math.sin(la));
    }
  });

  if(isPurnima) {
    AVARANAS.forEach((av,i)=>{
      if(i===0)return;
      const avR=R*av.radFrac*0.82;
      const r2=parseInt(av.color.slice(1,3),16);
      const g2=parseInt(av.color.slice(3,5),16);
      const b2=parseInt(av.color.slice(5,7),16);
      const fg=ctx.createRadialGradient(cx,cy,avR*0.7,cx,cy,avR*1.1);
      fg.addColorStop(0,`rgba(${r2},${g2},${b2},0)`);
      fg.addColorStop(0.5,`rgba(${r2},${g2},${b2},${0.09*avPulse})`);
      fg.addColorStop(1,`rgba(${r2},${g2},${b2},0)`);
      ctx.fillStyle=fg;ctx.beginPath();ctx.arc(cx,cy,avR*1.1,0,TAU);ctx.arc(cx,cy,avR*0.7,0,TAU,true);ctx.fill();
    });
  }

  // waxing/waning direction dots on outer ring
  const dirPts=isWaxing?14:10;
  for(let i=0;i<dirPts;i++){
    const ang=i*TAU/dirPts+drift+t*0.025*(isWaxing?1:-1);
    const pr=R*1.07+(isWaxing?i/dirPts:(dirPts-i)/dirPts)*R*0.04;
    ctx.beginPath();ctx.arc(cx+pr*Math.cos(ang),cy+pr*Math.sin(ang),W*0.004,0,TAU);
    ctx.fillStyle=clr(isWaxing?GOLD:TEAL,0.28*avPulse);ctx.fill();
  }

  // tithi phase label
  const phaseLabel = isPurnima?'pūrṇimā':isAmavasya?'amāvasyā':isWaxing?`śukla ${tithi}`:`kṛṣṇa ${30-tithi}`;
  ctx.font=`${W*0.011}px Georgia`;
  ctx.fillStyle=clr(GOLD,0.45);ctx.textAlign='left';ctx.textBaseline='bottom';
  ctx.fillText(phaseLabel,cx-R*0.95,cy+R*1.02);

  document.querySelectorAll('.avar-row').forEach((el,i)=>{
    el.classList.toggle('active',isPurnima||(i===activeAv));
  });


  document.getElementById('n-primary')&&(document.getElementById('n-primary').textContent=nc);
  ctx.restore();
}

// ── DRAW 3D TOROID ────────────────────────────────────────
const TR=0.55, Tr=0.22, HELIX_N=320, HELIX_WRAPS=8;
const TOROIDS3D=[
  {offset:0,         col:[224,176,64], name:'Sṛṣṭi',  alpha:0.72},
  {offset:TAU/3,     col:[32,168,138], name:'Sthiti',  alpha:0.55},
  {offset:TAU*2/3,   col:[128,112,221],name:'Saṃhāra', alpha:0.48},
];

function buildHelix(offset){
  const pts=[];
  for(let i=0;i<HELIX_N;i++){
    const tt=i/HELIX_N*TAU;
    const theta=tt;
    const phi=tt*HELIX_WRAPS;
    const [x,y,z]=toroidPt(theta,phi,TR,Tr,offset);
    pts.push([x,y,z]);
  }
  return pts;
}
const HELIX_PTS = TOROIDS3D.map(t=>buildHelix(t.offset));

// Stars for 3D bg
const STARS3D = Array.from({length:220},()=>({
  x:Math.random()*2-1, y:Math.random()*2-1,
  r:0.002+Math.random()*0.004,
  a:0.1+Math.random()*0.6,
  tw:0.001+Math.random()*0.002,
}));

function draw3D(opacity=1.0){
  ctx.save();
  ctx.globalAlpha = opacity;
  const t=state.t;

  if(state.autoRot) state.rotY+=0.0018;

  // star field
  STARS3D.forEach(s=>{
    const sx=W/2+s.x*W*0.5, sy=H/2+s.y*H*0.5;
    const a=s.a*(0.4+0.6*Math.sin(t*s.tw*800+sx));
    ctx.beginPath(); ctx.arc(sx,sy,s.r*Math.min(W,H),0,TAU);
    ctx.fillStyle=`rgba(180,200,240,${a})`; ctx.fill();
  });

  // draw each toroid's helix
  TOROIDS3D.forEach((tor,ti)=>{
    const [r,g,b]=tor.col;
    const pts=HELIX_PTS[ti];
    // project all points
    const projected=pts.map(([x,y,z])=>cam3(x,y,z));

    // sort segments by depth
    const segs=[];
    for(let i=0;i<pts.length-1;i++){
      const z_avg=(projected[i][2]+projected[i+1][2])/2;
      segs.push({i,z:z_avg});
    }
    segs.sort((a,b)=>a.z-b.z);

    segs.forEach(({i})=>{
      const [px1,py1,sc1]=projected[i];
      const [px2,py2,sc2]=projected[i+1];
      const sc=(sc1+sc2)/2;
      const fade=Math.max(0,Math.min(1,(sc-0.4)*2));
      ctx.beginPath(); ctx.moveTo(px1,py1); ctx.lineTo(px2,py2);
      ctx.strokeStyle=`rgba(${r},${g},${b},${tor.alpha*fade*0.85})`;
      ctx.lineWidth=Math.max(0.3,sc*2.5); ctx.stroke();
    });

    // toroid ring circle (equator)
    const ringPts=[];
    for(let i=0;i<=80;i++){
      const theta=i/80*TAU+tor.offset;
      const [x,y,z]=toroidPt(theta,0,TR,0,0);
      ringPts.push(cam3(x,y,z));
    }
    ctx.beginPath();
    ringPts.forEach(([px,py],i)=>i===0?ctx.moveTo(px,py):ctx.lineTo(px,py));
    ctx.closePath();
    ctx.strokeStyle=`rgba(${r},${g},${b},0.18)`; ctx.lineWidth=0.5; ctx.stroke();
  });

  // nakshatra ring on equatorial plane
  for(let k=0;k<27;k++){
    const ang=k*TAU/27+state.phase_drift+t*0.008;
    const isActive = k===state.nakshatra_num-1;
    const [px,py,sc]=cam3(TR*Math.cos(ang)*1.12, TR*Math.sin(ang)*1.12, 0);
    const sz=Math.max(2,sc*8*(isActive?2:1));
    ctx.beginPath(); ctx.arc(px,py,sz,0,TAU);
    ctx.fillStyle=clr(GOLD, isActive?0.9:0.25); ctx.fill();
    if(isActive){
      ctx.font=`${Math.max(9,sz*2)}px Courier New`;
      ctx.fillStyle=clr(GOLD,0.8);
      ctx.textAlign='center'; ctx.textBaseline='bottom';
      ctx.fillText(state.nakshatra, px, py-sz-2);
    }
  }

  // active devi dot on toroid surface
  const deviTheta=(state.tithi-1)/30*TAU;
  const deviPhi=(state.tithi/30)*TAU*2;
  const [dx,dy,dz]=toroidPt(deviTheta,deviPhi,TR,Tr,0);
  const [dpx,dpy,dsc]=cam3(dx,dy,dz);
  const pulse=0.7+0.3*Math.sin(t*2.2);
  ctx.beginPath(); ctx.arc(dpx,dpy,Math.max(3,dsc*12*pulse),0,TAU);
  ctx.fillStyle=clr(TEAL,0.8*pulse); ctx.fill();
  ctx.font='11px Georgia';
  ctx.fillStyle=clr(TEAL,0.7);
  ctx.textAlign='center'; ctx.textBaseline='bottom';
  ctx.fillText(state.devi,dpx,dpy-8);

  ctx.restore();
}

// ── 15-TOROID NITYA DEVI BLOOM ENGINE ─────────────────────

const NITYA=[
  {n:1, name:'Kāmeśvarī',     bija:'ऐं',  col:[224,176,64]},
  {n:2, name:'Bhagamālinī',   bija:'ह्रीं',col:[232,80,48]},
  {n:3, name:'Nityaklinā',    bija:'क्लीं',col:[32,168,138]},
  {n:4, name:'Bheruṇḍā',     bija:'ह्सौं',col:[200,64,64]},
  {n:5, name:'Vahnivāsinī',   bija:'सौं', col:[224,104,32]},
  {n:6, name:'Mahāvajreśvarī',bija:'ह्रीं',col:[224,208,64]},
  {n:7, name:'Śivadūtī',     bija:'ह्रीं',col:[192,64,128]},
  {n:8, name:'Tvaritā',      bija:'ऐं',  col:[128,112,221]},
  {n:9, name:'Kulasundarī',  bija:'क्लीं',col:[32,168,138]},
  {n:10,name:'Nityā',        bija:'श्रीं',col:[224,176,64]},
  {n:11,name:'Nīlapatākā',   bija:'ह्रीं',col:[64,96,221]},
  {n:12,name:'Vijayā',       bija:'ऐं',  col:[224,104,32]},
  {n:13,name:'Sarvamaṅgalā', bija:'श्रीं',col:[58,138,74]},
  {n:14,name:'Jvālāmālinī',  bija:'रं',   col:[224,64,32]},
  {n:15,name:'Cidagni',      bija:'ह्रीं',col:[220,220,240]},
];

// Thomson Problem N=15 — iterative relaxation
function thomsonRelax(n,iters=3000){
  let pts=[];
  // Seed with roughly uniform distribution
  for(let i=0;i<n;i++){
    const phi=Math.acos(1-2*(i+0.5)/n);
    const theta=Math.PI*(1+Math.sqrt(5))*i;
    pts.push([Math.sin(phi)*Math.cos(theta),Math.sin(phi)*Math.sin(theta),Math.cos(phi)]);
  }
  for(let iter=0;iter<iters;iter++){
    const forces=pts.map(()=>[0,0,0]);
    for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){
      const dx=pts[i][0]-pts[j][0],dy=pts[i][1]-pts[j][1],dz=pts[i][2]-pts[j][2];
      const d2=dx*dx+dy*dy+dz*dz+1e-8;
      const f=1/d2;
      forces[i][0]+=f*dx;forces[i][1]+=f*dy;forces[i][2]+=f*dz;
      forces[j][0]-=f*dx;forces[j][1]-=f*dy;forces[j][2]-=f*dz;
    }
    const lr=0.005*Math.exp(-iter/800);
    pts=pts.map((p,i)=>{
      const nx=p[0]+forces[i][0]*lr,ny=p[1]+forces[i][1]*lr,nz=p[2]+forces[i][2]*lr;
      const len=Math.sqrt(nx*nx+ny*ny+nz*nz)||1;
      return[nx/len,ny/len,nz/len];
    });
  }
  // Sort by polar angle for consistent Devi assignment
  pts.sort((a,b)=>Math.atan2(a[1],a[0])-Math.atan2(b[1],b[0]));
  return pts;
}
const THOMSON=thomsonRelax(15);

function rotateToAxis(x,y,z,ax){
  const cosA=ax[2];
  if(Math.abs(cosA-1)<1e-4)return[x,y,z];
  if(Math.abs(cosA+1)<1e-4)return[-x,-y,-z];
  const sinA=Math.sqrt(1-cosA*cosA);
  const kx=-ax[1]/sinA,ky=ax[0]/sinA;
  const dot=kx*x+ky*y;
  return[
    x*cosA+ky*z*sinA+kx*dot*(1-cosA),
    y*cosA-kx*z*sinA+ky*dot*(1-cosA),
    z*cosA+(kx*y-ky*x)*sinA
  ];
}

// Active Devis by tithi
function getActiveDevis(tithi){
  if(!tithi||tithi<1)return[1];
  if(tithi<=15)return Array.from({length:tithi},(_,i)=>i+1);
  const rem=Math.max(1,30-tithi+1);
  return Array.from({length:Math.min(rem,15)},(_,i)=>i+1);
}

// Chladni standing wave interference field
function computeBloomField(tithi,W,H,t){
  const active=getActiveDevis(tithi);
  const n=active.length;
  // Equal angular spacing — clean N-fold symmetry
  const angles=active.map((_,i)=>i*TAU/n);
  const img=ctx.createImageData(W,H);
  const d=img.data;const cx=W/2,cy=H/2;const scale=Math.min(W,H)*0.22;
  const k=5.5;const thresh=0.15;
  for(let py=0;py<H;py++){
    for(let px=0;px<W;px++){
      const x=(px-cx)/scale,y=(py-cy)/scale;
      let field=0;
      for(let i=0;i<n;i++){
        const a=angles[i];
        const w1=Math.cos(k*(x*Math.cos(a)+y*Math.sin(a))+t*0.003*i);
        const w2=Math.cos(k*(x*Math.cos(a+Math.PI/2)+y*Math.sin(a+Math.PI/2))+t*0.003*i);
        field+=w1*w2;
      }
      field/=active.length;
      const idx=(py*W+px)*4;
      const af=Math.abs(field);
      if(af<thresh){
        // NODAL LINE — the yantra geometry (bright gold)
        const b=1-af/thresh;
        d[idx]=Math.round(224*b);d[idx+1]=Math.round(176*b);d[idx+2]=Math.round(64*b);d[idx+3]=Math.round(220*b);
      }else if(field>thresh){
        // Positive antinode — dark gold
        const v=(field-thresh)/(1-thresh);
        d[idx]=Math.round(40*v);d[idx+1]=Math.round(30*v);d[idx+2]=Math.round(10*v);d[idx+3]=Math.round(180*v);
      }else{
        // Negative antinode — dark teal
        const v=(-field-thresh)/(1-thresh);
        d[idx]=Math.round(5*v);d[idx+1]=Math.round(40*v);d[idx+2]=Math.round(35*v);d[idx+3]=Math.round(180*v);
      }
    }
  }
  return img;
}

// Draw BLOOM mode
function drawBloom(opacity=1.0){
  ctx.save();ctx.globalAlpha=opacity;
  const t=state.t;const tithi=state.tithi||7;
  const active=getActiveDevis(tithi);

  // Background
  ctx.fillStyle='rgba(2,3,10,1)';ctx.fillRect(0,0,W,H);

  // Interference field (lower resolution for performance)
  const res=Math.min(W,200);const resH=Math.round(res*H/W);
  const fieldImg=computeBloomField(tithi,res,resH,t);
  // Draw scaled up
  const offC=document.createElement('canvas');offC.width=res;offC.height=resH;
  offC.getContext('2d').putImageData(fieldImg,0,0);
  ctx.imageSmoothingEnabled=true;
  ctx.drawImage(offC,0,0,W,H);

  // Bindu marker at center
  const bp=0.7+0.3*Math.sin(t*2.5);const bcx=W/2,bcy=H/2;
  const bg=ctx.createRadialGradient(bcx,bcy,0,bcx,bcy,20);
  bg.addColorStop(0,clr(GOLD,0.8*bp));bg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=bg;ctx.beginPath();ctx.arc(bcx,bcy,20,0,TAU);ctx.fill();
  ctx.beginPath();ctx.arc(bcx,bcy,4,0,TAU);ctx.fillStyle=clr(GOLD,0.95*bp);ctx.fill();

  // Thomson sphere projection — Devi positions as dots
  const cx=W/2,cy=H/2,sR=Math.min(W,H)*0.35;
  // Draw sphere outline
  ctx.beginPath();ctx.arc(cx,cy,sR,0,TAU);
  ctx.strokeStyle='rgba(26,40,64,0.4)';ctx.lineWidth=0.5;ctx.stroke();

  THOMSON.forEach((pos,i)=>{
    const devi=NITYA[i];const isAct=active.includes(i+1);
    // Project: orthographic z=0 plane
    const px=cx+pos[0]*sR,py=cy+pos[1]*sR;
    const depth=pos[2];// z for depth cueing
    const sz=isAct?(4+2*Math.sin(t*2+i)):(2);
    const [r,g,b]=devi.col;
    const baseA=isAct?0.9:0.2;
    const a=baseA*(0.5+0.5*Math.max(0,depth+0.3));// depth fade
    ctx.beginPath();ctx.arc(px,py,sz,0,TAU);
    ctx.fillStyle=`rgba(${r},${g},${b},${a})`;ctx.fill();
    if(isAct){
      ctx.beginPath();ctx.arc(px,py,sz+3,0,TAU);
      ctx.strokeStyle=`rgba(${r},${g},${b},${a*0.4})`;ctx.lineWidth=0.5;ctx.stroke();
      // Bija label
      if(depth>-0.3){
        ctx.font=`${W*0.018}px Georgia`;ctx.fillStyle=`rgba(${r},${g},${b},${a*0.7})`;
        ctx.textAlign='center';ctx.fillText(devi.bija,px,py-sz-4);
      }
    }
  });

  // Center status
  ctx.font=`${W*0.022}px Georgia`;ctx.fillStyle=clr(GOLD,0.8);
  ctx.textAlign='center';ctx.fillText(`${active.length}/15 active`,cx,H-W*0.06);
  ctx.font=`${W*0.014}px 'Courier New'`;ctx.fillStyle=clr(GOLD,0.4);
  ctx.fillText(`tithi ${tithi} · ${tithi<=15?'waxing':'waning'}`,cx,H-W*0.035);

  // Active Devi name (current tithi's Devi)
  const curDevi=NITYA[Math.min(tithi,15)-1];
  if(curDevi){
    ctx.font=`${W*0.016}px Georgia`;ctx.fillStyle=`rgba(${curDevi.col.join(',')},0.7)`;
    ctx.fillText(curDevi.name,cx,W*0.04);
  }

  ctx.restore();
}

// Sidebar bloom state
function updateBloomSidebar(){
  const tithi=state.tithi||7;const active=getActiveDevis(tithi);
  const el=document.getElementById('sb-bloom');
  if(!el)return;
  const sym=active.length<=3?'C₃':active.length<=6?'C₆':active.length<=9?'C₉':active.length<=12?'C₁₂':'C₁₅';
  const emergence=Math.round(active.length/15*100);
  el.innerHTML=`<span style="color:var(--gold)">${active.length}/15</span> · ${sym} · ${emergence}%`;
}

// ── ALIGNED MODE — Chladni + Sri Yantra overlay ──────────

// Canonical Sri Yantra 9 triangles (normalized coordinates, centered at 0,0)
// 5 Shakti (downward ▽) + 4 Shiva (upward ▲)
const SRI_TRIS=[
  // Shakti (teal) — downward pointing
  {up:false,sc:0.95,rot:0,col:'teal'},
  {up:false,sc:0.72,rot:0.02,col:'teal'},
  {up:false,sc:0.52,rot:0.04,col:'teal'},
  {up:false,sc:0.35,rot:0.03,col:'teal'},
  {up:false,sc:0.18,rot:0,col:'teal'},
  // Shiva (gold) — upward pointing
  {up:true,sc:0.85,rot:0,col:'gold'},
  {up:true,sc:0.62,rot:0.03,col:'gold'},
  {up:true,sc:0.42,rot:0.02,col:'gold'},
  {up:true,sc:0.22,rot:0,col:'gold'},
];

function sriTrianglePoints(tri,R){
  const pts=[];
  for(let i=0;i<3;i++){
    const a=(tri.up?-Math.PI/2:Math.PI/2)+i*TAU/3+tri.rot;
    pts.push([R*tri.sc*Math.cos(a),R*tri.sc*Math.sin(a)]);
  }
  pts.push(pts[0]);// close
  return pts;
}

// Sample field value at a point
function sampleField(x,y,angles,k,t){
  let f=0;const n=angles.length;
  for(let i=0;i<n;i++){
    const a=angles[i];
    const w1=Math.cos(k*(x*Math.cos(a)+y*Math.sin(a))+t*0.003*i);
    const w2=Math.cos(k*(x*Math.cos(a+Math.PI/2)+y*Math.sin(a+Math.PI/2))+t*0.003*i);
    f+=w1*w2;
  }
  return f/Math.max(n,1);
}

function computeAlignment(tithi,k,t){
  const active=getActiveDevis(tithi);const n=active.length;
  const angles=active.map((_,i)=>i*TAU/n);
  const R=1.0;// field radius
  let totalAbs=0,samples=0;
  SRI_TRIS.forEach(tri=>{
    const pts=sriTrianglePoints(tri,R);
    for(let e=0;e<3;e++){
      const[x0,y0]=pts[e],[x1,y1]=pts[e+1];
      for(let s=0;s<22;s++){
        const frac=s/22;
        const sx=x0+(x1-x0)*frac,sy=y0+(y1-y0)*frac;
        totalAbs+=Math.abs(sampleField(sx,sy,angles,k,t));
        samples++;
      }
    }
  });
  return Math.max(0,Math.min(100,Math.round((1-totalAbs/samples)*100)));
}

function drawAligned(opacity){
  ctx.save();ctx.globalAlpha=opacity;
  const t=state.t;const tithi=state.tithi||7;
  ctx.fillStyle='rgba(2,3,10,1)';ctx.fillRect(0,0,W,H);

  // Render Chladni field with tuneK
  const active=getActiveDevis(tithi);const n=active.length;
  const angles=active.map((_,i)=>i*TAU/n);
  const res=Math.min(W,200),resH=Math.round(res*H/W);
  const img=ctx.createImageData(res,resH);
  const d=img.data;const fcx=res/2,fcy=resH/2;const scale=Math.min(res,resH)*0.22;
  const thresh=0.15;
  for(let py=0;py<resH;py++){
    for(let px=0;px<res;px++){
      const x=(px-fcx)/scale,y=(py-fcy)/scale;
      let field=0;
      for(let i=0;i<n;i++){
        const a=angles[i];
        const w1=Math.cos(tuneK*(x*Math.cos(a)+y*Math.sin(a))+t*0.003*i);
        const w2=Math.cos(tuneK*(x*Math.cos(a+Math.PI/2)+y*Math.sin(a+Math.PI/2))+t*0.003*i);
        field+=w1*w2;
      }
      field/=n;
      const idx=(py*res+px)*4;const af=Math.abs(field);
      if(af<thresh){const b=1-af/thresh;d[idx]=Math.round(224*b);d[idx+1]=Math.round(176*b);d[idx+2]=Math.round(64*b);d[idx+3]=Math.round(220*b)}
      else if(field>thresh){const v=(field-thresh)/(1-thresh);d[idx]=Math.round(40*v);d[idx+1]=Math.round(30*v);d[idx+2]=Math.round(10*v);d[idx+3]=Math.round(180*v)}
      else{const v=(-field-thresh)/(1-thresh);d[idx]=Math.round(5*v);d[idx+1]=Math.round(40*v);d[idx+2]=Math.round(35*v);d[idx+3]=Math.round(180*v)}
    }
  }
  const offC=document.createElement('canvas');offC.width=res;offC.height=resH;
  offC.getContext('2d').putImageData(img,0,0);
  ctx.imageSmoothingEnabled=true;ctx.drawImage(offC,0,0,W,H);

  // Bindu
  const bp=0.7+0.3*Math.sin(t*2.5);const bcx=W/2,bcy=H/2;
  const bg=ctx.createRadialGradient(bcx,bcy,0,bcx,bcy,15);
  bg.addColorStop(0,clr(GOLD,0.6*bp));bg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=bg;ctx.beginPath();ctx.arc(bcx,bcy,15,0,TAU);ctx.fill();
  ctx.beginPath();ctx.arc(bcx,bcy,3,0,TAU);ctx.fillStyle=clr(GOLD,0.9*bp);ctx.fill();

  // Sri Yantra triangle overlay
  const R=Math.min(W,H)*0.22;// match field scale
  SRI_TRIS.forEach(tri=>{
    const pts=sriTrianglePoints(tri,R);
    ctx.beginPath();
    pts.forEach(([px,py],i)=>{
      const sx=bcx+px,sy=bcy+py;
      i===0?ctx.moveTo(sx,sy):ctx.lineTo(sx,sy);
    });
    ctx.closePath();
    ctx.strokeStyle=tri.col==='gold'?clr(GOLD,0.35):clr(TEAL,0.35);
    ctx.lineWidth=0.8;ctx.stroke();
  });

  // Alignment score
  const score=computeAlignment(tithi,tuneK,t);
  document.getElementById('align-score').textContent='alignment: '+score+'%';

  // Status
  ctx.font=`${W*0.018}px 'Courier New'`;ctx.fillStyle=clr(GOLD,0.6);
  ctx.textAlign='center';ctx.fillText(`k=${tuneK.toFixed(1)} · ${n} waves · align ${score}%`,bcx,H-W*0.03);

  ctx.restore();
}

// ── MERKABA MODE — counter-rotating lunar+solar fields ────

const GRAHAS=[
  {name:'Sūrya',  ang:0,  col:'#e0b040'},
  {name:'Candra', ang:40, col:'#d8e8f0'},
  {name:'Maṅgala',ang:80, col:'#c84040'},
  {name:'Budha',  ang:120,col:'#40c840'},
  {name:'Guru',   ang:160,col:'#e0b040'},
  {name:'Śukra',  ang:200,col:'#e880c0'},
  {name:'Śani',   ang:240,col:'#8070dd'},
  {name:'Rāhu',   ang:280,col:'#606060'},
  {name:'Ketu',   ang:320,col:'#c87820'},
];
let tuneKS=3.8;

function drawMerkaba(opacity){
  ctx.save();ctx.globalAlpha=opacity;
  const t=state.t;const tithi=state.tithi||7;
  ctx.fillStyle='rgba(2,3,10,1)';ctx.fillRect(0,0,W,H);

  const active=getActiveDevis(tithi);const nL=active.length;
  const deviAngles=active.map((_,i)=>i*TAU/nL);
  const kL=tuneK,kS=tuneKS;
  const wL=0.003,wS=0.003*(29.53/365.25);

  const res=Math.min(W,180),resH=Math.round(res*H/W);
  const img=ctx.createImageData(res,resH);
  const d=img.data;const fcx=res/2,fcy=resH/2;const scale=Math.min(res,resH)*0.22;
  const thresh=0.12;

  for(let py=0;py<resH;py++){
    for(let px=0;px<res;px++){
      const x=(px-fcx)/scale,y=(py-fcy)/scale;

      // Inner: 15 Devī, CCW
      let fi=0;
      for(let i=0;i<nL;i++){
        const a=deviAngles[i];
        const w1=Math.cos(kL*(x*Math.cos(a)+y*Math.sin(a))+wL*t*i);
        const w2=Math.cos(kL*(x*Math.cos(a+Math.PI/2)+y*Math.sin(a+Math.PI/2))+wL*t*i);
        fi+=w1*w2;
      }
      fi/=nL;

      // Outer: 9 Grahas, CW (negative rotation)
      let fo=0;
      for(let j=0;j<9;j++){
        const a=GRAHAS[j].ang*Math.PI/180-wS*t*j;
        const w1=Math.cos(kS*(x*Math.cos(a)+y*Math.sin(a)));
        const w2=Math.cos(kS*(x*Math.cos(a+Math.PI/2)+y*Math.sin(a+Math.PI/2)));
        fo+=w1*w2;
      }
      fo/=9;

      // Product field
      const ft=fi*fo;
      const idx=(py*res+px)*4;const aft=Math.abs(ft);
      if(aft<thresh){
        const b=1-aft/thresh;
        d[idx]=Math.round(255*b);d[idx+1]=Math.round(220*b);d[idx+2]=Math.round(120*b);d[idx+3]=Math.round(230*b);
      }else{
        const ri=Math.abs(fi),ro=Math.abs(fo);
        if(ri>ro){const v=Math.min(1,ri*0.6);d[idx]=Math.round(5*v);d[idx+1]=Math.round(50*v);d[idx+2]=Math.round(45*v);d[idx+3]=Math.round(160*v)}
        else{const v=Math.min(1,ro*0.6);d[idx]=Math.round(50*v);d[idx+1]=Math.round(35*v);d[idx+2]=Math.round(5*v);d[idx+3]=Math.round(160*v)}
      }
    }
  }
  const offC=document.createElement('canvas');offC.width=res;offC.height=resH;
  offC.getContext('2d').putImageData(img,0,0);
  ctx.imageSmoothingEnabled=true;ctx.drawImage(offC,0,0,W,H);

  // Bindu
  const bp=0.7+0.3*Math.sin(t*2.5);const bcx=W/2,bcy=H/2;
  const bg=ctx.createRadialGradient(bcx,bcy,0,bcx,bcy,15);
  bg.addColorStop(0,clr(GOLD,0.7*bp));bg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=bg;ctx.beginPath();ctx.arc(bcx,bcy,15,0,TAU);ctx.fill();
  ctx.beginPath();ctx.arc(bcx,bcy,3,0,TAU);ctx.fillStyle=clr(GOLD,0.9*bp);ctx.fill();

  // Graha dots on outer ring
  const outerR=Math.min(W,H)*0.44;
  GRAHAS.forEach((g,j)=>{
    const ang=g.ang*Math.PI/180-t*0.001;
    const gx=bcx+outerR*Math.cos(ang),gy=bcy+outerR*Math.sin(ang);
    ctx.beginPath();ctx.arc(gx,gy,4,0,TAU);ctx.fillStyle=g.col;ctx.fill();
    ctx.font=`${W*0.012}px 'Courier New'`;ctx.fillStyle=g.col;ctx.textAlign='center';
    ctx.fillText(g.name,gx,gy-7);
  });

  // Devī dots on inner ring
  const innerR=Math.min(W,H)*0.28;
  active.forEach((ti,i)=>{
    const devi=NITYA[ti-1];const ang=i*TAU/nL+t*0.002;
    const dx=bcx+innerR*Math.cos(ang),dy=bcy+innerR*Math.sin(ang);
    const[r,g,b]=devi.col;
    ctx.beginPath();ctx.arc(dx,dy,3,0,TAU);ctx.fillStyle=`rgba(${r},${g},${b},0.7)`;ctx.fill();
  });

  // Status
  ctx.font=`${W*0.016}px 'Courier New'`;ctx.fillStyle=clr(GOLD,0.5);ctx.textAlign='center';
  ctx.fillText(`merkaba · ${nL} devī ↺ · 9 graha ↻ · kL=${kL.toFixed(1)} kS=${kS.toFixed(1)}`,bcx,H-W*0.025);

  ctx.restore();
}

// ── MAIN DRAW ─────────────────────────────────────────────
function draw(){
  ctx.clearRect(0,0,W,H);

  // fill bg
  ctx.fillStyle=`rgba(2,3,10,1)`; ctx.fillRect(0,0,W,H);

  if(state.mode==='2d'){
    draw2D(1.0);
  } else if(state.mode==='3d'){
    draw3D(1.0);
  } else if(state.mode==='bloom'){
    drawBloom(1.0);
  } else if(state.mode==='aligned'){
    drawAligned(1.0);
  } else if(state.mode==='merkaba'){
    drawMerkaba(1.0);
  } else { // both
    draw3D(0.55);
    draw2D(0.65);
  }
}

// ── ANIMATION ─────────────────────────────────────────────
function loop(){
  state.t+=0.008;
  draw();
  requestAnimationFrame(loop);
}

// ── MODE TOGGLE ───────────────────────────────────────────
function setMode(m){
  state.mode=m;
  ['2d','3d','bloom','aligned','merkaba','both'].forEach(id=>{
    const el=document.getElementById('btn-'+id);
    if(el)el.classList.toggle('active',id===m);
  });
}

// ── DRAG TO ROTATE (3D mode) ──────────────────────────────
canvas.addEventListener('mousedown',e=>{
  state.dragging=true; state.autoRot=false;
  state.lastMX=e.clientX; state.lastMY=e.clientY;
});
window.addEventListener('mouseup',()=>{ state.dragging=false; });
window.addEventListener('mousemove',e=>{
  if(!state.dragging)return;
  const dx=e.clientX-state.lastMX, dy=e.clientY-state.lastMY;
  state.rotY+=dx*0.008; state.rotX+=dy*0.008;
  state.lastMX=e.clientX; state.lastMY=e.clientY;
});
canvas.addEventListener('dblclick',()=>{ state.autoRot=true; });

// ── SIDEBAR POPULATION ────────────────────────────────────
function populateSidebar(){
  // āvaraṇas
  const al=document.getElementById('avar-list');
  al.innerHTML='';
  AVARANAS.forEach(av=>{
    const d=document.createElement('div');
    d.className='avar-row'; d.id='avar-'+av.n;
    d.innerHTML=`<span class="avar-n">${av.n}</span><span class="avar-name">${av.name}</span><span class="avar-deity"> · ${av.deity}</span>`;
    al.appendChild(d);
  });
  // petals
  const pl=document.getElementById('petal-list');
  pl.innerHTML='';
  NITYA_DEVI.forEach(d=>{
    const row=document.createElement('div');
    row.className='petal-row';
    row.innerHTML=`<span class="petal-bija" style="color:${d.color}">${d.bija}</span><span class="petal-name">${d.name}</span>`;
    pl.appendChild(row);
  });
}

// ── FIELD STATE ───────────────────────────────────────────
function applyField(data){
  const p=data.panchanga||data;
  const nak=p.nakshatra||''; state.nakshatra=typeof nak==='object'?(nak.name||''):nak||state.nakshatra;
  state.nakshatra_num=p.nakshatra_num||p.nak_num||p.nakshatra_index||state.nakshatra_num;
  const ti=p.tithi;
  if(typeof ti==='number'){state.tithi=ti;state.tithi_name=p.tithi_name||'';}
  else if(typeof ti==='string'){state.tithi_name=ti;state.tithi=p.tithi_num||state.tithi;}
  else if(ti&&typeof ti==='object'){state.tithi=ti.number||ti.num||state.tithi;state.tithi_name=ti.name||'';}
  const devi=p.devi;
  if(typeof devi==='string')state.devi=devi;
  else if(devi&&typeof devi==='object')state.devi=devi.name||devi.deity||state.devi;
  state.alpha=typeof p.alpha==='number'?p.alpha:state.alpha;
  deriveFromNakshatra(state.nakshatra_num);
  state.intensity=deriveIntensity(typeof state.tithi==='number'?state.tithi:8);
  updateSidebar();
}

function updateSidebar(){
  document.getElementById('sb-nak').textContent=state.nakshatra;
  document.getElementById('sb-tithi').textContent=`tithi ${state.tithi} · ${state.tithi_name}`;
  document.getElementById('sb-devi').textContent=state.devi;
  document.getElementById('p-n').textContent=state.n_symmetry;
  document.getElementById('p-int').textContent=state.intensity.toFixed(2);
  document.getElementById('p-drift').textContent=(state.phase_drift*180/Math.PI).toFixed(1)+'°';
  document.getElementById('p-alpha').textContent=state.alpha.toFixed(3);
  updateBloomSidebar();
  document.getElementById('alpha-val').textContent=state.alpha.toFixed(3);
  document.getElementById('alpha-cursor').style.left=(state.alpha*100)+'%';
  // highlight active devi petal
  document.querySelectorAll('.petal-row').forEach((row,i)=>{
    row.style.opacity=NITYA_DEVI[i].name===state.devi?'1':'0.5';
  });
}

async function fetchField(){
  try{
    const d=await atlasGet('/field',DEFAULT_FIELD);
    if(!d||!d.panchanga)throw new Error();
    state.online=true;
    document.getElementById('live-badge').className='live';
    document.getElementById('live-badge').textContent='LIVE';
    applyField(d);
  }catch(e){
    state.online=false;
    document.getElementById('live-badge').className='offline';
    document.getElementById('live-badge').textContent='OFFLINE';
    updateSidebar();
  }
}

// ── INIT ──────────────────────────────────────────────────
window.addEventListener('resize',()=>{ resize(); });
resize();
populateSidebar();
deriveFromNakshatra(state.nakshatra_num);
state.intensity=deriveIntensity(state.tithi);
updateSidebar();
fetchField();
loop();
setInterval(fetchField,5000);// poll every 5s for override support

// Tithi slider for bloom testing
document.getElementById('tithi-slider').addEventListener('input',e=>{
  const v=parseInt(e.target.value);
  state.tithi=v;
  document.getElementById('tithi-slider-val').textContent=v;
  state.intensity=deriveIntensity(v);
  updateSidebar();
});

let tuneK=5.5;
document.getElementById('k-slider').addEventListener('input',e=>{
  tuneK=parseFloat(e.target.value);
  document.getElementById('k-slider-val').textContent=tuneK.toFixed(1);
});
document.getElementById('ks-slider').addEventListener('input',e=>{
  tuneKS=parseFloat(e.target.value);
  document.getElementById('ks-slider-val').textContent=tuneKS.toFixed(1);
});
