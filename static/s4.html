<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>S4 · Geometry · Yantra</title>
<link rel="stylesheet" href="/static/atlas-theme.css">
<script src="/static/atlas.js"></script>
<script src="/static/interaction_engine.js"></script>
<style>
body{background:#020408;color:var(--text);font-family:var(--font-mono);font-size:11px;height:100vh;display:grid;grid-template-columns:200px 1fr 200px;grid-template-rows:32px 1fr 28px;overflow:hidden}
.top{grid-column:1/-1;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:10px}
.top .left{color:var(--dim)}.top .right{color:var(--muted)}
.col{padding:14px;overflow-y:auto}.col-l{border-right:1px solid var(--border)}.col-r{border-left:1px solid var(--border)}
.col-c{display:flex;align-items:center;justify-content:center}
.hdr{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.15em;margin-bottom:5px;margin-top:10px}.hdr:first-child{margin-top:0}
.val{font-family:var(--font-body);font-size:16px;color:var(--gold);margin-bottom:2px}
.sub{font-size:10px;color:var(--muted);margin-bottom:2px}.dim{font-size:10px;color:var(--dim);margin-bottom:2px}
.sep{height:1px;background:var(--border);margin:8px 0}
.ev{font-family:var(--font-mono);font-size:10px;color:var(--teal);margin-bottom:1px}

/* Yantra Grid */
.yantra-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;width:340px;height:340px}
.yantra-cell{display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid rgba(200,169,110,0.12);position:relative;transition:background .8s,box-shadow .8s}
.yantra-cell .number{font-family:var(--font-body);font-size:2.6rem;font-weight:300;color:var(--gold);line-height:1}
.yantra-cell .zone{font-size:0.55rem;color:var(--muted);text-align:center;margin-top:4px}
.yantra-cell .deity{font-size:0.5rem;color:var(--dim);margin-top:1px}
.yantra-cell.brahmasthana{animation:brahma-pulse 4s ease-in-out infinite}
@keyframes brahma-pulse{0%,100%{box-shadow:0 0 20px rgba(147,112,219,0.15)}50%{box-shadow:0 0 45px rgba(147,112,219,0.4)}}

/* Compass */
.compass{width:160px;height:160px;margin:0 auto}

/* Footer */
.footer{grid-column:1/-1;background:var(--panel);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:center;gap:12px;font-size:10px;color:var(--dim)}
.footer .nak{font-family:var(--font-body);color:var(--gold);font-size:12px}

/* Nav */
.nav{position:fixed;right:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;z-index:100}
.nav a{font-family:var(--font-mono);font-size:0.65rem;color:var(--muted);text-decoration:none;padding:2px 4px;border:1px solid transparent;transition:all .2s}
.nav a:hover,.nav a.on{color:var(--gold);border-color:var(--gold)}

/* Mode buttons */
.mode-btn{font-family:var(--font-mono);font-size:8px;letter-spacing:.1em;padding:3px 10px;border:1px solid var(--border);
  background:transparent;color:var(--dim);cursor:pointer;text-transform:uppercase;transition:all .15s}
.mode-btn:first-child{border-radius:2px 0 0 2px}.mode-btn:last-child{border-radius:0 2px 2px 0}
.mode-btn+.mode-btn{border-left:none}
.mode-btn:hover,.mode-btn.on{color:var(--gold);border-color:rgba(200,169,110,.3);background:rgba(200,169,110,.04)}

/* Bloom link */
.bloom-link{position:fixed;bottom:32px;left:16px;font-size:9px;color:var(--dim);text-decoration:none}.bloom-link:hover{color:var(--teal)}
</style>
</head>
<body>
<div class="top">
  <span class="left">S4 · GEOMETRY</span>
  <span style="display:flex;gap:0">
    <button class="mode-btn on" id="btn-yantra" onclick="setMode('yantra')">Yantra</button>
    <button class="mode-btn" id="btn-devi" onclick="setMode('devi')">Devi</button>
    <button class="mode-btn" id="btn-both" onclick="setMode('both')">Both</button>
  </span>
  <span class="right" id="top-field">—</span>
</div>
<div class="col col-l" id="info">◌</div>
<div class="col col-c">
  <div class="yantra-grid" id="grid"></div>
  <div id="devi-canvas-wrap" style="display:none;position:relative">
    <canvas id="devi-canvas" width="400" height="400" style="border-radius:4px"></canvas>
    <div id="devi-slider-wrap" style="position:absolute;bottom:-30px;left:0;right:0;display:flex;align-items:center;gap:8px;justify-content:center">
      <span style="font-size:8px;color:var(--dim)">tithi</span>
      <input type="range" id="tithi-slider" min="1" max="15" value="1" style="width:200px;accent-color:var(--gold)">
      <span id="tithi-val" style="font-size:9px;color:var(--gold);min-width:16px">1</span>
    </div>
  </div>
</div>
<div class="col col-r" id="compass-col">
  <div class="hdr">VASTU COMPASS</div>
  <div id="compass"></div>
</div>
<div class="footer"><span id="fn" class="nak">—</span><span id="ft">—</span><span id="fv">—</span><span id="fd">—</span><span style="width:6px;height:6px;border-radius:50%;background:var(--teal)"></span></div>
<nav class="nav"><a href="/s0">S0</a><a href="/s1">S1</a><a href="/s2">S2</a><a href="/s3">S3</a><a href="/s4" class="on">S4</a><a href="/s5">S5</a><a href="/s6">S6</a></nav>
<a href="/static/s4-bloom.html" class="bloom-link">→ bloom engine</a>
<script>
function dv(o){return typeof o==='object'&&o?(o.name||'—'):(o||'—')}
function hexA(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return`rgba(${r},${g},${b},${a})`}

// Build empty grid cells
const grid=document.getElementById('grid');
for(let i=0;i<9;i++){
  const cell=document.createElement('div');
  cell.className='yantra-cell';cell.dataset.cell=i;
  cell.innerHTML='<div class="number">·</div><div class="zone"></div><div class="deity"></div>';
  grid.appendChild(cell);
}

async function load(){
  const[y,f]=await Promise.all([atlasGet('/yantra/navagraha',{}),atlasGet('/field',{})]);
  const pa=f?.panchanga||{};
  document.getElementById('fn').textContent=pa.nakshatra||'—';
  document.getElementById('ft').textContent=pa.tithi||'—';
  document.getElementById('fv').textContent=pa.vara||'—';
  document.getElementById('fd').textContent=dv(pa.devi);
  document.getElementById('top-field').textContent=`${y?.graha_name||'—'} · ${pa.nakshatra||'—'}`;

  if(!y||y.error){document.getElementById('info').innerHTML=`<div class="dim">yantra engine: ${y?.error||'offline'}</div>`;return}

  // Update grid cells
  (y.cells||[]).forEach((c,i)=>{
    const el=grid.children[i];if(!el)return;
    el.querySelector('.number').textContent=c.value;
    el.querySelector('.zone').textContent=c.vastu_zone;
    el.querySelector('.deity').textContent=c.vastu_deity;
    el.style.background=hexA(c.vastu_color,0.06);
    el.style.boxShadow=`inset 0 0 30px ${hexA(c.vastu_color,0.08)}`;
    if(c.vastu_zone==='Brahma')el.classList.add('brahmasthana');
    else el.classList.remove('brahmasthana');
  });

  // Info panel
  let h=`<div class="hdr">YANTRA</div>`;
  h+=`<div class="val">${y.graha_name}</div>`;
  h+=`<div class="dim">k = ${y.k}</div>`;
  h+=`<div class="sep"></div>`;
  h+=`<div class="hdr">MAGIC CONSTANT</div>`;
  h+=`<div style="font-family:var(--font-body);font-size:24px;color:var(--teal)">${y.magic_constant}</div>`;
  h+=`<div class="dim">M = 15 + 3×${y.k}</div>`;
  h+=`<div class="sep"></div>`;
  h+=`<div class="hdr">EIGENVALUES</div>`;
  (y.eigenvalues||[]).forEach(e=>{
    const isM=Math.abs(e-y.magic_constant)<0.01;
    h+=`<div class="ev" style="color:${isM?'var(--gold)':'var(--teal)'}">λ = ${e.toFixed(3)}${isM?' ← M':''}</div>`;
  });
  h+=`<div class="dim" style="margin-top:4px">±2√6 = ±${y.invariant_eigenvalue?.toFixed(3)||'4.899'}</div>`;
  h+=`<div class="dim">invariant across all 9 grahas</div>`;
  h+=`<div class="sep"></div>`;
  h+=`<div class="hdr">VASTU ACTIVE</div>`;
  h+=`<div class="sub">${y.vastu_active_direction} · ${y.field_element}</div>`;
  h+=`<div class="sep"></div>`;
  h+=`<div class="hdr">MATRIX</div>`;
  (y.matrix||[]).forEach(row=>{h+=`<div class="dim" style="font-family:var(--font-mono);letter-spacing:.3em">${row.map(v=>String(v).padStart(2)).join(' ')}</div>`});
  document.getElementById('info').innerHTML=h;

  // Compass SVG
  renderCompass(y);
}

function renderCompass(y){
  const el=document.getElementById('compass');
  const sz=160,cx=sz/2,cy=sz/2,r=60,ir=20;
  const NS='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(NS,'svg');
  svg.setAttribute('width',sz);svg.setAttribute('height',sz);svg.setAttribute('viewBox',`0 0 ${sz} ${sz}`);

  // 8 direction segments
  const dirs=[
    {name:'N',a:-90,color:'#00d4aa'},{name:'NE',a:-45,color:'#4a9eff'},
    {name:'E',a:0,color:'#ff6b35'},{name:'SE',a:45,color:'#ff6b35'},
    {name:'S',a:90,color:'#00d4aa'},{name:'SW',a:135,color:'#888'},
    {name:'W',a:180,color:'#4a9eff'},{name:'NW',a:225,color:'#c8a96e'}
  ];
  dirs.forEach(d=>{
    const rad=d.a*Math.PI/180;
    const x1=cx+ir*Math.cos(rad),y1=cy+ir*Math.sin(rad);
    const x2=cx+r*Math.cos(rad),y2=cy+r*Math.sin(rad);
    const active=y.vastu_active_direction===d.name;
    const line=document.createElementNS(NS,'line');
    line.setAttribute('x1',x1);line.setAttribute('y1',y1);
    line.setAttribute('x2',x2);line.setAttribute('y2',y2);
    line.setAttribute('stroke',d.color);line.setAttribute('stroke-width',active?2.5:1);
    line.setAttribute('stroke-opacity',active?0.9:0.3);
    svg.appendChild(line);
    // Label
    const lx=cx+(r+12)*Math.cos(rad),ly=cy+(r+12)*Math.sin(rad);
    const t=document.createElementNS(NS,'text');
    t.setAttribute('x',lx);t.setAttribute('y',ly+3);t.setAttribute('text-anchor','middle');
    t.setAttribute('font-size','8');t.setAttribute('fill',active?d.color:'#4a6a7a');
    t.setAttribute('font-family',"'Space Mono',monospace");
    t.textContent=d.name;svg.appendChild(t);
    // Dot at tip
    const dot=document.createElementNS(NS,'circle');
    dot.setAttribute('cx',x2);dot.setAttribute('cy',y2);dot.setAttribute('r',active?4:2);
    dot.setAttribute('fill',d.color);dot.setAttribute('fill-opacity',active?0.8:0.25);
    svg.appendChild(dot);
  });
  // Center Brahmasthana
  const bc=document.createElementNS(NS,'circle');
  bc.setAttribute('cx',cx);bc.setAttribute('cy',cy);bc.setAttribute('r',ir);
  bc.setAttribute('fill','#9370db');bc.setAttribute('fill-opacity','0.15');
  bc.setAttribute('stroke','#9370db');bc.setAttribute('stroke-width','0.8');bc.setAttribute('stroke-opacity','0.4');
  svg.appendChild(bc);
  const bt=document.createElementNS(NS,'text');
  bt.setAttribute('x',cx);bt.setAttribute('y',cy+3);bt.setAttribute('text-anchor','middle');
  bt.setAttribute('font-size','7');bt.setAttribute('fill','#9370db');
  bt.setAttribute('font-family',"'Space Mono',monospace");
  bt.textContent='✦';svg.appendChild(bt);

  el.innerHTML='';el.appendChild(svg);

  // Zone list below compass
  let zhtml='<div class="sep"></div><div class="hdr">ZONES</div>';
  (y.cells||[]).forEach(c=>{
    const active=y.vastu_active_direction===c.vastu_direction;
    zhtml+=`<div style="font-size:9px;color:${active?c.vastu_color:'var(--dim)'};margin-bottom:1px">${c.vastu_direction||'C'} · ${c.vastu_deity} · ${c.value}</div>`;
  });
  el.insertAdjacentHTML('beforeend',zhtml);
}

// ═══════════════════════════════════════════════
//  DEVI QUASICRYSTAL MODE
// ═══════════════════════════════════════════════

let currentMode = 'yantra';
let currentDevi = null;

function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('on'));
  document.getElementById('btn-' + mode).classList.add('on');

  const grid = document.getElementById('grid');
  const canvasWrap = document.getElementById('devi-canvas-wrap');

  if (mode === 'yantra') {
    grid.style.display = '';
    canvasWrap.style.display = 'none';
  } else if (mode === 'devi') {
    grid.style.display = 'none';
    canvasWrap.style.display = '';
    loadDeviField();
  } else { // both
    grid.style.display = '';
    canvasWrap.style.display = '';
    canvasWrap.style.position = 'absolute';
    canvasWrap.style.opacity = '0.4';
    loadDeviField();
  }
}

async function loadDeviField(tithi) {
  if (!tithi) {
    // Get from current field state
    const f = await atlasGet('/field', {});
    const tidx = f?.panchanga?.tidx || 0;
    tithi = (tidx % 15) + 1;
    document.getElementById('tithi-slider').value = tithi;
  }
  document.getElementById('tithi-val').textContent = tithi;

  // Fetch devi data
  const devi = await atlasGet('/nitya/devi/' + tithi, {});
  currentDevi = devi;

  // Update info panel with devi data
  if (currentMode !== 'yantra') {
    let h = `<div class="hdr">NITYA DEVI</div>`;
    h += `<div class="val">${devi.name_iast || devi.name || '—'}</div>`;
    if (devi.name_devanagari) h += `<div class="sub">${devi.name_devanagari}</div>`;
    h += `<div class="dim">tithi ${devi.tithi_position || tithi} · N=${devi.N}-fold</div>`;
    h += `<div class="sep"></div>`;

    if (devi.bija) h += `<div style="font-size:18px;color:var(--teal);margin-bottom:4px">${devi.bija}</div>`;
    if (devi.mantra_short) h += `<div class="dim">${devi.mantra_short}</div>`;
    h += `<div class="sep"></div>`;

    h += `<div class="hdr">CHARACTER</div>`;
    h += `<div class="dim" style="line-height:1.5;font-style:italic">${devi.character || ''}</div>`;
    h += `<div class="sep"></div>`;

    h += `<div class="hdr">ATTRIBUTES</div>`;
    if (devi.element) h += `<div class="dim">element: ${devi.element}</div>`;
    if (devi.guna) h += `<div class="dim">guna: ${devi.guna}</div>`;
    if (devi.graha) h += `<div class="dim">graha: ${devi.graha}</div>`;
    if (devi.shakti) h += `<div class="dim">shakti: ${devi.shakti}</div>`;
    if (devi.rasa) h += `<div class="dim">rasa: ${devi.rasa}</div>`;
    h += `<div class="sep"></div>`;

    if (devi.attestation) {
      h += `<div class="hdr">ATTESTATION</div>`;
      h += `<div class="dim">${devi.attestation}</div>`;
      if (devi.source_text) h += `<div class="dim" style="font-size:8px;margin-top:2px">${devi.source_text.slice(0, 120)}</div>`;
    }

    document.getElementById('info').innerHTML = h;
  }

  // Render the quasicrystal field on canvas
  renderDeviCanvas(devi, tithi);
}

async function renderDeviCanvas(devi, tithi) {
  const canvas = document.getElementById('devi-canvas');
  const ctx = canvas.getContext('2d');
  const size = 400;
  canvas.width = size;
  canvas.height = size;

  // Client-side rendering: N-fold multigrid cos interference
  const N = devi.N || 3;
  const phase = (devi.angular_position_degrees || 0) * Math.PI / 180;
  const k = devi.frequency_multiplier || 1;
  const color_hex = devi.color_hex || '#c8a96e';

  // Parse color
  const cr = parseInt(color_hex.slice(1, 3), 16) || 200;
  const cg = parseInt(color_hex.slice(3, 5), 16) || 169;
  const cb = parseInt(color_hex.slice(5, 7), 16) || 110;

  // Compute field client-side (fast for 400x400)
  const imageData = ctx.createImageData(size, size);
  const half = size / 2;
  const scale = 4 * k;

  for (let py = 0; py < size; py++) {
    for (let px = 0; px < size; px++) {
      const x = (px - half) / (size / scale);
      const y = (py - half) / (size / scale);

      let v = 0;
      for (let j = 0; j < N; j++) {
        const angle = 2 * Math.PI * j / N + phase;
        const proj = x * Math.cos(angle) + y * Math.sin(angle);
        v += Math.cos(proj);
      }

      // Normalize: v ranges from -N to +N
      const norm = (v + N) / (2 * N);

      const idx = (py * size + px) * 4;
      imageData.data[idx] = Math.floor(norm * cr);
      imageData.data[idx + 1] = Math.floor(norm * cg);
      imageData.data[idx + 2] = Math.floor(norm * cb);
      imageData.data[idx + 3] = Math.floor(40 + 200 * norm);
    }
  }

  ctx.putImageData(imageData, 0, 0);
}

// Tithi slider
document.getElementById('tithi-slider').addEventListener('input', function() {
  const tithi = parseInt(this.value);
  document.getElementById('tithi-val').textContent = tithi;
  loadDeviField(tithi);
});

load();setInterval(load,60000);
</script>
</body>
</html>
