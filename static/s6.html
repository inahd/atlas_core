<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>S6 · Līlā · Practice</title>
<link rel="stylesheet" href="/static/atlas-theme.css">
<script src="/static/atlas.js"></script>
<style>
body{background:var(--bg);color:var(--text);font-family:var(--font-mono);font-size:11px;min-height:100vh;display:flex;flex-direction:column}
.main{flex:1;padding:20px;max-width:640px;margin:0 auto;overflow-y:auto}
.now{font-family:var(--font-body);font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.3em;margin-bottom:4px}
.period{font-family:var(--font-body);font-size:24px;color:var(--gold);margin-bottom:2px}
.seva{font-size:12px;color:var(--muted);margin-bottom:14px}
.hdr{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.15em;margin-bottom:5px;margin-top:12px}.hdr:first-child{margin-top:0}
.val{font-family:var(--font-body);font-size:14px;color:var(--gold);margin-bottom:2px}.sub{font-size:11px;color:var(--text);margin-bottom:2px}.dim{font-size:10px;color:var(--dim);margin-bottom:2px}
.sep{height:1px;background:var(--border);margin:10px 0}
.act{font-size:10px;color:var(--muted);padding-left:6px;margin-bottom:1px}.act::before{content:'· '}
.avoid{font-size:10px;color:var(--red);opacity:.7;padding-left:6px;margin-bottom:1px}.avoid::before{content:'✗ '}
.sc-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:3px}
.footer{background:var(--panel);border-top:1px solid var(--border);height:28px;display:flex;align-items:center;justify-content:center;gap:12px;font-size:10px;color:var(--dim)}
.footer .nak{font-family:var(--font-body);color:var(--gold);font-size:12px}
.nav{position:fixed;right:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px}
.nav a{width:8px;height:8px;border-radius:50%;border:1px solid var(--border);display:block;text-decoration:none}.nav a.on{background:var(--purple);border-color:var(--purple)}.nav a:hover{border-color:var(--gold)}
</style>
</head>
<body>
<div class="main" id="c">◌</div>
<div class="footer"><span id="fn" class="nak">—</span><span id="ft">—</span><span id="fv">—</span><span id="fd">—</span><span style="width:6px;height:6px;border-radius:50%;background:var(--teal)"></span></div>
<nav class="nav"><a href="/s0"></a><a href="/s1"></a><a href="/s2"></a><a href="/s3"></a><a href="/s4"></a><a href="/s5"></a><a href="/s6" class="on"></a></nav>
<script>
function dv(o){return typeof o==='object'&&o?(o.name||'—'):(o||'—')}
async function load(){
  const[din,f,gol,snd]=await Promise.all([atlasGet('/dinacharya',{}),atlasGet('/field',{}),atlasGet('/goloka',{}),atlasGet('/sound/state',{})]);
  const pa=f?.panchanga||{},ss=f?.sound_state||{};
  document.getElementById('fn').textContent=pa.nakshatra||'—';document.getElementById('ft').textContent=pa.tithi||'—';
  document.getElementById('fv').textContent=pa.vara||'—';document.getElementById('fd').textContent=dv(pa.devi);
  const ap=gol?.ashtakala_period||{};
  let h=`<div class="now">what to do now</div>`;
  h+=`<div class="period">${din?.ashtakala_period||ap.name||'—'}</div>`;
  if(ap.time_approximate)h+=`<div class="dim">${ap.time_approximate}</div>`;
  h+=`<div class="seva">${din?.primary_activity?.replace(/_/g,' ')||ap.mood||''}</div>`;
  // Practice
  h+=`<div class="hdr">PRACTICE</div>`;
  if(din?.mantra)h+=`<div class="sub">mantra: ${din.mantra}</div>`;
  if(din?.offering)h+=`<div class="sub">offering: ${din.offering}</div>`;
  if(din?.recommended_practices?.length)(din.recommended_practices).forEach(p=>h+=`<div class="act">${p}</div>`);
  // Sound
  const raga=ss.raga||snd?.raga||ap.raga||'';
  if(raga){h+=`<div class="sep"></div><div class="hdr">SOUND</div>`;
    h+=`<div class="val">${raga}</div>`;
    const tala=ss.tala||snd?.tala||'';const bpm=ss.bpm||snd?.bpm||'';
    if(tala||bpm)h+=`<div class="dim">${tala}${bpm?' · '+bpm+'bpm':''}</div>`;
    const sc=snd?.sc||{};const scOk=sc.status==='booted'||sc.status==='ready';
    h+=`<div style="margin-top:4px;font-size:10px"><span class="sc-dot" style="background:${scOk?'var(--teal)':'var(--dim)'}"></span>SC ${scOk?'running':'stopped'}</div>`}
  // Goloka
  const fo=gol?.active_forest||{};
  if(fo.name){h+=`<div class="sep"></div><div class="hdr">FOREST</div><div class="sub" style="font-style:italic">${fo.name}</div>`;if(fo.lila)h+=`<div class="dim">${fo.lila}</div>`}
  if(ap.presiding_sakhi)h+=`<div class="dim" style="color:var(--purple)">${ap.presiding_sakhi}</div>`;
  // Dietary
  if(din?.dietary_guidance){h+=`<div class="sep"></div><div class="hdr">DIETARY</div><div class="sub">${din.dietary_guidance}</div>`}
  if(din?.recommended_herbs?.length){h+=`<div class="hdr">HERBS</div>`;din.recommended_herbs.forEach(hb=>h+=`<div class="act">${hb}</div>`)}
  // Avoid
  if(din?.avoid?.length){h+=`<div class="sep"></div><div class="hdr">AVOID</div>`;din.avoid.slice(0,5).forEach(a=>h+=`<div class="avoid">${a.replace(/_/g,' ')}</div>`)}
  document.getElementById('c').innerHTML=h;
}
load();setInterval(load,60000);
</script>
</body>
</html>
