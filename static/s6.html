<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>S6 · continuity</title>
<style>
:root{--bg:#02030a;--panel:#080c14;--border:#0e1420;--gold:#c8941a;--teal:#1a8a7a;--purple:#7060cc;--text:#8a9ab0;--dim:#3a4a5a;--bright:#c8d8e8}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Courier New',monospace;font-size:10px;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.layer-strip{height:24px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 12px;flex-shrink:0}
.layer-left{display:flex;align-items:center;gap:8px}
.layer-id{font-size:9px;color:var(--dim)}
.layer-name{font-size:10px;color:var(--purple);font-family:Georgia,serif}
.layer-clock{font-size:9px;color:var(--dim)}
.main{flex:1;overflow-y:auto;padding:16px}
.field-strip{height:20px;background:var(--panel);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:center;gap:12px;font-size:9px;color:var(--dim);flex-shrink:0}
.block-header{font-size:8px;text-transform:uppercase;color:var(--dim);letter-spacing:0.12em;margin-bottom:8px;margin-top:20px}
.block-header:first-child{margin-top:0}
.dasha-lord{font-family:Georgia,serif;font-size:16px;color:var(--gold);margin-bottom:2px}
.dim{font-size:9px;color:var(--dim);margin-bottom:2px}
.detail{font-size:10px;color:var(--text);margin-bottom:2px}
.progress-bar{width:100%;height:3px;background:var(--border);border-radius:1px;margin:6px 0}
.progress-fill{height:100%;background:var(--purple);border-radius:1px}
.goloka-period{font-size:10px;color:var(--gold);margin-bottom:2px}
.reading-entity{font-size:10px;color:var(--gold);margin-bottom:2px}
.reading-text{font-family:Georgia,serif;font-size:10px;color:var(--text);line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:2px}
.recommend{font-size:9px;color:var(--text);line-height:1.4;margin-bottom:2px}
.home-link{position:fixed;bottom:8px;right:8px;font-family:'Courier New',monospace;font-size:8px;color:var(--dim);text-decoration:none;letter-spacing:0.15em}
</style>
</head>
<body>
<div class="layer-strip">
  <div class="layer-left"><span class="layer-id">S6</span><span class="layer-name">continuity</span></div>
  <span class="layer-clock" id="clock"></span>
</div>
<div class="main">
  <div class="block-header">DASHA</div>
  <div id="dasha">◌ loading</div>
  <div class="block-header">GOLOKA</div>
  <div id="goloka">◌</div>
  <div class="block-header">READING</div>
  <div id="reading">◌</div>
  <div class="block-header">INTENTION</div>
  <div id="intention">◌</div>
</div>
<div class="field-strip" id="field-strip">◌</div>
<a href="/" class="home-link">✦ ATLAS</a>
<script>
function tick(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('en-GB',{hour12:false})}
tick();setInterval(tick,1000);

function p(d,path,fb){let v=d;for(const k of path.split('.')){if(!v)return fb;v=v[k]}return(typeof v==='object'&&v!==null)?(v.name||fb):v||fb}

// Mercury dasha: Sep 2010 → Oct 2027
const dashaStart=new Date('2010-09-01').getTime();
const dashaEnd=new Date('2027-10-01').getTime();

async function load(){
  try{
    const[fr,tr,gr,ir]=await Promise.all([
      fetch('/field'),fetch('/trajectory'),fetch('/goloka'),fetch('/intention/now')
    ]);
    const d=await fr.json();
    let tj={};try{tj=await tr.json()}catch(e){}
    let gk={};try{gk=await gr.json()}catch(e){}
    let intent={};try{intent=await ir.json()}catch(e){}

    const nak=p(d,'panchanga.nakshatra','—');
    const tithi=p(d,'panchanga.tithi','—');
    const vara=p(d,'panchanga.vara','—');
    const devi=p(d,'panchanga.devi','—');
    document.getElementById('field-strip').textContent=[nak,tithi,vara,devi].join(' · ');

    // Dasha
    const lord=tj.dasha_lord||tj.dasha?.lord||p(tj,'dasha','Mercury');
    const end=tj.dasha_end||tj.dasha?.end_date||'Oct 2027';
    const subDasha=tj.sub_dasha||tj.dasha?.sub||tj.antardasha||'';
    const now=Date.now();
    const pct=Math.min(100,Math.max(0,((now-dashaStart)/(dashaEnd-dashaStart))*100));

    let dhtml='<div class="dasha-lord">'+(typeof lord==='object'?lord.name||'Mercury':lord)+'</div>';
    dhtml+='<div class="dim">ends '+(typeof end==='object'?end.name||'Oct 2027':end)+'</div>';
    dhtml+='<div class="progress-bar"><div class="progress-fill" style="width:'+pct.toFixed(1)+'%"></div></div>';
    if(subDasha)dhtml+='<div class="dim">sub: '+(typeof subDasha==='object'?subDasha.name||'':subDasha)+'</div>';
    document.getElementById('dasha').innerHTML=dhtml;

    // Goloka
    const ashta=gk.ashtakala||gk.period||'';
    const sakhi=gk.sakhi||gk.sakhi_name||'';
    const seva=gk.seva||gk.description||'';
    const forest=gk.forest||gk.setting||'';
    let ghtml='';
    if(ashta)ghtml+='<div class="goloka-period">'+(typeof ashta==='object'?ashta.name||'—':ashta)+'</div>';
    if(sakhi)ghtml+='<div class="detail">'+(typeof sakhi==='object'?sakhi.name||'':sakhi)+'</div>';
    if(seva)ghtml+='<div class="dim">'+seva+'</div>';
    if(forest)ghtml+='<div class="dim" style="font-style:italic">'+forest+'</div>';
    document.getElementById('goloka').innerHTML=ghtml||'◌';

    // Reading — try /reading/bandhu
    try{
      const rr=await fetch('/reading/bandhu');
      const rd=await rr.json();
      const entity=rd.primary_entity||rd.entity||rd.bandhu||'';
      const pada=rd.pada||rd.excerpt||rd.passage||rd.text||'';
      let rhtml='';
      if(entity)rhtml+='<div class="reading-entity">'+(typeof entity==='object'?entity.name||'':entity)+'</div>';
      if(pada)rhtml+='<div class="reading-text">'+pada+'</div>';
      document.getElementById('reading').innerHTML=rhtml||'◌';
    }catch(e){document.getElementById('reading').textContent='◌'}

    // Intention
    const rec=intent.recommendation||intent.current||intent.suggestion||'';
    const window=intent.favorable_window||intent.window||intent.time||'';
    let ihtml='';
    if(rec)ihtml+='<div class="recommend">'+rec+'</div>';
    if(window)ihtml+='<div class="dim">'+window+'</div>';
    document.getElementById('intention').innerHTML=ihtml||'◌';
  }catch(e){document.getElementById('field-strip').textContent='◌'}
}

load();setInterval(load,60000);
</script>
</body>
</html>
